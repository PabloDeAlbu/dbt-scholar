version: 2

models:
  - name: unlp_sedici_revistas_universo_autores
    description: >
      Identidades de autor utilizadas por el análisis de artículos de revistas.
      Una fila por `author_id`, sin asignar una afiliación general a la persona.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_universe_identity_basis_is_consistent
          expression: >
            (identity_basis = 'authority' and has_authority_control)
            or
            (identity_basis = 'normalized_name' and not has_authority_control)
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_universe_voc_match_has_authority
          expression: "not has_voc_match or has_authority_control"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_universe_publication_counts_are_ordered
          expression: >
            sedici_publication_count >= journal_publication_count
            and journal_publication_count >= journal_article_count
            and journal_article_count > 0
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_universe_publication_period_is_valid
          expression: >
            (first_publication_year is null and last_publication_year is null)
            or
            (
              first_publication_year is not null
              and last_publication_year is not null
              and first_publication_year <= last_publication_year
            )
    columns:
      - name: author_id
        description: Identificador técnico de la identidad de autor en SEDICI.
        data_tests:
          - not_null
          - unique
          - relationships:
              name: sedici_revistas_author_universe_in_sedici_author_dim
              to: ref('dim_unlp_sedicidb_author')
              field: author_id
      - name: author_name
        description: Forma preferida del nombre observada en SEDICI.
        data_tests: [not_null]
      - name: author_name_normalized
        description: Nombre normalizado utilizado para comparar variantes.
        data_tests: [not_null]
      - name: identity_basis
        description: Base de identidad; `authority` o `normalized_name`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['authority', 'normalized_name']
      - name: authority_uri
        description: URI de authority cuando está informada.
      - name: authority_host
        description: Host de la URI de authority.
      - name: has_authority_control
        description: Indica si la identidad se construyó con una authority.
        data_tests: [not_null]
      - name: voc_person_node_id
        description: Identificador de persona VOC enlazado mediante la authority.
      - name: has_voc_match
        description: Indica si la authority corresponde a una persona en VOC.
        data_tests: [not_null]
      - name: observed_name_variant_count
        description: Variantes textuales del nombre observadas para la identidad.
        data_tests: [not_null]
      - name: sedici_publication_count
        description: Publicaciones visibles de todo SEDICI donde la identidad figura como autor personal.
        data_tests: [not_null]
      - name: journal_publication_count
        description: Publicaciones visibles bajo la comunidad raíz `Revistas` asociadas con la identidad.
        data_tests: [not_null]
      - name: journal_article_count
        description: Publicaciones de revistas clasificadas como artículos asociadas con la identidad.
        data_tests: [not_null]
      - name: journal_count
        description: Revistas distintas en las que aparece la identidad.
        data_tests: [not_null]
      - name: first_publication_year
        description: Primer año de publicación observado en el análisis.
      - name: last_publication_year
        description: Último año de publicación observado en el análisis.
      - name: normalized_name_identity_count
        description: Identidades del universo que comparten el mismo nombre normalizado.
        data_tests: [not_null]
      - name: has_shared_normalized_name
        description: Indica si el nombre normalizado representa más de una identidad.
        data_tests: [not_null]

  - name: dim_unlp_sedici_revista
    description: >
      Universo de revistas de SEDICI a grano una fila por revista. Considera
      revista a cada comunidad hija directa de la comunidad raíz `Revistas`;
      las comunidades descendientes quedan interpretadas como secciones.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_closed_flag_is_consistent
          expression: "is_closed = (journal_title like '%[Publicación cerrada]%')"
    columns:
      - name: journal_id
        description: Identificador de la comunidad SEDICI que representa la revista.
        data_tests:
          - not_null
          - unique
          - relationships:
              name: sedici_revistas_journal_in_sedici_community_dim
              to: ref('dim_unlp_sedicidb_community')
              field: community_id
      - name: journal_title
        description: Título vigente de la comunidad que representa la revista.
        data_tests: [not_null]
      - name: journal_handle
        description: Handle persistente de la comunidad que representa la revista.
        data_tests: [not_null, unique]
      - name: is_closed
        description: Indica si el título de la comunidad contiene el marcador `[Publicación cerrada]`.
        data_tests: [not_null]
      - name: root_community_id
        description: Identificador de la comunidad raíz `Revistas`.
        data_tests: [not_null]
      - name: root_community_title
        description: Título de la comunidad raíz; siempre `Revistas`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Revistas']
      - name: journal_path_ids
        description: Camino de IDs desde la raíz `Revistas` hasta la revista.
        data_tests: [not_null]
      - name: journal_path_titles
        description: Camino de títulos desde la raíz `Revistas` hasta la revista.
        data_tests: [not_null]

  - name: fct_unlp_sedici_revista_publicacion
    description: >
      Ítems publicados y visibles bajo las comunidades interpretadas como
      revistas. Una fila por `item_id`, sin exigir tipo, fecha ni autor.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_item_is_valid_sedici_item
          expression: >
            in_archive is true
            and withdrawn is false
            and discoverable is true
            and handle is not null
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_item_journal_matches_path
          expression: >
            journal_id = split_part(owning_community_path_ids, ' > ', 2)::bigint
            and journal_title = split_part(owning_community_path_titles, ' > ', 2)
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_item_article_flag_is_consistent
          expression: >
            is_article = (
              sedici_subtype in (
                'Articulo',
                'Comunicacion',
                'Contribucion a revista',
                'Revision'
              )
            )
    columns:
      - name: item_id
        description: Identificador del ítem en SEDICI.
        data_tests:
          - not_null
          - unique
          - relationships:
              name: sedici_revistas_journal_item_in_sedici_fact
              to: ref('fct_unlp_sedicidb_item_publication')
              field: item_id
      - name: handle
        description: Handle institucional del ítem.
        data_tests: [not_null]
      - name: item_url
        description: URL pública informada en `dc.identifier.uri`.
      - name: item_title
        description: Título vigente del ítem.
        data_tests: [not_null]
      - name: dc_type
        description: Categoría general vigente informada por `dc.type`.
        data_tests: [not_null]
      - name: sedici_subtype
        description: Subtipo específico vigente informado por `sedici.subtype`.
        data_tests: [not_null]
      - name: publication_date
        description: Fecha de publicación; puede faltar o ser imprecisa.
      - name: publication_year
        description: Año derivado de la fecha de publicación.
      - name: journal_id
        description: Identificador de la comunidad que representa la revista.
        data_tests:
          - not_null
          - relationships:
              name: sedici_revistas_journal_item_journal_in_universe
              to: ref('dim_unlp_sedici_revista')
              field: journal_id
      - name: journal_title
        description: Nombre de la revista.
        data_tests: [not_null]
      - name: journal_handle
        description: Handle persistente de la comunidad que representa la revista.
        data_tests: [not_null]
      - name: is_closed
        description: Indica si la revista está marcada como publicación cerrada en SEDICI.
        data_tests: [not_null]
      - name: owning_root_community_title
        description: Comunidad raíz; siempre `Revistas`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Revistas']
      - name: owning_community_path_ids
        description: Jerarquía de identificadores de comunidades del ítem.
        data_tests: [not_null]
      - name: owning_community_path_titles
        description: Jerarquía de nombres de comunidades del ítem.
        data_tests: [not_null]
      - name: in_archive
        description: Indica que el ítem fue incorporado al repositorio.
        data_tests: [not_null]
      - name: withdrawn
        description: Indica si el ítem fue retirado.
        data_tests: [not_null]
      - name: discoverable
        description: Indica si el ítem es visible mediante búsqueda.
        data_tests: [not_null]
      - name: is_article
        description: >
          Indica si `sedici.subtype` corresponde a una de las categorías de
          artículo definidas para este análisis.
        data_tests: [not_null]

  - name: brg_unlp_sedici_revista_publicacion_autor
    description: >
      Relación descriptiva entre ítems de revistas e identidades de autores
      personales. Una fila por `item_id` y `author_id`, sin afiliaciones.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: sedici_revistas_journal_item_author_unique_grain
          combination_of_columns: [item_id, author_id]
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_item_author_authority_is_consistent
          expression: "has_authority_control = (authority_uri is not null)"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_item_author_voc_match_has_person
          expression: "not has_voc_match or voc_person_node_id is not null"
    columns:
      - name: item_id
        description: Identificador del ítem de revista.
        data_tests:
          - not_null
          - relationships:
              name: sedici_revistas_journal_item_author_item_in_fact
              to: ref('fct_unlp_sedici_revista_publicacion')
              field: item_id
      - name: author_id
        description: Identificador técnico de la identidad de autor.
        data_tests:
          - not_null
          - relationships:
              name: sedici_revistas_journal_item_author_in_sedici_author_dim
              to: ref('dim_unlp_sedicidb_author')
              field: author_id
      - name: author_name
        description: Forma preferida del nombre del autor.
        data_tests: [not_null]
      - name: author_name_normalized
        description: Nombre normalizado de la identidad.
        data_tests: [not_null]
      - name: author_place
        description: Posición informada en la lista de autores.
      - name: metadata_value_id
        description: Observación de metadato elegida para la relación.
        data_tests: [not_null]
      - name: authority_uri
        description: URI de authority de la identidad, cuando existe.
      - name: has_authority_control
        description: Indica si la identidad tiene una authority.
        data_tests: [not_null]
      - name: voc_person_node_id
        description: Identificador de persona enlazado en VOC.
      - name: has_voc_match
        description: Indica si la authority corresponde a una persona en VOC.
        data_tests: [not_null]
      - name: journal_id
        description: Identificador de la revista del ítem.
        data_tests: [not_null]
      - name: journal_title
        description: Nombre de la revista del ítem.
        data_tests: [not_null]
      - name: publication_date
        description: Fecha de publicación del ítem.
      - name: publication_year
        description: Año de publicación del ítem.
      - name: is_article
        description: Indica si el ítem fue clasificado como artículo.
        data_tests: [not_null]

  - name: unlp_sedici_revistas_dashboard
    description: >
      Fuente principal del dashboard a grano ítem y autor personal. Conserva
      una fila con autor nulo para los ítems sin autor reconocido y permite que
      los filtros de revista y período alcancen publicaciones y autores.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: sedici_revistas_dashboard_unique_grain
          combination_of_columns: [handle_publicacion, id_autor]
      - dbt_utils.expression_is_true:
          name: sedici_revistas_dashboard_author_fields_are_consistent
          expression: >
            (
              id_autor is null
              and id_autoria is null
              and nombre_autor is null
              and base_identidad_autor is null
              and not tiene_autor_reconocido
              and not tiene_autoridad
              and not tiene_correspondencia_voc
            )
            or
            (
              id_autor is not null
              and id_autoria is not null
              and nombre_autor is not null
              and base_identidad_autor is not null
              and tiene_autor_reconocido
              and (not tiene_correspondencia_voc or tiene_autoridad)
            )
      - dbt_utils.expression_is_true:
          name: sedici_revistas_dashboard_publication_counts_are_ordered
          expression: >
            (
              id_autor is null
              and publicaciones_autor_en_sedici is null
              and publicaciones_autor_en_revistas is null
              and articulos_autor_en_revistas is null
            )
            or
            (
              id_autor is not null
              and publicaciones_autor_en_sedici >= publicaciones_autor_en_revistas
              and publicaciones_autor_en_revistas >= articulos_autor_en_revistas
              and articulos_autor_en_revistas >= 0
            )
      - dbt_utils.expression_is_true:
          name: sedici_revistas_dashboard_closed_flag_is_consistent
          expression: "es_cerrada = (revista like '%[Publicación cerrada]%')"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_dashboard_publication_handle_url_is_consistent
          expression: "url_handle_publicacion = 'https://hdl.handle.net/' || handle_publicacion"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_dashboard_journal_handle_url_is_consistent
          expression: "url_handle_revista = 'https://hdl.handle.net/' || handle_revista"
    columns:
      - name: handle_publicacion
        description: Handle persistente de la publicación.
        data_tests: [not_null]
      - name: url_handle_publicacion
        description: URL de resolución del handle persistente de la publicación.
        data_tests: [not_null]
      - name: url_publicacion
        description: URL pública de la publicación en SEDICI.
      - name: titulo_publicacion
        description: Título vigente de la publicación.
        data_tests: [not_null]
      - name: tipo_publicacion
        description: Subtipo específico informado por `sedici.subtype`.
        data_tests: [not_null]
      - name: fecha_publicacion
        description: Fecha de publicación informada.
      - name: anio_publicacion
        description: Año derivado de la fecha de publicación.
      - name: es_articulo
        description: Indica si el subtipo se considera un artículo para este análisis.
        data_tests: [not_null]
      - name: revista
        description: Nombre vigente de la revista en SEDICI.
        data_tests: [not_null]
      - name: handle_revista
        description: Handle persistente de la comunidad que representa la revista.
        data_tests: [not_null]
      - name: url_handle_revista
        description: URL de resolución del handle persistente de la revista.
        data_tests: [not_null]
      - name: es_cerrada
        description: Indica si la revista está marcada como publicación cerrada en SEDICI.
        data_tests: [not_null]
      - name: ruta_en_sedici
        description: Jerarquía de comunidades del ítem.
        data_tests: [not_null]
      - name: nombre_autor
        description: Nombre preferido del autor.
      - name: tiene_autor_reconocido
        description: Indica si la fila representa una relación ítem-autor reconocida.
        data_tests: [not_null]
      - name: tiene_autoridad
        description: Indica si la identidad del autor se construyó con una authority.
        data_tests: [not_null]
      - name: tiene_correspondencia_voc
        description: Indica si la authority corresponde a una persona en VOC.
        data_tests: [not_null]
      - name: url_autor_voc
        description: URL pública de la persona en VOC SEDICI, cuando existe correspondencia.
      - name: publicaciones_autor_en_sedici
        description: >
          Publicaciones visibles de todo SEDICI donde la identidad figura como
          autor personal. Es un atributo del autor y debe agregarse con `MAX`.
      - name: publicaciones_autor_en_revistas
        description: >
          Publicaciones visibles bajo la comunidad raíz `Revistas` donde la
          identidad figura como autor. Debe agregarse con `MAX`.
      - name: articulos_autor_en_revistas
        description: >
          Publicaciones de revistas clasificadas como artículos donde aparece
          la identidad. Debe agregarse con `MAX`.
      - name: id_autor
        description: >
          Clave analítica provisional de la identidad de autor en SEDICI. Se
          conserva para realizar conteos distintos sin mezclar homónimos.
        data_tests:
          - relationships:
              name: sedici_revistas_dashboard_author_in_dimension
              to: ref('dim_unlp_sedicidb_author')
              field: author_id
      - name: id_autoria
        description: Clave analítica de la relación entre publicación y autor.
        data_tests: [unique]
      - name: base_identidad_autor
        description: Indica si la identidad se basa en una autoridad o en el nombre normalizado.
        data_tests:
          - accepted_values:
              values: ['autoridad', 'nombre_normalizado']

  - name: unlp_sedici_revistas_panorama
    description: >
      Panorama por revista desde ítems publicados hasta artículos con autor
      identificado, sin clasificar todavía su afiliación.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_overview_items_reconcile
          expression: "published_item_count = article_item_count + other_item_count"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_overview_articles_reconcile
          expression: "article_item_count = dated_article_count + undated_article_count"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_overview_author_coverage_reconciles
          expression: >
            dated_article_count
            = article_with_author_count + article_without_author_count
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_overview_period_is_valid
          expression: "first_publication_year <= last_publication_year"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_overview_coverage_is_valid
          expression: >
            (dated_article_count = 0 and article_author_coverage_pct is null)
            or
            (dated_article_count > 0 and article_author_coverage_pct between 0 and 100)
    columns:
      - name: journal_id
        description: Identificador de la revista en SEDICI.
        data_tests: [not_null, unique]
      - name: journal_title
        description: Nombre de la revista.
        data_tests: [not_null]
      - name: published_item_count
        description: Ítems publicados y visibles de la revista.
        data_tests: [not_null]
      - name: article_item_count
        description: Ítems clasificados como artículos mediante `sedici.subtype`.
        data_tests: [not_null]
      - name: dated_article_count
        description: Artículos con fecha y año utilizables.
        data_tests: [not_null]
      - name: undated_article_count
        description: Artículos sin fecha o año utilizables.
        data_tests: [not_null]
      - name: other_item_count
        description: Ítems cuyo subtipo no se clasificó como artículo.
        data_tests: [not_null]
      - name: article_with_author_count
        description: Artículos con al menos un autor personal reconocido.
        data_tests: [not_null]
      - name: article_without_author_count
        description: Artículos fechados sin autor personal reconocido.
        data_tests: [not_null]
      - name: authorship_count
        description: Relaciones entre artículos y autores.
        data_tests: [not_null]
      - name: author_identity_count
        description: Identidades de autor distintas observadas en la revista.
        data_tests: [not_null]
      - name: authority_identity_count
        description: Identidades construidas mediante una authority.
        data_tests: [not_null]
      - name: voc_identity_count
        description: Identidades enlazadas con una persona en VOC.
        data_tests: [not_null]
      - name: article_author_coverage_pct
        description: Porcentaje de artículos fechados con autor reconocido.
      - name: first_publication_year
        description: Primer año de publicación observado en la revista.
        data_tests: [not_null]
      - name: last_publication_year
        description: Último año de publicación observado en la revista.
        data_tests: [not_null]

  - name: unlp_sedici_revistas_por_anio
    description: >
      Evolución descriptiva por revista y año a partir de los ítems con año de
      publicación, sin clasificar afiliaciones de autores.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: sedici_revistas_journal_year_overview_unique_grain
          combination_of_columns: [journal_id, publication_year]
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_year_overview_items_reconcile
          expression: "published_item_count = article_item_count + other_item_count"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_year_overview_authors_reconcile
          expression: >
            article_item_count
            = article_with_author_count + article_without_author_count
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_year_overview_coverage_is_valid
          expression: >
            (article_item_count = 0 and article_author_coverage_pct is null)
            or
            (article_item_count > 0 and article_author_coverage_pct between 0 and 100)
    columns:
      - name: journal_id
        description: Identificador de la revista en SEDICI.
        data_tests: [not_null]
      - name: journal_title
        description: Nombre de la revista.
        data_tests: [not_null]
      - name: publication_year
        description: Año de publicación del grupo.
        data_tests: [not_null]
      - name: published_item_count
        description: Ítems con año de publicación en la revista.
        data_tests: [not_null]
      - name: article_item_count
        description: Ítems del año clasificados como artículos.
        data_tests: [not_null]
      - name: other_item_count
        description: Ítems del año no clasificados como artículos.
        data_tests: [not_null]
      - name: article_with_author_count
        description: Artículos del año con autor personal reconocido.
        data_tests: [not_null]
      - name: article_without_author_count
        description: Artículos del año sin autor personal reconocido.
        data_tests: [not_null]
      - name: authorship_count
        description: Relaciones entre artículos y autores en el año.
        data_tests: [not_null]
      - name: author_identity_count
        description: Identidades de autor distintas observadas en el año.
        data_tests: [not_null]
      - name: article_author_coverage_pct
        description: Porcentaje de artículos del año con autor reconocido.

  - name: unlp_sedici_revistas_cobertura_general
    description: >
      Perfil general de autorías agrupado por estado y evidencia de afiliación.
      Expone volumen, participación y cobertura de authorities y matches VOC.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: sedici_revistas_journal_article_author_coverage_unique_grain
          combination_of_columns: [affiliation_status, affiliation_evidence]
      - dbt_utils.expression_is_true:
          name: sedici_revistas_article_author_coverage_pct_in_range
          expression: >
            authorship_share_pct between 0 and 100
            and authority_coverage_pct between 0 and 100
            and voc_match_coverage_pct between 0 and 100
    columns:
      - name: affiliation_status
        description: Clasificación de la afiliación de la autoría.
        data_tests: [not_null]
      - name: affiliation_evidence
        description: Evidencia utilizada para producir la clasificación.
        data_tests: [not_null]
      - name: authorship_count
        description: Cantidad de autorías del grupo.
        data_tests: [not_null]
      - name: article_count
        description: Artículos distintos representados en el grupo.
        data_tests: [not_null]
      - name: unique_author_count
        description: Autores distintos representados en el grupo.
        data_tests: [not_null]
      - name: authority_control_count
        description: Autorías con authority informada.
        data_tests: [not_null]
      - name: voc_match_count
        description: Autorías enlazadas con una persona en VOC.
        data_tests: [not_null]
      - name: authorship_share_pct
        description: Participación porcentual del grupo sobre todas las autorías.
        data_tests: [not_null]
      - name: authority_coverage_pct
        description: Porcentaje del grupo con authority informada.
        data_tests: [not_null]
      - name: voc_match_coverage_pct
        description: Porcentaje del grupo enlazado con una persona en VOC.
        data_tests: [not_null]

  - name: fct_unlp_sedici_revista_articulo_autor
    description: >
      Autorías de artículos de revistas UNLP. Una fila por `item_id` y
      `author_id`, con afiliación a la fecha de publicación.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: sedici_revistas_journal_article_author_unique_grain
          combination_of_columns: [item_id, author_id]
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_article_author_is_valid_sedici_item
          expression: >
            in_archive is true
            and withdrawn is false
            and discoverable is true
            and handle is not null
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_article_author_is_journal_article
          expression: >
            owning_root_community_title = 'Revistas'
            and sedici_subtype in (
              'Articulo',
              'Comunicacion',
              'Contribucion a revista',
              'Revision'
            )
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_article_author_journal_matches_path
          expression: >
            journal_id = split_part(owning_community_path_ids, ' > ', 2)::bigint
            and journal_title = split_part(owning_community_path_titles, ' > ', 2)
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_article_author_year_matches_date
          expression: "publication_year = extract(year from publication_date)::integer"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_article_author_voc_match_has_person
          expression: "not has_voc_match or voc_person_node_id is not null"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_article_author_unlp_has_voc_evidence
          expression: "affiliation_status <> 'unlp' or has_voc_match"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_article_author_external_has_voc_evidence
          expression: "affiliation_status <> 'external' or has_voc_match"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_article_author_nonnegative_affiliation_counts
          expression: "unlp_institution_count >= 0 and external_institution_count >= 0"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_article_author_unlp_count_consistent
          expression: "affiliation_status <> 'unlp' or unlp_institution_count > 0"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_article_author_external_count_consistent
          expression: >
            affiliation_status <> 'external'
            or (external_institution_count > 0 and unlp_institution_count = 0)
    columns:
      - name: item_id
        description: Identificador del artículo en SEDICI.
        data_tests:
          - not_null
          - relationships:
              name: sedici_revistas_journal_article_author_item_in_sedici_fact
              to: ref('fct_unlp_sedicidb_item_publication')
              field: item_id
      - name: author_id
        description: Identificador de autor en SEDICI.
        data_tests:
          - not_null
          - relationships:
              name: sedici_revistas_journal_article_author_in_sedici_author_dim
              to: ref('dim_unlp_sedicidb_author')
              field: author_id
      - name: author_name
        description: Nombre preferido del autor.
        data_tests: [not_null]
      - name: author_place
        description: Posición en la lista de autores.
      - name: handle
        description: Handle institucional del artículo.
        data_tests: [not_null]
      - name: article_url
        description: URL pública del artículo.
        data_tests: [not_null]
      - name: article_title
        description: Título del artículo.
        data_tests: [not_null]
      - name: dc_type
        description: Categoría general vigente informada por `dc.type`.
        data_tests: [not_null]
      - name: sedici_subtype
        description: Subtipo específico usado para identificar artículos.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - Articulo
                - Comunicacion
                - Contribucion a revista
                - Revision
      - name: publication_date
        description: Fecha de publicación.
        data_tests: [not_null]
      - name: publication_year
        description: Año derivado de `publication_date`.
        data_tests: [not_null]
      - name: journal_id
        description: >
          ID de la comunidad que representa la revista, derivado como segundo
          nodo del camino bajo la comunidad raíz `Revistas`.
        data_tests:
          - not_null
          - relationships:
              name: sedici_revistas_journal_article_author_journal_in_universe
              to: ref('dim_unlp_sedici_revista')
              field: journal_id
      - name: journal_title
        description: >
          Nombre de la revista derivado como segundo nodo del camino de
          comunidades; no se confunde con posibles subcomunidades de sección.
        data_tests: [not_null]
      - name: owning_root_community_title
        description: Comunidad raíz; siempre `Revistas`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Revistas']
      - name: owning_community_path_titles
        description: Jerarquía de comunidades del artículo.
        data_tests: [not_null]
      - name: owning_community_path_ids
        description: Jerarquía de IDs de comunidades del artículo.
        data_tests: [not_null]
      - name: authority_uri
        description: URI de autoridad del autor.
      - name: has_authority_control
        description: Indica si el autor tiene URI de autoridad.
        data_tests: [not_null]
      - name: voc_person_node_id
        description: Identificador de persona en VOC.
      - name: has_voc_match
        description: Indica si el autor fue identificado en VOC.
        data_tests: [not_null]
      - name: affiliation_status
        description: >
          Afiliación al publicar: `unlp`, `external` o `unknown`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['unlp', 'external', 'unknown']
      - name: affiliation_evidence
        description: Evidencia usada para clasificar la afiliación.
        data_tests: [not_null]
      - name: unlp_institution_count
        description: Afiliaciones UNLP vigentes al publicar.
        data_tests: [not_null]
      - name: external_institution_count
        description: Afiliaciones externas vigentes al publicar.
        data_tests: [not_null]
  - name: unlp_sedici_revistas_ultimos_5_anios
    description: >
      Resumen de artículos, autorías y autores por revista y período.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: sedici_revistas_journal_author_affiliation_unique_grain
          combination_of_columns: [journal_id, period_start_year, period_end_year]
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_author_affiliation_period_is_valid
          expression: "period_start_year <= period_end_year"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_affiliation_authorships_reconcile
          expression: >
            authorship_count
            = unlp_authorship_count + external_authorship_count + unknown_authorship_count
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_affiliation_classified_reconciles
          expression: "classified_authorship_count = unlp_authorship_count + external_authorship_count"
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_affiliation_pct_in_range
          expression: >
            unlp_authorship_share_pct between 0 and 100
            and known_affiliation_coverage_pct between 0 and 100
      - dbt_utils.expression_is_true:
          name: sedici_revistas_journal_author_affiliation_counts_nonnegative
          expression: >
            article_count >= 0
            and authorship_count >= 0
            and unique_author_count >= 0
            and unique_unlp_author_count >= 0
            and unique_external_author_count >= 0
            and unique_unknown_author_count >= 0
      - dbt_utils.expression_is_true:
          name: sedici_revistas_author_affiliation_unlp_share_denominator
          expression: >
            (classified_authorship_count = 0 and unlp_authorship_share_pct is null)
            or
            (classified_authorship_count > 0 and unlp_authorship_share_pct is not null)
    columns:
      - name: journal_id
        description: Identificador estable de la revista en SEDICI.
        data_tests: [not_null]
      - name: journal_title
        description: Nombre de la revista.
        data_tests: [not_null]
      - name: period_start_year
        description: Primer año incluido en el resumen.
        data_tests: [not_null]
      - name: period_end_year
        description: Último año incluido en el resumen.
        data_tests: [not_null]
      - name: article_count
        description: Artículos distintos del período.
        data_tests: [not_null]
      - name: authorship_count
        description: Autorías del período.
        data_tests: [not_null]
      - name: unlp_authorship_count
        description: Autorías clasificadas como UNLP.
        data_tests: [not_null]
      - name: external_authorship_count
        description: Autorías clasificadas como externas.
        data_tests: [not_null]
      - name: unknown_authorship_count
        description: Autorías sin afiliación determinada.
        data_tests: [not_null]
      - name: classified_authorship_count
        description: Autorías clasificadas como UNLP o externas.
        data_tests: [not_null]
      - name: unlp_authorship_share_pct
        description: Porcentaje UNLP sobre autorías clasificadas.
      - name: known_affiliation_coverage_pct
        description: Porcentaje de autorías con afiliación clasificada.
        data_tests: [not_null]
      - name: unique_author_count
        description: Autores distintos del período.
        data_tests: [not_null]
      - name: unique_unlp_author_count
        description: Autores distintos clasificados como UNLP.
        data_tests: [not_null]
      - name: unique_external_author_count
        description: Autores distintos clasificados como externos.
        data_tests: [not_null]
      - name: unique_unknown_author_count
        description: Autores distintos sin afiliación determinada.
        data_tests: [not_null]
  - name: unlp_sedici_revistas_afiliacion_autores_por_anio
    description: >
      Resumen anual de artículos, autorías y autores por revista.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: sedici_revistas_author_affiliation_year_unique_grain
