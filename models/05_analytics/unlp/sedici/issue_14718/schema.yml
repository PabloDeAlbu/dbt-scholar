version: 2

models:
  - name: unlp_sedici_00_dedup_cic_lifia_sedici_smoke_candidate
    description: >
      Pares CIC–SEDICI con DOI o título normalizado exacto, utilizados sólo
      para construir una prueba local acotada del deduplicador.
    config:
      meta:
        issue: 14718
        model_role: dedup_smoke_candidate
        grain: cic_id_sedici_id
    columns:
      - name: cic_id
        data_tests: [not_null]
      - name: sedici_id
        data_tests: [not_null]
      - name: candidate_signal
        data_tests: [not_null]
      - name: signal_priority
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cic_id, sedici_id]

  - name: unlp_sedici_00_dedup_cic_lifia_sedici_smoke_input_1
    description: Muestra determinista de 100 publicaciones CIC con candidatos exactos en SEDICI.
    config:
      meta:
        issue: 14718
        input_number: 1
        model_role: dedup_smoke_input
        grain: id
    columns:
      - name: id
        data_tests: [not_null, unique]
      - name: source_system
        data_tests:
          - accepted_values:
              values: ['cicdigital']
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: "(select generate_series(1, 100))"

  - name: unlp_sedici_00_dedup_cic_lifia_sedici_smoke_input_2
    description: Muestra determinista de 100 publicaciones SEDICI relacionadas con el input 1.
    config:
      meta:
        issue: 14718
        input_number: 2
        model_role: dedup_smoke_input
        grain: id
    columns:
      - name: id
        data_tests: [not_null, unique]
      - name: source_system
        data_tests:
          - accepted_values:
              values: ['sedicidb']
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: "(select generate_series(1, 100))"

  - name: unlp_sedici_01_dedup_cic_lifia_sedici_input_1
    description: >
      Publicaciones elegibles de las dos colecciones LIFIA indicadas en el
      issue 14718, preparadas como input 1 del deduplicador CIC → SEDICI.
    config:
      meta:
        issue: 14718
        input_number: 1
        organization: cic
        source_system: cicdigital
        input_layer: org
        model_role: dedup_input
        business_process: publication_deduplication
        grain: id
        temporal_scope: current_snapshot
    columns:
      - name: source
        description: Origen fijo del registro; vale `cic_digital`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['cic_digital']
      - name: source_system
        description: Recorrido técnico utilizado; vale `cicdigital`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['cicdigital']
      - name: id
        description: Handle persistente del ítem en CIC Digital.
        data_tests: [not_null, unique]
      - name: title
        description: Títulos normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: type
        description: Tipo reconocido por el deduplicador.
        data_tests: [not_null]
      - name: author
        description: Autores normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: date
        description: Fecha de publicación reconocida en CIC Digital.
        data_tests: [not_null]
      - name: owning_collection_id
        description: UUID de una de las dos colecciones LIFIA definidas por el issue.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - '3da12564-7da1-4d08-9037-f706cc294a09'
                - 'ff4e8e87-449a-4df0-b424-07ef1b533e1e'

  - name: unlp_sedici_01_dedup_cic_lifia_sedici_input_2
    description: >
      Publicaciones elegibles del universo general de SEDICI, preparadas como
      input 2 del deduplicador CIC → SEDICI. No restringe por colección,
      entidad de origen ni autor institucional porque esas señales son
      incompletas para LIFIA según el issue 14718.
    config:
      meta:
        issue: 14718
        input_number: 2
        organization: unlp
        source_system: sedicidb
        input_layer: org
        model_role: dedup_input
        business_process: publication_deduplication
        grain: id
        temporal_scope: current_snapshot
    columns:
      - name: source
        description: Origen fijo del registro; vale `sedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sedici']
      - name: source_system
        description: Recorrido técnico utilizado; vale `sedicidb`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sedicidb']
      - name: id
        description: Handle institucional de la publicación en SEDICI.
        data_tests: [not_null, unique]
      - name: title
        description: Títulos normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: type
        description: Tipo reconocido por el deduplicador.
        data_tests: [not_null]
      - name: author
        description: Autores normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: date
        description: Fecha de publicación reconocida en SEDICI.
        data_tests: [not_null]

  - name: unlp_sedici_01_dedup_cic_lifia_sedici_input_1_dspacedb
    description: >
      Variante histórica del input 1, construida con la última observación de
      las colecciones LIFIA disponible en `dspacedb`.
    config:
      meta:
        issue: 14718
        input_number: 1
        organization: cic
        source_system: dspacedb
        input_layer: org
        model_role: dedup_input
        business_process: publication_deduplication
        grain: id
        temporal_scope: latest_historical_observation
    columns:
      - name: source
        description: Repositorio institucional; vale `cic_digital`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['cic_digital']
      - name: source_system
        description: Recorrido técnico utilizado; vale `dspacedb`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['dspacedb']
      - name: id
        description: Handle público de la publicación en CIC Digital.
        data_tests: [not_null, unique]
      - name: title
        description: Título utilizado por el deduplicador.
        data_tests: [not_null]
      - name: type
        description: Tipo reconocido por el deduplicador.
        data_tests: [not_null]
      - name: author
        description: Autores utilizados por el deduplicador.
        data_tests: [not_null]
      - name: date
        description: Fecha de publicación reconocida en CIC Digital.
        data_tests: [not_null]
      - name: owning_collection_id
        description: UUID de una de las dos colecciones LIFIA definidas por el issue.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - '3da12564-7da1-4d08-9037-f706cc294a09'
                - 'ff4e8e87-449a-4df0-b424-07ef1b533e1e'
