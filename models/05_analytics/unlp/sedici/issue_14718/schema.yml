version: 2

models:
  - name: unlp_sedici_01_dedup_cic_lifia_sedici_input_1
    description: >
      Publicaciones elegibles de las dos colecciones LIFIA indicadas en el
      issue 14718, preparadas como input 1 del deduplicador CIC → SEDICI.
    config:
      meta:
        issue: 14718
        input_number: 1
        organization: cic
        source_system: cicdigital
        input_layer: org
        model_role: dedup_input
        business_process: publication_deduplication
        grain: id
        temporal_scope: current_snapshot
    columns:
      - name: source
        description: Origen fijo del registro; vale `cic_digital`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['cic_digital']
      - name: id
        description: Handle persistente del ítem en CIC Digital.
        data_tests: [not_null, unique]
      - name: title
        description: Títulos normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: type
        description: Tipo reconocido por el deduplicador.
        data_tests: [not_null]
      - name: author
        description: Autores normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: date
        description: Fecha de publicación reconocida en CIC Digital.
        data_tests: [not_null]
      - name: owning_collection_id
        description: UUID de una de las dos colecciones LIFIA definidas por el issue.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - '3da12564-7da1-4d08-9037-f706cc294a09'
                - 'ff4e8e87-449a-4df0-b424-07ef1b533e1e'

  - name: unlp_sedici_01_dedup_cic_lifia_sedici_input_2
    description: >
      Publicaciones elegibles del universo general de SEDICI, preparadas como
      input 2 del deduplicador CIC → SEDICI. No restringe por colección,
      entidad de origen ni autor institucional porque esas señales son
      incompletas para LIFIA según el issue 14718.
    config:
      meta:
        issue: 14718
        input_number: 2
        organization: unlp
        source_system: sedicidb
        input_layer: org
        model_role: dedup_input
        business_process: publication_deduplication
        grain: id
        temporal_scope: current_snapshot
    columns:
      - name: source
        description: Origen fijo del registro; vale `sedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sedici']
      - name: id
        description: Handle institucional de la publicación en SEDICI.
        data_tests: [not_null, unique]
      - name: title
        description: Títulos normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: type
        description: Tipo reconocido por el deduplicador.
        data_tests: [not_null]
      - name: author
        description: Autores normalizados utilizados por el deduplicador.
        data_tests: [not_null]
      - name: date
        description: Fecha de publicación reconocida en SEDICI.
        data_tests: [not_null]
