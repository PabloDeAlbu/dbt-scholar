version: 2

models:
  - name: publication_openaire_enrichment
    description: >
      Base de publicaciones OAI de CONICET enriquecida mediante una correspondencia
      única por identificador OAI original con productos de investigación de OpenAIRE.
      Su grano es un registro OAI de CONICET.
    columns:
      - name: record_id
        data_tests: [not_null, unique]
      - name: matched_by_unique_original_id
        description: Indica si el identificador OAI resolvió un único producto en OpenAIRE.
        data_tests: [not_null]
      - name: openaire_citation_count
        description: Recuento de citas informado por OpenAIRE para el producto vinculado.
      - name: openaire_last_load_datetime
        description: Última fecha de carga del producto OpenAIRE en el Data Warehouse.

  - name: publication_openaire_match_summary
    description: >
      Cobertura de correspondencia entre registros OAI de CONICET y productos de
      OpenAIRE, con disponibilidad del recuento de citas en cada grupo.
    columns:
      - name: match_status
        data_tests: [not_null, unique]
      - name: publication_count
        data_tests: [not_null]
      - name: publication_share_pct
        data_tests: [not_null]
      - name: publication_with_citation_count
        data_tests: [not_null]

  - name: publication_openaire_top_cited
    description: >
      Diez publicaciones de CONICET con mayor recuento de citas informado por
      OpenAIRE entre las correspondencias únicas por identificador OAI.
    columns:
      - name: citation_rank
        data_tests: [not_null, unique]
      - name: record_id
        data_tests: [not_null, unique]
      - name: openaire_citation_count
        data_tests: [not_null]

  - name: publication_openaire_citation_by_subject_area
    description: >
      Recuento acumulado de citas informado por OpenAIRE para las publicaciones
      OAI de CONICET enlazadas de manera única por identificador original, agrupado
      por el área temática del registro institucional. Su grano es un área temática.
    columns:
      - name: subject_area
        description: Área temática informada por el registro OAI de CONICET.
        data_tests: [not_null, unique]
      - name: matched_publication_count
        description: Cantidad de publicaciones enlazadas de manera única con OpenAIRE.
        data_tests: [not_null]
      - name: publication_with_citation_data_count
        description: Cantidad de publicaciones para las que OpenAIRE informó un recuento de citas.
        data_tests: [not_null]
      - name: cited_publication_count
        description: Cantidad de publicaciones con un recuento de citas mayor que cero.
        data_tests: [not_null]
      - name: openaire_citation_count
        description: Suma del recuento de citas informado por OpenAIRE.
        data_tests: [not_null]
      - name: openaire_citation_share_pct
        description: Participación porcentual del área en el total acumulado de citas.
        data_tests: [not_null]
      - name: openaire_average_citation_count
        description: >
          Promedio de citas entre las publicaciones para las que OpenAIRE informó
          un recuento; no interpreta los valores nulos como cero.
