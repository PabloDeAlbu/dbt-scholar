version: 2

sources:
  - name: oai
    description: >
      Último batch OAI-PMH entregado por Kedro. El esquema fuente es temporal;
      la historia se conserva en los modelos de Data Vault.
    schema: ldg_oai
    tables:
      - name: records
        description: Una fila por registro OAI activo recuperado, más su procedencia.
        columns:
          - name: record_id
          - name: col_id
          - name: title
          - name: date_issued
          - name: extract_datetime
          - name: _context
          - name: _source_key
          - name: _repository_identifier
          - name: _institution_ror
          - name: _base_url
          - name: _metadata_prefix
          - name: load_datetime
      - name: identifiers
        description: Manifiesto del batch, incluidos los encabezados eliminados.
      - name: map_identifier_set
        description: Relación multivaluada entre encabezados OAI y sets.
      - name: map_record_creator
      - name: map_record_description
      - name: map_record_format
        description: Valores Dublin Core `format` asociados a cada registro.
      - name: map_record_identifier
      - name: map_record_language
      - name: map_record_publisher
      - name: map_record_relation
      - name: map_record_right
      - name: map_record_set
      - name: map_record_subject
      - name: map_record_type
      - name: record_by_set
        columns:
          - name: record_id
          - name: handle
          - name: col_id
          - name: title
          - name: date_issued
          - name: type_openaire
          - name: type_snrd
          - name: version
          - name: access_right
          - name: license_condition
          - name: _load_datetime
      - name: record_creator
        columns:
          - name: handle
          - name: creator
          - name: _load_datetime
      - name: record_language
        columns:
          - name: handle
          - name: language_iso
          - name: _load_datetime
      - name: record_publisher
        columns:
          - name: handle
          - name: publisher
          - name: _load_datetime
      - name: record_relation
        columns:
          - name: handle
          - name: relation
          - name: _load_datetime
      - name: record_subject
        columns:
          - name: handle
          - name: relation
          - name: _load_datetime
