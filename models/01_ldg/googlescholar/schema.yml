version: 2

sources:
  - name: googlescholar
    description: >
      Extracción tabular obtenida a partir de páginas HTML de resultados de
      búsqueda de perfiles en Google Scholar. Los HTML fueron descargados
      manualmente, almacenados en
      `data/01_raw/googlescholar/profile_search_unlp/html` y procesados
      por el pipeline Kedro `googlescholar_profile_search_load`; no provienen de una
      API oficial de Google Scholar.
    schema: ldg_googlescholar
    tables:
      - name: profile_search_result
        description: >
          Tarjetas de perfiles extraídas de los HTML paginados de la búsqueda
          manual `Perfiles - UNLP`. Kedro parsea nombre, URL, identificador,
          afiliación, email verificado, citas e intereses y carga el resultado
          tabular en `ldg_googlescholar.profile_search_result`.
        columns:
          - name: source_file
            data_tests: [not_null]
          - name: source_system
            data_tests: [not_null]
          - name: entity_type
            data_tests: [not_null]
          - name: name
            data_tests: [not_null]
          - name: profile_url
            data_tests: [not_null]
          - name: user
            quote: true
            data_tests: [not_null]
          - name: _load_datetime
            data_tests: [not_null]
      - name: profile
        description: Una fila por perfil completo y fecha de observación.
      - name: profile_publication
        description: Una fila por publicación visible en un perfil y fecha de observación.
      - name: profile_coauthor
        description: Una fila por coautor sugerido en un perfil y fecha de observación.
      - name: profile_citation_year
        description: Una fila por año del gráfico de citas de un perfil y fecha de observación.

models:
  - name: ldg_googlescholar_profile_search_result
    description: >
      Normalización mínima de perfiles de Google Scholar observados para UNLP.
      Su entrada es la tabla generada por Kedro desde HTML descargados
      manualmente. Conserva la trazabilidad mediante `source_file` y
      `load_datetime` y deriva señales operativas como dominio de email
      verificado, intereses y mención de afiliación UNLP.
    config:
      tags: [googlescholar, unlp]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [scholar_user_id, load_datetime, source_file]
    columns:
      - name: scholar_user_id
        description: Identificador estable del perfil en Google Scholar.
        data_tests: [not_null]
      - name: profile_url
        description: URL canónica del perfil observado.
        data_tests: [not_null]
      - name: author_name
        description: Nombre visible del perfil al momento de la observación.
        data_tests: [not_null]
      - name: verified_email_domain
        description: Dominio extraído del texto de email verificado, cuando pudo inferirse.
      - name: has_unlp_verified_email
        description: Flag que indica si el dominio verificado termina en `unlp.edu.ar`.
        data_tests: [not_null]
      - name: mentions_unlp_affiliation
        description: Flag que indica si la afiliación contiene `UNLP` o `Universidad Nacional de La Plata`.
        data_tests: [not_null]
      - name: interest_count
        description: Cantidad de intereses parseados desde el arreglo JSON de Scholar.
        data_tests: [not_null]
      - name: load_datetime
        description: Fecha-hora de carga de la observación cruda.
        data_tests: [not_null]

  - name: ldg_googlescholar_profile
    description: Proyección tipada de los datos generales y métricas observadas en cada perfil.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [scholar_user_id, observed_on, source_file]
    columns:
      - name: scholar_user_id
        data_tests: [not_null]
      - name: observed_on
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: ldg_googlescholar_profile_publication
    description: Proyección tipada de las publicaciones visibles en cada perfil observado.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [scholar_user_id, scholar_publication_id, observed_on]
    columns:
      - name: scholar_user_id
        data_tests: [not_null]
      - name: scholar_publication_id
        data_tests: [not_null]
      - name: title
        data_tests: [not_null]
      - name: publication_details
        description: Segunda línea descriptiva `.gs_gray` observada en la fila del perfil; puede combinar medio, volumen, páginas y año.
      - name: observed_on
        data_tests: [not_null]

  - name: ldg_googlescholar_profile_coauthor
    description: Proyección tipada de los coautores sugeridos para cada perfil observado.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [scholar_user_id, coauthor_scholar_user_id, observed_on]
    columns:
      - name: scholar_user_id
        data_tests: [not_null]
      - name: coauthor_scholar_user_id
        data_tests: [not_null]
      - name: observed_on
        data_tests: [not_null]

  - name: ldg_googlescholar_profile_citation_year
    description: Proyección tipada de las citas por año mostradas en cada perfil observado.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [scholar_user_id, year, observed_on]
    columns:
      - name: scholar_user_id
        data_tests: [not_null]
      - name: year
        data_tests: [not_null]
      - name: cited_by_count
        data_tests: [not_null]
      - name: observed_on
        data_tests: [not_null]
