version: 2

sources:
  - name: dspacedb5
    description: 'DSpace 5 dump cargado manualmente para la rama dspacedb5'
    schema: ldg_dspacedb5
    tables:
      - name: bitstream
      - name: bundle2bitstream
      - name: collection
      - name: collection2item
      - name: community
      - name: community2collection
      - name: community2community
      - name: eperson
      - name: handle
      - name: item
      - name: item2bundle
      - name: metadatafieldregistry
      - name: metadataschemaregistry
      - name: metadatavalue

models:
  # ldg: castea el dump vigente, agrega registro nulo y scope del batch. No calcula BK/HK DV.
  - name: ldg_dspacedb5__scope
    description: >
      Contexto de integración del batch DSpace 5. Fuente única para scope, extracción
      y carga del dump vigente. Ejemplo:
      `dbt run --select models/01_ldg/dspacedb5 --vars '{dspacedb5_source_label: "sedici", dspacedb5_base_url: "sedici.unlp.edu.ar", dspacedb5_institution_ror: "https://ror.org/01tjs6929", dspacedb5_extract_datetime: "2026-06-22", dspacedb5_load_datetime: "2026-06-22 10:30:00"}'`
    columns:
      - name: base_url
        data_tests: [not_null]
      - name: source_label
        description: Etiqueta de fuente del batch.
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: extract_datetime
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: ldg_dspacedb5_item
    description: >
      Tabla `item` casteada, con registro nulo y scope del batch.
    columns:
      - name: item_id
        data_tests:
          - not_null
      - name: submitter_id
      - name: in_archive
      - name: withdrawn
      - name: last_modified
      - name: owning_collection
      - name: discoverable

  - name: ldg_dspacedb5_bitstream
    description: >
      Tabla `bitstream` casteada, con registro nulo y scope del batch.
    columns:
      - name: bitstream_id
      - name: bitstream_format_id
      - name: size_bytes
      - name: checksum
      - name: checksum_algorithm
      - name: internal_id
      - name: deleted
      - name: store_number
      - name: sequence_id

  - name: ldg_dspacedb5_bundle2bitstream
    description: >
      Tabla `bundle2bitstream` casteada, con registro nulo y scope del batch.
    columns:
      - name: id
      - name: bundle_id
      - name: bitstream_id
      - name: bitstream_order

  - name: ldg_dspacedb5_collection
    description: >
      Tabla `collection` casteada, con registro nulo y scope del batch.
    columns:
      - name: collection_id
      - name: logo_bitstream_id
      - name: template_item_id
      - name: workflow_step_1
      - name: workflow_step_2
      - name: workflow_step_3
      - name: submitter
      - name: admin

  - name: ldg_dspacedb5_collection2item
    description: >
      Tabla `collection2item` casteada, con registro nulo y scope del batch.
    columns:
      - name: collection_item_id
      - name: collection_id
      - name: item_id

  - name: ldg_dspacedb5_community
    description: >
      Tabla `community` casteada, con registro nulo y scope del batch.
    columns:
      - name: community_id
      - name: logo_bitstream_id
      - name: admin

  - name: ldg_dspacedb5_community2collection
    description: >
      Tabla `community2collection` casteada, con registro nulo y scope del batch.
    columns:
      - name: community_collection_id
      - name: community_id
      - name: collection_id

  - name: ldg_dspacedb5_community2community
    description: >
      Tabla `community2community` casteada, con registro nulo y scope del batch.
    columns:
      - name: community_community_id
      - name: parent_comm_id
      - name: child_comm_id

  - name: ldg_dspacedb5_handle
    description: >
      Tabla `handle` casteada, con registro nulo y scope del batch.
    columns:
      - name: handle_id
      - name: handle
      - name: resource_type_id
      - name: resource_id

  - name: ldg_dspacedb5_item2bundle
    description: >
      Tabla `item2bundle` casteada, con registro nulo y scope del batch.
    columns:
      - name: id
      - name: item_id
      - name: bundle_id

  - name: ldg_dspacedb5_metadatafieldregistry
    description: >
      Tabla `metadatafieldregistry` casteada, con registro nulo y scope del batch.
    columns:
      - name: metadata_field_id
      - name: metadata_schema_id
      - name: element
      - name: qualifier
      - name: scope_note

  - name: ldg_dspacedb5_metadataschemaregistry
    description: >
      Tabla `metadataschemaregistry` casteada, con registro nulo y scope del batch.
    columns:
      - name: metadata_schema_id
      - name: namespace
      - name: short_id

  - name: ldg_dspacedb5_metadatavalue
    description: >
      Tabla `metadatavalue` casteada, con registro nulo y scope del batch.
    columns:
      - name: metadata_value_id
      - name: resource_id
      - name: metadata_field_id
      - name: text_value
      - name: text_lang
      - name: place
      - name: authority
      - name: confidence
      - name: resource_type_id
