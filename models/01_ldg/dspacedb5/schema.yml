version: 2

sources:
  - name: dspacedb5
    description: 'DSpace 5 dump cargado manualmente para la rama dspacedb5'
    schema: ldg_dspacedb5
    tables:
      - name: bitstream
      - name: bundle2bitstream
      - name: collection
      - name: collection2item
      - name: community
      - name: community2collection
      - name: community2community
      - name: eperson
      - name: handle
      - name: item
      - name: item2bundle
      - name: metadatafieldregistry
      - name: metadataschemaregistry
      - name: metadatavalue

models:
  - name: ldg_dspacedb5__context
    description: >
      Contexto técnico del dump DSpace 5 para `ldg_dspacedb5`. Debe ejecutarse
      con `--vars` para fijar al menos `base_url` e `institution_ror`. Las
      fechas pueden pasarse explícitamente o dejarse con default. Ejemplo:
      `dbt run --select models/01_ldg/dspacedb5 --vars '{dspacedb5_base_url: "sedici.unlp.edu.ar", dspacedb5_institution_ror: "https://ror.org/01tjs6929", dspacedb5_extract_datetime: "2026-06-22", dspacedb5_load_datetime: "2026-06-22 10:30:00"}'`
    columns:
      - name: base_url
        data_tests: [not_null]
      - name: source_label
        description: Alias compatible derivado de `base_url`.
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: extract_datetime
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: ldg_dspacedb5_item
    description: >
      Items DSpace 5 normalizados en landing, con contexto técnico de fuente e
      ingestión en campos con prefijo `_`.
    columns:
      - name: item_id
        data_tests:
          - not_null
      - name: _source_label
        description: Etiqueta técnica de la fuente en la capa landing.
        data_tests:
          - not_null
      - name: _institution_ror
        description: ROR institucional técnico inyectado en la capa landing.
        data_tests:
          - not_null
      - name: _extract_datetime
        description: Fecha/hora técnica de extracción conservada con prefijo `_` en landing.
        data_tests:
          - not_null
      - name: _load_datetime
        description: Fecha/hora técnica de carga conservada con prefijo `_` en landing.
        data_tests:
          - not_null

  - name: ldg_dspacedb5_bitstream
    description: >
      Bitstreams DSpace 5 normalizados en landing, con contexto técnico de
      fuente e ingestión.

  - name: ldg_dspacedb5_bundle2bitstream
    description: >
      Relación bundle-bitstream de DSpace 5 normalizada en landing.

  - name: ldg_dspacedb5_collection
    description: >
      Colecciones DSpace 5 normalizadas en landing, con claves operativas y
      responsables del workflow.

  - name: ldg_dspacedb5_collection2item
    description: >
      Relación colección-item de DSpace 5 normalizada en landing.

  - name: ldg_dspacedb5_community
    description: >
      Comunidades DSpace 5 normalizadas en landing.

  - name: ldg_dspacedb5_community2collection
    description: >
      Relación comunidad-colección de DSpace 5 normalizada en landing.

  - name: ldg_dspacedb5_community2community
    description: >
      Relación jerárquica entre comunidades DSpace 5 normalizada en landing.

  - name: ldg_dspacedb5_handle
    description: >
      Handles DSpace 5 normalizados en landing, con referencia al recurso
      asociado.

  - name: ldg_dspacedb5_item2bundle
    description: >
      Relación item-bundle de DSpace 5 normalizada en landing.

  - name: ldg_dspacedb5_metadatafieldregistry
    description: >
      Registro de campos de metadatos DSpace 5 normalizado en landing.

  - name: ldg_dspacedb5_metadataschemaregistry
    description: >
      Registro de esquemas de metadatos DSpace 5 normalizado en landing.

  - name: ldg_dspacedb5_metadatavalue
    description: >
      Valores de metadatos DSpace 5 normalizados en landing, con referencia al
      recurso y al campo de metadato asociado.
