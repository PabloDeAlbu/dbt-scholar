version: 2

models:
  - name: fct_cic_dspacedb_item_publication
    description: >
      Una fila por ítem publicado de CIC Digital observado mediante `dspacedb`.
    config:
      tags: [cic, dm]
      meta:
        organization: cic
        source_system: dspacedb
        input_layer: dm
        model_role: fact
        business_process: item_publication
        grain: item_uuid
        temporal_scope: latest_historical_observation
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "coalesce(owning_collection_title, '') not in ('', '!UNKNOWN', 'N/A', 'NA')"
          config:
            severity: warn
    columns:
      - name: item_uuid
        data_tests: [not_null, unique]
      - name: item_id
        description: Identificador legado del item, disponible sólo cuando el dump lo conserva.
      - name: item_url
        description: URL canónica del item en la UI de CIC DIGITAL construida como `base_url/items/{item_uuid}/`.
      - name: owning_collection_url
        description: URL canónica de la colección owning construida como `base_url/collections/{owning_collection_uuid}/`.
      - name: institution_ror
        data_tests: [not_null]
      - name: owning_collection_title
        description: Título de la colección owning del item en DSpace.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: owning_community_title
        description: Título de la comunidad asociada a la colección owning del item.
      - name: owning_community_url
        description: URL canónica de la comunidad owning construida como `base_url/communities/{community_uuid}/`.
      - name: dc_identifier_uri
        description: Último identificador público no vacío observado en `dc.identifier.uri`.
        data_tests: [not_null]
      - name: dc_identifier_uri_raw
        description: Valor original elegido para `dc.identifier.uri`.
      - name: dc_date_available
        description: Fecha normalizada desde el último valor válido de `dc.date.available`.
        data_tests: [not_null]
      - name: dc_date_available_raw
        description: Valor original elegido para `dc.date.available`.
      - name: dc_date_available_precision
        description: Precisión declarada por el valor elegido para `dc.date.available`.
      - name: dcterms_issued
        description: Fecha normalizada desde el último valor válido de `dcterms.issued`.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: dcterms_issued_raw
        description: Valor original elegido para `dcterms.issued`.
      - name: dcterms_issued_precision
        description: Precisión declarada por el valor elegido para `dcterms.issued`.
      - name: dc_title
        description: Último valor no vacío de `dc.title`.
      - name: dc_title_raw
        description: Valor original elegido para `dc.title`.
      - name: dcterms_title_subtitle
        description: Último valor no vacío de `dcterms.title.subtitle`.
      - name: dcterms_title_subtitle_raw
        description: Valor original elegido para `dcterms.title.subtitle`.
      - name: cic_parent_type
        description: Último valor no vacío de `cic.parentType`.
      - name: cic_parent_type_raw
        description: Valor original elegido para `cic.parentType`.
      - name: dc_type
        description: Último valor no vacío de `dc.type`.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: dc_type_raw
        description: Valor original elegido para `dc.type`.
      - name: dcterms_description
        description: Último valor no vacío de `dcterms.description`.
      - name: dcterms_description_raw
        description: Valor original elegido para `dcterms.description`.

  - name: brg_cic_dspacedb_item_author
    description: Observaciones de autoría CIC conservadas por ítem, rol y metadata value.
    config:
      meta:
        organization: cic
        source_system: dspacedb
        input_layer: int
        model_role: bridge
        grain: metadata_value_id
        temporal_scope: latest_historical_observation
    columns:
      - name: item_uuid
        data_tests: [not_null]
      - name: metadata_value_id
        data_tests: [not_null, unique]
      - name: author_role
        data_tests:
          - not_null
          - accepted_values:
              values: ['author', 'corporate', 'editor', 'compilator']
      - name: author_name
        data_tests: [not_null]
      - name: authority
        description: Identificador de autoridad informado por CIC Digital, cuando existe.

  - name: fct_cic_dspacedb_eperson
    description: >
      Hecho institucional de usuarios `eperson` del repositorio CIC DIGITAL, construido sobre la
      tabla fuente `eperson` contextualizada por repositorio y enriquecido con actividad como
      submitter a partir de `fct_cic_dspacedb_item_publication`.
    config:
      tags: [cic, dm]
      meta:
        organization: cic
        source_system: dspacedb
        input_layer: dm
        model_role: fact
        grain: eperson_hk
        temporal_scope: latest_historical_observation
    columns:
      - name: eperson_hk
        description: Hash key estable del usuario dentro del scope institucional del repositorio.
        data_tests:
          - not_null
          - unique
      - name: eperson_id
        description: >
          ID canónico del usuario en la base transaccional DSpace; usa `eperson_id` cuando está
          presente y cae a `uuid` cuando el origen lo deja nulo.
        data_tests:
          - not_null
      - name: email
        description: Email registrado para la cuenta del usuario.
      - name: netid
        description: NetID o identificador de autenticación institucional informado por DSpace.
      - name: can_log_in
        description: Flag que indica si la cuenta tiene habilitado el login.
      - name: require_certificate
        description: Flag que indica si el usuario requiere certificado para autenticarse.
      - name: self_registered
        description: Flag que indica si la cuenta fue auto-registrada.
      - name: submitter_flag
        description: Flag que indica si el usuario aparece como submitter en al menos un item institucional.
      - name: first_item_submission_date
        description: Primera fecha aproximada de envío de ítems por el usuario.
      - name: last_item_submission_date
        description: Última fecha aproximada de envío de ítems por el usuario.
      - name: source_label
        description: Etiqueta de fuente del repositorio cargado.
        data_tests:
          - not_null
      - name: institution_ror
        description: ROR institucional del repositorio.
        data_tests:
          - not_null
      - name: first_extract_datetime
        description: Primera observación temporal del usuario en el warehouse para este scope institucional.
      - name: last_extract_datetime
        description: Última observación temporal del usuario en el warehouse para este scope institucional.
      - name: first_load_datetime
        description: Primera carga en la que el usuario quedó observado dentro del scope CIC.
      - name: last_load_datetime
        description: Última carga en la que el usuario quedó observado dentro del scope CIC.
