version: 2

models:
  - name: int_cic_cicdigital_item_metadatavalue
    description: >
      Capa atómica vigente de metadatos de ítems CIC Digital, a grano una fila
      por `metadata_value_id`. Conserva el valor original y agrega una limpieza
      textual genérica, sin aplicar reglas propias de un metadatafield.
    config:
      meta: &int_observation_meta
        organization: cic
        source_system: cicdigital
        input_layer: ldg
        model_role: intermediate
        grain: metadata_value_id
    columns:
      - name: metadata_value_id
        data_tests: [not_null, unique]
      - name: item_id
        data_tests: [not_null]
      - name: metadata_field_id
        data_tests: [not_null]
      - name: metadatafield_fullname
        data_tests: [not_null]
      - name: value_raw
        description: Valor original de `metadatavalue.text_value`.
      - name: value
        description: Valor con espacios, caracteres invisibles y `|` internos normalizados.
      - name: authority
        description: Identificador de autoridad sin espacios exteriores.
      - name: place
        description: Posición del valor dentro del metadatafield.

  - name: int_cic_cicdigital_item_dc_title
    description: Último valor no vacío de `dc.title` por ítem.
    config:
      meta: &int_scalar_meta
        organization: cic
        source_system: cicdigital
        input_layer: int
        model_role: intermediate
        grain: item_id
    columns: &single_value_columns
      - name: item_id
        data_tests: [not_null, unique]
      - name: metadata_value_id
        data_tests: [not_null, unique]
      - name: value_raw
      - name: value
        data_tests: [not_null]

  - name: int_cic_cicdigital_item_dcterms_title_subtitle
    description: Último valor no vacío de `dcterms.title.subtitle` por ítem.
    config:
      meta: *int_scalar_meta
    columns: *single_value_columns

  - name: int_cic_cicdigital_item_dc_type
    description: Último valor no vacío de `dc.type` por ítem.
    config:
      meta: *int_scalar_meta
    columns: *single_value_columns

  - name: int_cic_cicdigital_item_cic_parent_type
    description: Último valor no vacío de `cic.parentType` por ítem.
    config:
      meta: *int_scalar_meta
    columns: *single_value_columns

  - name: int_cic_cicdigital_item_dcterms_issued
    description: >
      Último valor válido de `dcterms.issued` por ítem, convertido a fecha sin
      perder la precisión declarada por la fuente.
    config:
      meta: *int_scalar_meta
    columns:
      - name: item_id
        data_tests: [not_null, unique]
      - name: metadata_value_id
        data_tests: [not_null, unique]
      - name: value_raw
      - name: value
        data_tests: [not_null]
      - name: value_precision
        data_tests:
          - not_null
          - accepted_values:
              values: ['day', 'month', 'year']

  - name: int_cic_cicdigital_item_dcterms_creator_author
    description: Observaciones no vacías de `dcterms.creator.author`.
    config:
      meta: &int_multivalue_meta
        organization: cic
        source_system: cicdigital
        input_layer: int
        model_role: intermediate
        grain: metadata_value_id
    columns: &multi_value_columns
      - name: item_id
        data_tests: [not_null]
      - name: metadata_value_id
        data_tests: [not_null, unique]
      - name: value_raw
      - name: value
        data_tests: [not_null]
      - name: authority
      - name: confidence
      - name: place

  - name: int_cic_cicdigital_item_dcterms_creator_corporate
    description: Observaciones no vacías de `dcterms.creator.corporate`.
    config:
      meta: *int_multivalue_meta
    columns: *multi_value_columns

  - name: int_cic_cicdigital_item_dcterms_creator_editor
    description: Observaciones no vacías de `dcterms.creator.editor`.
    config:
      meta: *int_multivalue_meta
    columns: *multi_value_columns

  - name: int_cic_cicdigital_item_dcterms_creator_compilator
    description: Observaciones no vacías de `dcterms.creator.compilator`.
    config:
      meta: *int_multivalue_meta
    columns: *multi_value_columns

  - name: int_cic_cicdigital_item_dcterms_identifier_doi
    description: >
      DOI reconocidos dentro de `dcterms.identifier.other`, normalizados a
      minúsculas y sin prefijo ni puntuación final.
    config:
      meta: *int_multivalue_meta
    columns: &identifier_value_columns
      - name: item_id
        data_tests: [not_null]
      - name: metadata_value_id
        data_tests: [not_null, unique]
      - name: value_raw
      - name: value
        data_tests: [not_null]

  - name: int_cic_cicdigital_item_dcterms_identifier_isbn
    description: >
      ISBN reconocidos en `dcterms.identifier.isbn`, normalizados a diez o
      trece caracteres sin prefijos ni separadores.
    config:
      meta: *int_multivalue_meta
    columns: *identifier_value_columns

  - name: int_cic_cicdigital_item_dcterms_description
    description: Último valor no vacío de `dcterms.description` por ítem.
    config:
      meta: *int_scalar_meta
    columns: *single_value_columns
