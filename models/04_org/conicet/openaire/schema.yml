version: 2

models:
  - name: fct_conicet_openaire_researchproduct_publication
    description: >
      Subconjunto institucional CONICET del hecho de publicaciones OpenAIRE, filtrado por organización
      (ROR) aplicada durante la extracción para construir un subconjunto reproducible.
    config:
      tags: [conicet, dm]
    data_tests:
      - dbt_utils.expression_is_true:
          name: conicet_openaire_rel_organization_ror_format
          expression: "trim(relOrganizationId) ~ '^https?://ror[.]org/[0-9a-z]{9}/?$'"
          config:
            alias: conicet_openaire_rel_organization_ror_format
    columns:
      - name: researchproduct_hk
        description: Clave hash del research product (PK del hub).
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_openaire_researchproduct')
              field: researchproduct_hk
      - name: researchproduct_id
        description: Identificador canónico de OpenAIRE.
        data_tests:
          - not_null
          - unique
      - name: conicet_last_extract_datetime
        description: >
          Última fecha/hora de extracción informada por el lote de origen. Puede
          ser nula cuando la fuente solo conserva la fecha de carga.
      - name: conicet_first_load_datetime
        description: Primera fecha/hora de carga del research product en el Data Warehouse.
        data_tests: [not_null]
      - name: conicet_last_load_datetime
        description: Última fecha/hora de carga del research product en el Data Warehouse.
        data_tests: [not_null]
      - name: relOrganizationId
        description: Identificador ROR (URL) utilizado para filtrar el subconjunto institucional CONICET.
        data_tests: [not_null]
