version: 2

models:
  - name: dim_conicet_oai_record_type
    description: >
      Mapeo curado de valores `dc.type` observados en el OAI de CONICET hacia
      tipos de recurso COAR expuestos por `dim_resource_type`. Conserva el
      vocabulario de origen sin establecer prioridad entre `ar-repo` y
      `eu-repo`, y excluye valores no tipológicos como `publishedVersion`.
    columns:
      - name: dc_type
        description: Valor raw observado en `dc.type`.
        data_tests: [not_null, unique]
      - name: type_vocabulary
        description: Vocabulario de origen (`ar-repo` o `eu-repo`).
        data_tests:
          - not_null
          - accepted_values:
              values: ['ar-repo', 'eu-repo']
      - name: resource_type
        description: Etiqueta canónica COAR del tipo de recurso cuando existe mapeo.
      - name: resource_type_uri
        description: URI canónica del tipo de recurso en `dim_resource_type`.
        data_tests:
          - relationships:
              to: ref('dim_resource_type')
              field: resource_type_uri
      - name: resource_type_label_es
        description: Etiqueta canónica en español provista por `dim_resource_type`.
      - name: is_resource_type
        description: Indica si el valor representa un tipo de recurso resoluble mediante COAR.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: conicet_oai_resolvable_resource_type_has_canonical_dimension
          expression: >
            not is_resource_type
            or (resource_type_uri is not null and resource_type is not null)

  - name: brg_conicet_oai_record_resource_type
    description: >
      Relación canónica entre cada `record` del corpus OAI de CONICET y los
      tipos de recurso COAR derivados de sus valores `dc.type`. Conserva una
      fila por `record_hk` y `resource_type_uri`, junto con la evidencia fuente.
    config:
      tags: [conicet, dm]
      meta:
        organization: conicet
        source_system: oai
        model_role: bridge
        grain: record_hk + resource_type_uri
    columns:
      - name: record_hk
        description: Clave hash de la entidad OAI `record`.
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_oai_record_publication')
              field: record_hk
      - name: resource_type_uri
        description: URI del tipo de recurso canónico COAR relacionado con el record.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_resource_type')
              field: resource_type_uri
      - name: resource_type
        description: Etiqueta canónica en inglés provista por `dim_resource_type`.
        data_tests: [not_null]
      - name: resource_type_label_es
        description: Etiqueta canónica en español provista por `dim_resource_type`.
      - name: type_vocabularies
        description: Vocabularios de origen que convergen en la relación, concatenados con `|`.
        data_tests: [not_null]
      - name: source_dc_types
        description: Valores `dc.type` que sustentan la relación, concatenados con `|`.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [record_hk, resource_type_uri]

  - name: int_conicet_oai_record_resource_type_selected
    description: >
      Resolución de un tipo de recurso representativo por entidad OAI `record`.
      Prefiere un único tipo específico frente a `OTHER`, sin priorizar el
      vocabulario `ar-repo` o `eu-repo`, y conserva la multiplicidad candidata.
    config:
      tags: [conicet, dm]
      meta:
        organization: conicet
        source_system: oai
        model_role: intermediate
        grain: record_hk
    columns:
      - name: record_hk
        description: Clave hash de la entidad OAI `record`.
        data_tests: [not_null, unique]
      - name: resource_type_uri
        description: URI COAR seleccionada; queda nula ante candidatos específicos incompatibles.
        data_tests:
          - relationships:
              to: ref('dim_resource_type')
              field: resource_type_uri
      - name: resource_type
        description: Etiqueta canónica del tipo de recurso seleccionado.
      - name: resource_type_label_es
        description: Etiqueta canónica en español del tipo seleccionado.
      - name: resource_type_source
        description: Vocabulario o vocabularios que sustentan el tipo seleccionado.
      - name: resource_type_source_dc_types
        description: Valores `dc.type` que sustentan el tipo seleccionado.
      - name: resource_type_count
        description: Cantidad de URI COAR candidatas distintas para el record.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      - name: has_multiple_resource_types
        description: Indica si el record posee más de una URI COAR candidata distinta.
        data_tests: [not_null]
      - name: has_resource_type
        description: Indica si la regla pudo seleccionar un tipo de recurso representativo.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "has_resource_type = (resource_type_uri is not null)"

  - name: dim_conicet_oai_record_accessright
    description: >
      Mapeo de los valores `dc.right` con semántica `eu-repo` observados en
      CONICET hacia el vocabulario canónico COAR Access Rights.
    columns:
      - name: dc_right
        description: Valor raw de `dc.right` usado por CONICET para indicar acceso.
        data_tests: [not_null, unique]
      - name: access_right
        description: Etiqueta canónica en inglés del nivel de acceso.
        data_tests: [not_null]
      - name: access_right_label_es
        description: >
          Etiqueta institucional en español de la condición de acceso. Para
          `restrictedAccess` explicita que el concepto COAR corresponde a acceso
          solo a metadatos o registro bibliográfico.
      - name: access_right_uri
        description: URI COAR del nivel de acceso.
        data_tests: [not_null, unique]

  - name: fct_conicet_oai_record_publication
    description: >
      Hecho institucional CONICET a nivel de record OAI. Conserva el grano 1 fila
      por `record_hk` de `fct_oai_record_publication`, filtra el subset institucional
      configurado por variables y agrega enrichment 1:1 de tipo de recurso,
      condición de acceso, identifier, DOI y subject.
    config:
      tags: [conicet, dm]
    columns:
      - name: record_hk
        description: Clave hash del registro OAI.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_oai_record_publication')
              field: record_hk
      - name: record_id
        description: Identificador OAI-PMH del record.
        data_tests: [not_null, unique]
      - name: dc_type
        description: Lista raw de valores `dc.type` agregados en OAI y concatenados con `|`.
      - name: dc_type_count
        description: Cantidad de valores distintos de `dc.type` detectados para el record.
        data_tests: [not_null]
      - name: has_multiple_dc_type
        description: Flag que indica multiplicidad de `dc.type` en el record.
        data_tests: [not_null]
      - name: resource_type
        description: >
          Tipo de recurso canónico del record. Cuando coexisten un tipo específico
          y `OTHER`, conserva el específico; no impone prioridad entre vocabularios.
      - name: resource_type_uri
        description: URI COAR del tipo de recurso resuelto.
        data_tests:
          - relationships:
              to: ref('dim_resource_type')
              field: resource_type_uri
      - name: resource_type_label_es
        description: Etiqueta canónica en español del tipo de recurso resuelto.
      - name: resource_type_source
        description: >
          Vocabulario o vocabularios que aportaron el tipo COAR elegido, concatenados
          con `|` cuando ambos convergen en la misma URI.
      - name: resource_type_source_dc_types
        description: Valores `dc.type` que sustentan el tipo de recurso elegido.
      - name: resource_type_count
        description: Cantidad de URI COAR candidatas distintas observadas para el record.
        data_tests: [not_null]
      - name: has_multiple_resource_types
        description: Indica si el record posee más de una URI COAR candidata distinta.
        data_tests: [not_null]
      - name: has_resource_type
        description: Indica si el record pudo resolverse a un tipo de recurso canónico.
        data_tests: [not_null]
      - name: dc_right
        description: Valores raw de `dc.right` heredados del hecho OAI genérico.
      - name: dc_right_count
        description: Cantidad de valores raw distintos de `dc.right`.
        data_tests: [not_null]
      - name: has_multiple_dc_right
        description: Indica si el record tiene más de un valor raw de `dc.right`.
        data_tests: [not_null]
      - name: access_right
        description: Nivel de acceso COAR resuelto desde los valores `eu-repo` de CONICET.
      - name: access_right_uri
        description: URI COAR del nivel de acceso resuelto.
      - name: access_right_count
        description: Cantidad de niveles de acceso canónicos distintos resueltos para el record.
        data_tests: [not_null]
      - name: has_multiple_access_right
        description: Indica si el record resuelve a más de un nivel de acceso.
        data_tests: [not_null]
      - name: has_access_right
        description: Indica si el record pudo resolverse a un nivel de acceso COAR.
        data_tests: [not_null]
      - name: repository_identifier
        description: Identificador del repositorio OAI del que proviene el registro.
      - name: institution_ror
        description: ROR institucional asignado al contexto de extraccion.
      - name: valid_date_issued
        description: >
          Flag heredado de `fct_oai_record_publication` que indica si `date_issued`
          cae dentro del rango válido definido por la estructura OAI.
        data_tests: [not_null]
      - name: dc_identifier_uri
        description: Handle institucional filtrado por prefijo CONICET.
        data_tests:
          - not_null
          - unique
      - name: dc_relation_doi
        description: DOI principal obtenido desde `dc.relation`.
        data_tests:
          - unique:
              config:
                severity: warn
      - name: subject_area
        description: Área de la asignación FOS seleccionada de forma determinística.
      - name: subject_subarea
        description: Subárea de la misma asignación FOS seleccionada.
      - name: fos_code_level_1
        description: Código del área de la asignación FOS seleccionada.
      - name: fos_assignment_count
        description: Cantidad de asignaciones FOS efectivas del registro.
        data_tests: [not_null]
      - name: mult_fos_flag
        description: Indica si el registro conserva más de una asignación FOS efectiva.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "dc_identifier_uri ~ '^http://hdl\\.handle\\.net/11336/'"
      - dbt_utils.expression_is_true:
          expression: "dc_relation_doi is null OR dc_relation_doi ~* '^10\\.[0-9]{4,9}/[^[:space:]]+$'"
          config:
            severity: warn

  - name: fct_conicet_oai_record_pid_profile
    description: >
      Perfilado de PIDs a nivel `record_hk` para el subset OAI de CONICET.
      Clasifica patrones observados en `dc_identifier_uri` y `dc_relation_doi`
      y expone flags de validez orientados a entender cobertura y calidad de
      identificadores en la fuente institucional.
    config:
      tags: [conicet, dm]
    columns:
      - name: record_hk
        description: Clave hash del record perfilado.
        data_tests: [not_null, unique]
      - name: record_id
        description: Identificador OAI-PMH del record.
        data_tests: [not_null]
      - name: dc_identifier_uri_pattern
        description: Patrón clasificado para `dc_identifier_uri`.
        data_tests: [not_null]
      - name: dc_identifier_uri_is_valid
        description: Flag de validez del identifier URI según el contrato institucional esperado.
        data_tests: [not_null]
      - name: dc_relation_doi_pattern
        description: Patrón clasificado para `dc_relation_doi`.
        data_tests: [not_null]
      - name: dc_relation_doi_is_valid
        description: Flag de validez del DOI OAI según el contrato esperado.
        data_tests: [not_null]
      - name: dc_type_count
        description: Cantidad de valores distintos de `dc.type` detectados para el record.
        data_tests: [not_null]
      - name: has_multiple_dc_type
        description: Flag de multiplicidad de `dc.type`.
        data_tests: [not_null]
      - name: has_doi
        description: Flag que indica presencia de DOI en OAI.
        data_tests: [not_null]
      - name: has_multiple_doi
        description: Flag que indica multiplicidad de DOI detectada en el record.
        data_tests: [not_null]

  - name: fct_conicet_oai_record_pid_coverage
    description: >
      Resumen agregado de cobertura y validez de PIDs en la fuente OAI de CONICET.
      Agrupa por dimensión observada (`dc_identifier_uri`, `dc_relation_doi`) y
      por patrón detectado para facilitar lectura analítica del perfilado base.
    config:
      tags: [conicet, dm]
    columns:
      - name: pid_dimension
        description: Dimensión perfilada (`dc_identifier_uri` o `dc_relation_doi`).
        data_tests: [not_null]
      - name: pid_pattern
        description: Patrón detectado dentro de la dimensión perfilada.
        data_tests: [not_null]
      - name: record_count
        description: Cantidad total de records observados para el patrón.
        data_tests: [not_null]
      - name: valid_record_count
        description: Cantidad de records válidos para el patrón.
        data_tests: [not_null]
      - name: invalid_record_count
        description: Cantidad de records inválidos para el patrón.
        data_tests: [not_null]
