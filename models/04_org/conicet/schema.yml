version: 2

models:
  - name: fct_conicet_publication
    description: >
      Hecho canónico de publicaciones CONICET. En esta primera versión el grano y la
      clave siguen siendo los del registro OAI (`record_hk`), pero el modelo expone
      una interfaz transversal para desacoplar a los consumidores de la fuente específica.
    config:
      tags: [conicet, dm]
    columns:
      - name: record_hk
        description: Clave hash del registro OAI, usada como clave de la publicación en esta primera etapa.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_conicet_oai_record_publication')
              field: record_hk
      - name: record_id
        description: Identificador OAI-PMH original, preservado como identificador de negocio actual.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_conicet_oai_record_publication')
              field: record_id
      - name: source_system
        description: Source system desde el cual se resuelve la publicación canónica.
        data_tests: [not_null]
      - name: resource_type
        description: Tipo de recurso normalizado desde `dc.type` mediante la dimensión canónica COAR.
      - name: resource_type_uri
        description: URI canónica del tipo de recurso en `dim_resource_type`.
        data_tests:
          - relationships:
              to: ref('dim_resource_type')
              field: resource_type_uri
      - name: resource_type_count
        description: Cantidad de tipos de recurso canónicos resueltos desde los valores raw de `dc.type`.
        data_tests: [not_null]
      - name: has_multiple_resource_types
        description: Indica si se resolvió más de un tipo de recurso canónico para la publicación.
        data_tests: [not_null]
      - name: access_right
        description: Access right canónico resuelto fuera de OAI desde dimensiones core.
      - name: access_right_uri
        description: URI COAR del access right canónico.
      - name: title
        description: Título principal de la publicación.
      - name: publication_date
        description: Fecha de publicación tomada desde `date_issued` en la fuente OAI actual.
      - name: publication_year
        description: Año derivado de `publication_date` cuando la fecha está disponible.
      - name: repository_identifier
        description: Identificador del repositorio OAI que origina el registro.
      - name: institution_ror
        description: ROR institucional asociado al contexto de extracción.
      - name: set_spec
        description: >
          `setSpec` OAI-PMH desde el cual se recuperó el record. Si un mismo registro
          está asociado a más de un set, los valores distintos se concatenan con `|`.
      - name: institutional_uri
        description: URI institucional canónica de la publicación en el repositorio.
        data_tests:
          - not_null
          - unique
      - name: doi
        description: DOI principal seleccionado para la publicación, si existe.
      - name: has_doi
        description: Flag que indica presencia de al menos un DOI.
        data_tests: [not_null]
      - name: has_multiple_doi
        description: Flag de auditoría para publicaciones con más de un DOI detectado.
        data_tests: [not_null]
      - name: doi_count
        description: Cantidad de DOIs detectados en la fuente actual.
        data_tests: [not_null]
      - name: subject_area
        description: >
          Área de la asignación FOS seleccionada de forma determinística.
          La selección no implica prioridad informada por la fuente.
      - name: subject_subarea
        description: Subárea perteneciente a la misma asignación FOS que `subject_area`.
      - name: subject_code
        description: Código del área perteneciente a la asignación FOS seleccionada.
      - name: subject_assignment_count
        description: Cantidad de asignaciones FOS efectivas conservadas para la publicación.
        data_tests: [not_null]
      - name: has_multiple_subject_assignments
        description: Indica si la publicación conserva más de una asignación FOS efectiva.
        data_tests: [not_null]
      - name: has_fil
        description: Flag que indica presencia de al menos una descripción `Fil:` asociada al registro.
        data_tests: [not_null]
      - name: fil_count
        description: Cantidad total de descripciones `Fil:` asociadas al registro.
        data_tests: [not_null]
      - name: fil_author_count
        description: Cantidad de autores distintos detectados en las descripciones `Fil:`.
        data_tests: [not_null]
      - name: has_unlp_fil
        description: Flag que indica si alguna afiliación parseada menciona a la UNLP.
        data_tests: [not_null]
      - name: unlp_fil_count
        description: Cantidad de afiliaciones parseadas que mencionan a la UNLP.
        data_tests: [not_null]
      - name: unlp_fil_author_count
        description: Cantidad de autores distintos con afiliación UNLP detectada en `Fil:`.
        data_tests: [not_null]
      - name: has_cic_fil
        description: Flag que indica si alguna afiliación parseada menciona a la CIC o Comisión de Investigaciones Científicas.
        data_tests: [not_null]
      - name: cic_fil_count
        description: Cantidad de afiliaciones parseadas que mencionan a la CIC.
        data_tests: [not_null]
      - name: cic_fil_author_count
        description: Cantidad de autores distintos con afiliación CIC detectada en `Fil:`.
        data_tests: [not_null]
      - name: matched_by_unique_original_id
        description: >
          Flag que indica si la publicación OAI pudo enriquecerse con OpenAIRE mediante
          un match único 1 a 1 por identificador original del repositorio (`record_id = original_id`).
        data_tests: [not_null]
      - name: openaire_original_id
        description: Identificador original del repositorio expuesto por OpenAIRE y usado en el match único.
      - name: openaire_researchproduct_hk
        description: Clave hash de la publicación OpenAIRE asociada por match único de identificador original.
        data_tests:
          - relationships:
              to: ref('fct_conicet_openaire_researchproduct_publication')
              field: researchproduct_hk
              config:
                where: "openaire_researchproduct_hk is not null"
      - name: openaire_researchproduct_id
        description: Identificador de negocio de la publicación OpenAIRE asociada por match único de identificador original.
      - name: openaire_publication_date
        description: Fecha de publicación informada por OpenAIRE para la publicación matcheada por identificador original.
      - name: openaire_type
        description: Tipo de publicación informado por OpenAIRE para la publicación matcheada por identificador original.
      - name: openaire_publisher
        description: Publisher informado por OpenAIRE para la publicación matcheada.
      - name: openaire_access_right
        description: Condición de acceso principal informada por OpenAIRE para la publicación matcheada por identificador original.
      - name: openaire_access_right_uri
        description: URI de acceso principal informada por OpenAIRE para la publicación matcheada por identificador original.
      - name: openaire_is_green
        description: Flag OpenAIRE que indica disponibilidad por ruta green.
      - name: openaire_is_in_diamond_journal
        description: Flag OpenAIRE que indica pertenencia a revista diamond.
      - name: openaire_downloads
        description: Cantidad de descargas reportada por OpenAIRE para la publicación matcheada.
      - name: openaire_views
        description: Cantidad de vistas reportada por OpenAIRE para la publicación matcheada.
      - name: openaire_citation_class
        description: Clase de citación reportada por OpenAIRE.
      - name: openaire_citation_count
        description: Cantidad de citas informada por OpenAIRE para la publicación matcheada por identificador original.
      - name: openaire_impulse
        description: Métrica de impulso reportada por OpenAIRE.
      - name: openaire_impulse_class
        description: Clase de impulso reportada por OpenAIRE.
      - name: openaire_influence
        description: Métrica de influencia reportada por OpenAIRE.
      - name: openaire_influence_class
        description: Clase de influencia reportada por OpenAIRE.
      - name: openaire_popularity
        description: Métrica de popularidad reportada por OpenAIRE.
      - name: openaire_popularity_class
        description: Clase de popularidad reportada por OpenAIRE.
      - name: openaire_has_arxiv
        description: Flag OpenAIRE que indica presencia de arXiv.
      - name: openaire_has_single_arxiv
        description: Flag OpenAIRE que indica unicidad de arXiv.
      - name: openaire_arxiv_count
        description: Cantidad de arXiv asociados en OpenAIRE.
      - name: openaire_has_doi
        description: Flag OpenAIRE que indica presencia de DOI.
      - name: openaire_has_single_doi
        description: Flag OpenAIRE que indica unicidad de DOI.
      - name: openaire_doi_count
        description: Cantidad de DOI asociados en OpenAIRE.
      - name: openaire_has_handle
        description: Flag OpenAIRE que indica presencia de handle.
      - name: openaire_has_single_handle
        description: Flag OpenAIRE que indica unicidad de handle.
      - name: openaire_handle_count
        description: Cantidad de handles asociados en OpenAIRE.
      - name: openaire_has_mag
        description: Flag OpenAIRE que indica presencia de MAG.
      - name: openaire_has_single_mag
        description: Flag OpenAIRE que indica unicidad de MAG.
      - name: openaire_mag_count
        description: Cantidad de MAG IDs asociados en OpenAIRE.
      - name: openaire_has_pmb
        description: Flag OpenAIRE que indica presencia de PMB.
      - name: openaire_has_single_pmb
        description: Flag OpenAIRE que indica unicidad de PMB.
      - name: openaire_pmb_count
        description: Cantidad de PMBs asociados en OpenAIRE.
      - name: openaire_has_pmc
        description: Flag OpenAIRE que indica presencia de PMC.
      - name: openaire_has_single_pmc
        description: Flag OpenAIRE que indica unicidad de PMC.
      - name: openaire_pmc_count
        description: Cantidad de PMCs asociados en OpenAIRE.
      - name: openaire_has_pmid
        description: Flag OpenAIRE que indica presencia de PMID.
      - name: openaire_has_single_pmid
        description: Flag OpenAIRE que indica unicidad de PMID.
      - name: openaire_pmid_count
        description: Cantidad de PMIDs asociados en OpenAIRE.

  - name: fct_conicet_creator_item_publication
    description: >
      Hecho a grano autor–publicación, derivado de afiliaciones parseadas (campo Fil:) para análisis de
      productividad y co-ocurrencia institucional en el corpus CONICET. Consume
      `fct_conicet_publication` para desacoplar el análisis de la fuente específica.
    config:
      tags: [conicet, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [author, record_hk]
    columns:
      - name: author
        description: Nombre normalizado del autor (uppercase y limpieza básica).
        data_tests: [not_null]
      - name: record_hk
        description: Clave hash de la publicación en la implementación actual basada en OAI.
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_conicet_publication')
              field: record_hk
      - name: activity_count
        description: Métrica unitaria para agregación (1 fila = 1 actividad autor-publicación).
        data_tests: [not_null]

  - name: brg_conicet_record_fil
    description: Bridge de afiliaciones parseadas a partir de descripciones `Fil:` (autor + afiliación por registro).
    config:
      tags: [conicet, dm]
    columns:
      - name: record_description_hk
        description: Clave hash del vínculo record-description.
        data_tests:
          - not_null
          - unique
      - name: record_hk
        data_tests: [not_null]

  - name: brg_conicet_publication_fil
    description: >
      Bridge agregado a grano `record_hk` con métricas y flags derivadas de las
      descripciones `Fil:` parseadas, incluyendo presencia de afiliaciones UNLP y CIC.
    config:
      tags: [conicet, dm]
    columns:
      - name: record_hk
        data_tests: [not_null, unique]
      - name: has_fil
        data_tests: [not_null]
      - name: fil_count
        data_tests: [not_null]
      - name: fil_author_count
        data_tests: [not_null]
      - name: has_unlp_fil
        data_tests: [not_null]
      - name: unlp_fil_count
        data_tests: [not_null]
      - name: unlp_fil_author_count
        data_tests: [not_null]
      - name: has_cic_fil
        data_tests: [not_null]
      - name: cic_fil_count
        data_tests: [not_null]
      - name: cic_fil_author_count
        data_tests: [not_null]

  - name: dim_conicet_item_type
    description: Dimensión de tipologías OAI/DC mapeadas a COAR Resource Types para el corpus CONICET.
    config:
      tags: [conicet, dm]
    columns:
      - name: dc_type_hk
        description: Clave hash del tipo (hub_oai_type).
        data_tests: [not_null, unique]
      - name: dc_type
        description: URI/valor del tipo provisto por el repositorio.
        data_tests: [not_null]
      - name: label
        description: Etiqueta legible del tipo (según seed de mapeo COAR).
      - name: coar_uri
        description: URI COAR asociada al tipo.
        data_tests: [not_null]

  - name: dim_conicet_item_accessright
    description: Dimensión de condiciones de acceso (info:eu-repo/semantics/*) mapeadas a COAR Access Rights.
    config:
      tags: [conicet, dm]
    columns:
      - name: dc_right_hk
        description: Clave hash de derechos (hub_oai_right).
        data_tests: [not_null, unique]
      - name: dc_right
        description: URI/valor de derechos provisto por el repositorio.
        data_tests: [not_null]
      - name: coar_uri
        description: URI COAR de la condición de acceso.
        data_tests: [not_null]

  - name: dim_conicet_item_subject_fos
    description: Dimensión de clasificación temática FOS (FORD/BECyT) para subjects expresados como URIs.
    config:
      tags: [conicet, dm]
    columns:
      - name: dc_subject_hk
        description: Clave hash del subject (hub_oai_subject).
        data_tests: [not_null, unique]
      - name: uri
        description: URI original del subject (purl BECyT/FORD).
        data_tests: [not_null]

  - name: brg_conicet_item_identifier_uri
    description: Bridge de identificador institucional `dc.identifier.uri` filtrado por prefijo CONICET.
    config:
      tags: [conicet, dm]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "dc_identifier_uri ~ '^http://hdl\\.handle\\.net/11336/'"
    columns:
      - name: record_hk
        data_tests: [not_null, unique]
      - name: dc_identifier_uri
        data_tests: [not_null]

  - name: brg_conicet_item_relation_doi
    description: Bridge agregado de DOIs (principal + auditoría + conteos) derivado de `dc.relation`.
    config:
      tags: [conicet, dm]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "primary_doi is null OR primary_doi ~* '^10\\.[0-9]{4,9}/[^[:space:]]+$'"
          config:
            severity: warn
    columns:
      - name: record_hk
        data_tests: [not_null, unique]
      - name: primary_doi
        description: DOI principal seleccionado por regla de negocio (MIN).
      - name: count_doi
        description: Cantidad de DOIs detectados para el registro.
        data_tests: [not_null]

  - name: brg_conicet_item_fos
    description: >
      Relación entre registros CONICET y asignaciones FOS efectivas.
      Excluye el nivel padre cuando el mismo registro posee una subárea de esa rama.
    config:
      tags: [conicet, dm]
      meta:
        organization: conicet
        source_system: oai
        model_role: bridge
        grain: record_hk + dc_subject_hk
    columns:
      - name: record_hk
        data_tests: [not_null]
      - name: dc_subject_hk
        data_tests: [not_null]
      - name: uri
        description: URI BECyT/FORD de la asignación conservada.
        data_tests: [not_null]
      - name: code_level_1
        description: Código del área FOS.
        data_tests: [not_null]
      - name: code_level_2
        description: Código de la subárea FOS cuando la asignación posee ese nivel.
      - name: label_level_1
        description: Etiqueta del área FOS.
      - name: label_level_2
        description: Etiqueta de la subárea FOS cuando corresponde.
      - name: resolution_level
        description: Nivel jerárquico resuelto por el diccionario FOS.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [record_hk, dc_subject_hk]

  - name: int_conicet_item_fos_selected
    description: >
      Selección determinística de una asignación FOS coherente por registro.
      Prioriza subáreas y luego ordena por código sin inferir una clasificación principal.
    config:
      tags: [conicet, dm]
      meta:
        organization: conicet
        source_system: oai
        model_role: intermediate
        grain: record_hk
    columns:
      - name: record_hk
        data_tests: [not_null, unique]
      - name: dc_subject_hk
        data_tests: [not_null]
      - name: fos_uri
        data_tests: [not_null]
      - name: fos_code_level_1
        data_tests: [not_null]
      - name: fos_assignment_count
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      - name: has_multiple_fos_assignments
        data_tests: [not_null]

  - name: brg_conicet_publication_doi
    description: >
      Bridge mínimo de superposición entre publicaciones CONICET OAI y OpenAIRE usando solamente
      DOI exacto normalizado. No intenta reconciliación general multi-PID; conserva flags de
      unicidad y conteos para auditar matches ambiguos.
    config:
      tags: [conicet, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [record_hk, researchproduct_hk, doi_normalized]
    columns:
      - name: record_hk
        data_tests: [not_null]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: doi_normalized
        description: >
          DOI normalizado en lowercase y sin prefijos `https://doi.org/`, `http://dx.doi.org/` o
          `doi:`.
        data_tests: [not_null]
      - name: is_unique_oai
        description: Flag que indica que la entidad OAI tiene un único DOI normalizado.
        data_tests: [not_null]
      - name: is_unique_openaire
        description: Flag que indica que la entidad OpenAIRE tiene un único DOI normalizado.
        data_tests: [not_null]
      - name: is_unique_match
        description: Flag que indica match 1 a 1 entre OAI y OpenAIRE para ese DOI.
        data_tests: [not_null]
      - name: match_rule
        description: Regla de matching aplicada.
        data_tests: [not_null]

  - name: brg_conicet_publication_originalid
    description: >
      Bridge de superposición entre publicaciones CONICET OAI y OpenAIRE usando
      el identificador original del repositorio (`record_id = original_id`).
      Conserva flags de unicidad para aislar matches 1 a 1 y reutilizarlos en
      `fct_conicet_publication`.
    config:
      tags: [conicet, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [record_hk, researchproduct_hk, original_id]
    columns:
      - name: record_hk
        data_tests: [not_null]
      - name: record_id
        data_tests: [not_null]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: researchproduct_id
        data_tests: [not_null]
      - name: original_id
        description: Identificador original del repositorio expuesto por OpenAIRE.
        data_tests: [not_null]
      - name: openaire_match_count
        description: Cantidad de research products OpenAIRE que comparten ese `original_id`.
        data_tests: [not_null]
      - name: is_unique_match
        description: Flag que indica unicidad 1 a 1 del match por identificador original.
        data_tests: [not_null]
      - name: match_rule
        description: Regla de matching aplicada.
        data_tests: [not_null]
