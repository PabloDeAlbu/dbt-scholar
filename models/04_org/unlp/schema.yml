version: 2

models:
  - name: dim_unlp_author
    description: >
      Identidades de autor relevantes para los procesos analíticos de la UNLP,
      observadas inicialmente en SEDICI. Conserva identidades con afiliación
      UNLP, externa o desconocida y las enriquece con los identificadores
      disponibles en VOC SEDICI. La pertenencia institucional se modela por
      separado y no está implícita en esta dimensión.
    config:
      meta:
        organization: unlp
        model_role: dimension
        grain: author_id
        temporal_scope: current_snapshot
    columns:
      - name: author_id
        description: Clave técnica de la identidad de autor.
        data_tests: [not_null, unique]
      - name: author_bk
        description: Clave de negocio controlada o nominal de respaldo.
        data_tests: [not_null, unique]
      - name: author_name_preferred
        description: Nombre preferido observado en SEDICI.
        data_tests: [not_null]
      - name: authority
        description: Clave de autoridad observada en SEDICI cuando existe control de autoridades.
      - name: has_authority_control
        description: Indica si la identidad posee una authority.
        data_tests: [not_null]
      - name: author_identity_basis
        description: Base usada para construir la identidad; `autoridad` o `nombre_normalizado`.
        data_tests:
          - not_null
          - accepted_values:
              values: [autoridad, nombre_normalizado]
      - name: voc_person_node_id
        description: Identificador de la persona cuando la authority corresponde con un nodo existente en VOC.
        data_tests:
          - relationships:
              to: ref('dim_vocsedici_persona')
              field: person_node_id
              config:
                where: "voc_person_node_id is not null"
      - name: has_voc_match
        description: Indica si la authority corresponde con una persona existente en VOC.
        data_tests: [not_null]
      - name: voc_person_url
        description: URL pública de la persona en VOC cuando existe correspondencia.
      - name: orcid
        description: ORCID informado por VOC SEDICI.
      - name: scholar_user_id
        description: Identificador del perfil Google Scholar vinculado a la identidad.
      - name: scholar_profile_url
        description: URL pública del perfil Google Scholar.
  - name: fct_unlp_author_affiliation
    description: >
      Afiliaciones institucionales publicadas en VOC SEDICI para las
      identidades de autor relevantes para la UNLP. Una fila por identidad y
      afiliación; conserva su período de vigencia. La pertenencia a la UNLP se
      determina mediante `dim_unlp_organization`.
    config:
      meta:
        organization: unlp
        model_role: fact
        grain: author_id, affiliation_id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [author_id, affiliation_id]
      - dbt_utils.expression_is_true:
          expression: "valid_from is null or valid_to is null or valid_from <= valid_to"
      - dbt_utils.expression_is_true:
          name: unlp_author_affiliation_organization_is_consistent
          expression: "is_unlp_affiliation = (unlp_organization_id is not null)"
    columns:
      - name: author_id
        description: Identificador de la identidad institucional de autor.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unlp_author')
              field: author_id
      - name: voc_person_node_id
        description: Persona VOC vinculada con la identidad de autor.
        data_tests: [not_null]
      - name: affiliation_id
        description: Identificador de la observación de afiliación en VOC.
        data_tests: [not_null]
      - name: institution_node_id
        description: Institución declarada en la afiliación.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_vocsedici_institucion')
              field: institution_node_id
      - name: institution_name
        description: Nombre de la institución declarada.
        data_tests: [not_null]
      - name: unlp_organization_id
        description: >
          Organización canónica UNLP cuando la institución afiliada pertenece
          al árbol representado por `dim_unlp_organization`.
        data_tests:
          - relationships:
              to: ref('dim_unlp_organization')
              field: organization_id
              config:
                where: "unlp_organization_id is not null"
      - name: is_unlp_affiliation
        description: Indica si la afiliación corresponde con una organización de `dim_unlp_organization`.
        data_tests: [not_null]
      - name: valid_from
        description: Inicio declarado de la afiliación, cuando está disponible.
      - name: valid_to
        description: Fin declarado de la afiliación, cuando está disponible.
      - name: affiliation_source
        description: Fuente de la evidencia de afiliación; actualmente `vocsedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: [vocsedici]

  - name: dim_unlp_organizational_unit
    description: >
      Dimensión transversal de unidades organizativas de la UNLP identificadas
      mediante dominios institucionales curados. Tiene una fila por dominio
      normalizado y no pretende representar todavía un padrón oficial completo
      de la estructura institucional.
    config:
      meta:
        organization: unlp
        model_role: dimension
        grain: organizational_unit_domain
        temporal_scope: current_snapshot
    columns:
      - name: organizational_unit_domain
        description: Dominio institucional normalizado que identifica operativamente la unidad.
        data_tests: [not_null, unique]
      - name: organizational_unit_domain_label
        description: Etiqueta corta y curada del dominio institucional.
        data_tests: [not_null]
      - name: organizational_unit_name
        description: Nombre curado de la unidad organizativa.
        data_tests: [not_null]
      - name: parent_organizational_unit_name
        description: Nombre curado de la unidad organizativa superior.
        data_tests: [not_null]
      - name: organization_ror
        description: ROR de la Universidad Nacional de La Plata, organización que contiene estas unidades.
        data_tests: [not_null]

  - name: dim_unlp_organization
    description: >
      Organizaciones pertenecientes al árbol institucional de la UNLP observado
      en VOC SEDICI. Tiene una fila por organización, una clave analítica y el
      identificador original del nodo VOC para conservar su procedencia;
      `pidu_id` es otro identificador fuente opcional. No infiere tipos
      organizativos a partir de la profundidad.
    config:
      meta:
        organization: unlp
        model_role: dimension
        grain: organization_id
        temporal_scope: current_snapshot
    columns:
      - name: organization_id
        description: Identificador analítico de la organización.
        data_tests: [not_null, unique]
      - name: vocsedici_institution_node_id
        description: Identificador original del nodo institucional en VOC SEDICI.
        data_tests: [not_null, unique]
      - name: organization_name
        description: Nombre de la organización publicado en VOC SEDICI.
        data_tests: [not_null]
      - name: pidu_id
        description: Identificador histórico PIDU, cuando fue informado en VOC SEDICI.
      - name: is_active
        description: Indica si el nodo se encuentra publicado en VOC SEDICI.
        data_tests: [not_null]
      - name: source_hierarchy_level
        description: Profundidad observada en el árbol UNLP de VOC; no representa un tipo organizativo.
        data_tests: [not_null]
      - name: source_url
        description: URL pública del nodo utilizado como fuente.
        data_tests: [not_null]
      - name: source
        description: Fuente de la observación; actualmente `vocsedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: [vocsedici]
    data_tests:
      - dbt_utils.expression_is_true:
          name: unlp_organization_vocsedici_identifier_is_consistent
          expression: "organization_id = vocsedici_institution_node_id"

  - name: brg_unlp_organization_relationship
    description: >
      Relaciones directas entre organizaciones UNLP observadas en VOC SEDICI.
      Modela el vínculo dirigido desde una organización hacia la organización
      a la que pertenece, sin asumir que la jerarquía futura tendrá un único padre.
    config:
      meta:
        organization: unlp
        model_role: bridge
        grain: organization_id, related_organization_id, relationship_type
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [organization_id, related_organization_id, relationship_type]
    columns:
      - name: organization_id
        description: Organización hija en la relación.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unlp_organization')
              field: organization_id
      - name: related_organization_id
        description: Organización padre directa.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unlp_organization')
              field: organization_id
      - name: relationship_type
        description: Tipo de relación dirigida; actualmente `pertenece_a`.
        data_tests:
          - not_null
          - accepted_values:
              values: [pertenece_a]
      - name: source
        description: Fuente de la relación; actualmente `vocsedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: [vocsedici]

  - name: brg_unlp_organization_hierarchy
    description: >
      Cierre transitivo de la jerarquía organizativa UNLP. Tiene una fila por
      organización y antecesora alcanzable, incluye la relación consigo misma
      con distancia cero y conserva la ruta empleada para auditoría.
    config:
      meta:
        organization: unlp
        model_role: bridge
        grain: organization_id, ancestor_organization_id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [organization_id, ancestor_organization_id]
    columns:
      - name: organization_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unlp_organization')
              field: organization_id
      - name: ancestor_organization_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unlp_organization')
              field: organization_id
      - name: distance
        description: Cantidad de relaciones directas entre la organización y su antecesora.
        data_tests: [not_null]
      - name: is_self
        description: Indica la fila de distancia cero de cada organización.
        data_tests: [not_null]
      - name: is_direct
        description: Indica una relación directa con distancia uno.
        data_tests: [not_null]
      - name: organization_path_ids
        description: Ruta de identificadores desde la organización hasta la antecesora.
        data_tests: [not_null]

  - name: fct_unlp_publication
    description: >
      Hecho institucional principal de publicaciones UNLP, basado en
      `fct_unlp_sedici_item_publication` como universo del repositorio institucional
      y enriquecido con OpenAlex por DOI exacto y único y con OpenAIRE por
      identificador original del repositorio. Este modelo representa
      publicaciones de SEDICI y no un universo deduplicado general entre todas las fuentes.
    config:
      tags: [unlp, dm]
    columns:
      - name: publication_hk
        description: Identificador técnico de la publicación institucional, alineado al `item_hk` de SEDICI.
        data_tests: [not_null, unique]
      - name: item_hk
        description: Clave hash del ítem del repositorio institucional.
        data_tests:
          - not_null
          - unique
      - name: item_id
        description: ID original del ítem en DSpace 5.
        data_tests: [not_null]
      - name: source_system
        description: Sistema fuente base del hecho institucional; en este modelo vale `sedici`.
        data_tests: [not_null]
      - name: source_label
        description: Etiqueta técnica de la fuente de extracción del repositorio.
        data_tests: [not_null]
      - name: institution_ror
        description: ROR institucional usado para definir el subconjunto UNLP del repositorio.
        data_tests: [not_null]
      - name: institutional_uri
        description: URI institucional de citación del ítem en el repositorio.
        data_tests: [not_null]
      - name: dc_identifier_uri_raw
        description: Valores crudos observados para `dc.identifier.uri` concatenados para auditoría.
      - name: publication_date
        description: Fecha de publicación declarada en SEDICI.
      - name: publication_year
        description: Año derivado de `publication_date` cuando existe.
      - name: date_accessioned
        description: Fecha de alta del ítem en el repositorio institucional.
      - name: title
        description: Título principal de la publicación en SEDICI.
      - name: subtitle
        description: Títulos alternativos o subtítulos concatenados con `|`.
      - name: publication_type
        description: Tipología declarada para la publicación en SEDICI.
      - name: description
        description: Descripciones o abstracts concatenados con `|`.
      - name: subject
        description: Subjects declarados para la publicación, concatenados con `|`.
      - name: subtype
        description: Subtipos SEDICI concatenados con `|`.
      - name: author
        description: Autores declarados en SEDICI, concatenados con `|`.
      - name: author_count
        description: Cantidad de autores distintos detectados para la publicación.
        data_tests: [not_null]
      - name: issn
        description: ISSN declarados para la publicación, concatenados con `|`.
      - name: isbn
        description: ISBN declarados para la publicación, concatenados con `|`.
      - name: has_doi
        description: Flag que indica si el ítem tiene al menos un DOI normalizado.
        data_tests: [not_null]
      - name: doi_count
        description: Cantidad de DOI normalizados detectados en los metadatos de SEDICI.
        data_tests: [not_null]
      - name: doi
        description: DOI normalizados declarados en SEDICI, concatenados con `|`.
      - name: has_handle
        description: Flag que indica si el ítem tiene al menos un handle normalizado.
        data_tests: [not_null]
      - name: handle_count
        description: Cantidad de handles normalizados detectados en los metadatos de SEDICI.
        data_tests: [not_null]
      - name: handle
        description: Handles normalizados declarados en SEDICI, concatenados con `|`.
      - name: owningcollection_hk
        description: Hash key de la colección dueña del ítem dentro del scope institucional.
      - name: owning_collection_title
        description: Título preferido de la colección dueña.
      - name: owning_community_hk
        description: Hash key de la comunidad inmediata de la colección dueña.
      - name: owning_community_id
        description: Identificador original de la comunidad inmediata de la colección dueña.
      - name: owning_community_title
        description: Título preferido de la comunidad inmediata de la colección dueña.
      - name: owning_root_community_hk
        description: Hash key de la comunidad raíz de la rama de la colección dueña.
      - name: owning_root_community_id
        description: Identificador original de la comunidad raíz de la rama de la colección dueña.
      - name: owning_root_community_title
        description: Título preferido de la comunidad raíz de la rama de la colección dueña.
      - name: owning_community_path_ids
        description: Camino jerárquico de IDs desde la raíz hasta la comunidad dueña.
      - name: owning_community_path_titles
        description: Camino jerárquico de títulos desde la raíz hasta la comunidad dueña.
      - name: discoverable
        description: Flag operativo heredado de DSpace 5 que indica si el ítem es descubrible.
        data_tests: [not_null]
      - name: in_archive
        description: Flag operativo heredado de DSpace 5 que indica si el ítem está archivado.
        data_tests: [not_null]
      - name: withdrawn
        description: Flag operativo heredado de DSpace 5 que indica si el ítem fue retirado.
        data_tests: [not_null]
      - name: matched_by_unique_doi
        description: Indica si la publicación fue enriquecida por un match DOI exacto y único contra OpenAlex.
        data_tests: [not_null]
      - name: match_doi
        description: DOI normalizado usado para el enriquecimiento con OpenAlex, cuando existe.
      - name: openalex_work_hk
        description: Clave hash del work OpenAlex enlazado por DOI único, cuando existe.
      - name: openalex_work_id
        description: Identificador canónico del work OpenAlex enlazado, cuando existe.
      - name: openalex_publication_date
        description: Fecha de publicación informada por OpenAlex para el work enlazado.
      - name: openalex_publication_year
        description: Año de publicación informado por OpenAlex para el work enlazado.
      - name: openalex_type
        description: Tipología de OpenAlex del work enlazado.
      - name: openalex_title
        description: Título de OpenAlex del work enlazado.
      - name: openalex_institution_ror
        description: ROR institucional asociado al extracto UNLP de OpenAlex.
      - name: openalex_first_extract_datetime
        description: Primera fecha-hora en que el work enlazado fue observado en el extracto UNLP de OpenAlex.
      - name: openalex_last_extract_datetime
        description: Última fecha-hora en que el work enlazado fue observado en el extracto UNLP de OpenAlex.
      - name: openalex_is_oa
        description: Flag de acceso abierto informado por OpenAlex.
      - name: openalex_oa_status
        description: Estado OA informado por OpenAlex.
      - name: openalex_oa_url
        description: URL OA preferida informada por OpenAlex.
      - name: openalex_has_fulltext
        description: Flag que indica disponibilidad de full text según OpenAlex.
      - name: openalex_fulltext_origin
        description: Origen del full text según OpenAlex.
      - name: openalex_cited_by_count
        description: Cantidad de citas recibidas según OpenAlex.
      - name: openalex_fwci
        description: Field-Weighted Citation Impact informado por OpenAlex.
      - name: matched_by_unique_original_id
        description: Indica si la publicación fue enriquecida por un match de identificador original contra OpenAIRE.
        data_tests: [not_null]
      - name: openaire_original_id
        description: Identificador original del repositorio expuesto por OpenAIRE y usado en el match.
      - name: openaire_researchproduct_hk
        description: Clave hash del research product OpenAIRE enlazado por identificador original, cuando existe.
        data_tests:
          - relationships:
              to: ref('fct_unlp_openaire_researchproduct')
              field: researchproduct_hk
              config:
                where: "openaire_researchproduct_hk is not null"
      - name: openaire_researchproduct_id
        description: Identificador canónico del research product OpenAIRE enlazado, cuando existe.
      - name: openaire_first_extract_datetime
        description: Primera fecha-hora en que el research product enlazado fue observado en el extracto UNLP de OpenAIRE.
      - name: openaire_last_extract_datetime
        description: Última fecha-hora en que el research product enlazado fue observado en el extracto UNLP de OpenAIRE.
      - name: openaire_organization_ror
        description: ROR organizacional asociado al registro OpenAIRE enlazado.
      - name: openaire_publication_date
        description: Fecha de publicación informada por OpenAIRE.
      - name: openaire_type
        description: Tipología informada por OpenAIRE.
      - name: openaire_title
        description: Título principal informado por OpenAIRE.
      - name: openaire_publisher
        description: Publisher informado por OpenAIRE.
      - name: openaire_access_right
        description: Mejor acceso declarado por OpenAIRE para el registro enlazado.
      - name: openaire_access_right_uri
        description: URI del mejor acceso declarado por OpenAIRE.
      - name: openaire_is_green
        description: Flag que indica si OpenAIRE clasifica el registro como green OA.
      - name: openaire_is_in_diamond_journal
        description: Flag que indica si OpenAIRE lo clasifica dentro de una revista diamond.
      - name: openaire_downloads
        description: Descargas informadas por OpenAIRE.
      - name: openaire_views
        description: Vistas informadas por OpenAIRE.
      - name: openaire_citation_class
        description: Clase de citación calculada por OpenAIRE.
      - name: openaire_citation_count
        description: Cantidad de citas informada por OpenAIRE.
      - name: openaire_impulse
        description: Métrica `impulse` informada por OpenAIRE.
      - name: openaire_impulse_class
        description: Clase de `impulse` informada por OpenAIRE.
      - name: openaire_influence
        description: Métrica `influence` informada por OpenAIRE.
      - name: openaire_influence_class
        description: Clase de `influence` informada por OpenAIRE.
      - name: openaire_popularity
        description: Métrica `popularity` informada por OpenAIRE.
      - name: openaire_popularity_class
        description: Clase de `popularity` informada por OpenAIRE.
      - name: openaire_has_arxiv
        description: Flag que indica presencia de identificadores arXiv en OpenAIRE.
      - name: openaire_has_single_arxiv
        description: Flag que indica unicidad de identificador arXiv en OpenAIRE.
      - name: openaire_arxiv_count
        description: Cantidad de identificadores arXiv observados en OpenAIRE.
      - name: openaire_has_doi
        description: Flag que indica presencia de DOI en OpenAIRE.
      - name: openaire_has_single_doi
        description: Flag que indica unicidad de DOI en OpenAIRE.
      - name: openaire_doi_count
        description: Cantidad de DOI observados en OpenAIRE.
      - name: openaire_has_handle
        description: Flag que indica presencia de handle en OpenAIRE.
      - name: openaire_has_single_handle
        description: Flag que indica unicidad de handle en OpenAIRE.
      - name: openaire_handle_count
        description: Cantidad de handles observados en OpenAIRE.
      - name: openaire_has_mag
        description: Flag que indica presencia de identificadores MAG en OpenAIRE.
      - name: openaire_has_single_mag
        description: Flag que indica unicidad de identificadores MAG en OpenAIRE.
      - name: openaire_mag_count
        description: Cantidad de identificadores MAG observados en OpenAIRE.
      - name: openaire_has_pmb
        description: Flag que indica presencia de identificadores PMB en OpenAIRE.
      - name: openaire_has_single_pmb
        description: Flag que indica unicidad de identificadores PMB en OpenAIRE.
      - name: openaire_pmb_count
        description: Cantidad de identificadores PMB observados en OpenAIRE.
      - name: openaire_has_pmc
        description: Flag que indica presencia de identificadores PMC en OpenAIRE.
      - name: openaire_has_single_pmc
        description: Flag que indica unicidad de identificadores PMC en OpenAIRE.
      - name: openaire_pmc_count
        description: Cantidad de identificadores PMC observados en OpenAIRE.
      - name: openaire_has_pmid
        description: Flag que indica presencia de PMID en OpenAIRE.
      - name: openaire_has_single_pmid
        description: Flag que indica unicidad de PMID en OpenAIRE.
      - name: openaire_pmid_count
        description: Cantidad de PMID observados en OpenAIRE.
      - name: openaire_has_sdg
        description: Flag que indica presencia de SDGs asociados en OpenAIRE.
      - name: openaire_sdg_count
        description: Cantidad de SDGs asociados en OpenAIRE.
      - name: openaire_sdg_values
        description: Valores SDG asociados al registro enlazado en OpenAIRE.

  - name: brg_unlp_publication_originalid
    description: >
      Bridge de superposición entre publicaciones UNLP del IR y OpenAIRE usando
      el handle institucional extraído desde `original_id`.
    config:
      tags: [unlp, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_hk, researchproduct_hk, handle_normalized]
    columns:
      - name: item_hk
        data_tests: [not_null]
      - name: item_id
        data_tests: [not_null]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: researchproduct_id
        data_tests: [not_null]
      - name: original_id
        description: Identificador original expuesto por OpenAIRE.
        data_tests: [not_null]
      - name: handle_normalized
        description: Handle SEDICI normalizado (`10915/...`) usado para el match.
        data_tests: [not_null]
      - name: is_unique_match
        description: Flag que indica unicidad 1 a 1 del match por handle.
        data_tests: [not_null]

  - name: brg_unlp_publication_doi
    description: >
      Bridge de superposición entre publicaciones UNLP del IR y OpenAlex usando
      DOI exacto normalizado.
    config:
      tags: [unlp, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_hk, work_hk, doi_normalized]
    columns:
      - name: item_hk
        data_tests: [not_null]
      - name: item_id
        data_tests: [not_null]
      - name: work_hk
        data_tests: [not_null]
      - name: work_id
        data_tests: [not_null]
      - name: doi_normalized
        description: DOI normalizado usado para el match con OpenAlex.
        data_tests: [not_null]
      - name: is_unique_match
        description: Flag que indica unicidad 1 a 1 del match por DOI.
        data_tests: [not_null]
