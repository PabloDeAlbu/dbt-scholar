version: 2

models:
  - name: int_unlp_sedicidb_item_metadatavalue
    description: >
      Base común de los metadatos de ítems del snapshot de SEDICI, con una fila
      por `metadata_value_id`. Conserva el valor original, aplica
      normalizaciones generales y mantiene los atributos necesarios para que
      los resúmenes por ítem y las transformaciones especializadas puedan
      interpretar sus observaciones.
    columns:
      - name: metadata_value_id
        description: Identificador de la observación de metadatos en DSpace 5.
        data_tests: [not_null, unique]
      - name: item_id
        description: Ítem al que pertenece la observación.
        data_tests: [not_null]
      - name: metadata_field_id
        description: Identificador del metadatafield observado.
        data_tests: [not_null]
      - name: metadatafield_fullname
        description: Nombre completo formado por schema, element y qualifier.
        data_tests: [not_null]
      - name: text_value_raw
        description: Valor textual original, sin limpieza ni recorte.
      - name: text_value
        description: Valor con espacios y caracteres invisibles normalizados.
      - name: text_lang_raw
        description: Idioma original informado en `text_lang`.
      - name: text_lang
        description: Idioma normalizado mediante `LOWER(BTRIM(text_lang_raw))`.
      - name: authority_raw
        description: Identificador de autoridad original, sin limpieza ni recorte.
      - name: authority
        description: Clave de autoridad sin espacios exteriores.
      - name: confidence
        description: Código de confianza original de DSpace.
      - name: place
        description: Posición declarada por DSpace para el valor.
