version: 2

models:
  - name: int_unlp_sedicidb_collection_dc_description
    description: >
      Observaciones de `dc.description` correspondientes a colecciones de
      SEDICI, con una fila por `metadata_value_id`. Conserva el valor original
      y una versión con espacios y caracteres invisibles normalizados.
    columns:
      - name: metadata_value_id
        description: Identificador de la observación original.
        data_tests: [not_null, unique]
      - name: collection_id
        description: Colección a la que pertenece la descripción.
        data_tests: [not_null]
      - name: value_raw
        description: Descripción original de la colección.
      - name: value
        description: Descripción normalizada de la colección.
        data_tests: [not_null]
