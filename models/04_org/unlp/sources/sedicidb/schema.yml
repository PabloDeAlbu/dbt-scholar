version: 2

sources:
  - name: sedicidb
    description: >
      Dump completo vigente de la base de datos DSpace 5 de SEDICI, consultado
      directamente como snapshot relacional. Esta familia no pasa por Data
      Vault ni conserva por sí misma la historia entre dumps.
    schema: ldg_sedicidb
    meta:
      organization: unlp
      source_system: sedicidb
      input_layer: ldg
      temporal_scope: current_snapshot
      ingestion_mode: direct_database_dump
      history_strategy: none
    tables:
      - name: item
      - name: handle
      - name: collection2item
      - name: collection
      - name: community
      - name: community2collection
      - name: community2community
      - name: metadatavalue
      - name: metadatafieldregistry
      - name: metadataschemaregistry

models:
  - name: fct_unlp_sedicidb_metadatafield_usage
    description: >
      Uso general de los metadatafields registrados en el dump directo vigente
      de SEDICIDB. Presenta una fila por `metadata_field_id`, incluidos los
      campos sin valores; no representa historia entre dumps.
    columns:
      - name: metadata_field_id
        description: Identificador del metadatafield en DSpace 5.
        data_tests: [not_null, unique]
      - name: metadatafield_fullname
        description: Nombre completo formado por schema, element y qualifier.
        data_tests: [not_null, unique]
      - name: metadata_value_count
        description: Cantidad de valores asociados al metadatafield en todos los tipos de recurso.
        data_tests: [not_null]

  - name: dim_unlp_sedicidb_community
    description: >
      Dimensión de comunidades construida directamente desde el dump vigente de
      SEDICI. Presenta una fila por `community_id`. Resuelve el título preferido,
      la comunidad padre, la raíz y el recorrido jerárquico.
    columns:
      - name: community_id
        description: Identificador de la comunidad en DSpace 5.
        data_tests: [not_null, unique]
      - name: community_title
        description: Título `dc.title` preferido de la comunidad.
      - name: parent_community_id
        description: Identificador de la comunidad padre inmediata; es nulo para comunidades raíz.
      - name: parent_community_title
        description: Título preferido de la comunidad padre inmediata.
      - name: root_community_id
        description: Identificador de la comunidad raíz del camino.
        data_tests: [not_null]
      - name: root_community_title
        description: Título preferido de la comunidad raíz.
      - name: root_child_community_id
        description: >
          Identificador de la primera comunidad situada debajo de la raíz en
          el camino; es nulo cuando la fila representa la propia raíz.
      - name: root_child_community_title
        description: Título preferido de la primera comunidad situada debajo de la raíz.
      - name: community_depth
        description: Distancia desde la comunidad hasta su raíz; vale cero para una raíz.
        data_tests: [not_null]
      - name: community_path_ids
        description: IDs ordenados desde la raíz hasta la comunidad, separados con ` > `.
        data_tests: [not_null]
      - name: community_path_titles
        description: Títulos ordenados desde la raíz hasta la comunidad, separados con ` > `.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_community_parent_not_self
          expression: "parent_community_id is null or parent_community_id <> community_id"
      - dbt_utils.expression_is_true:
          name: sedicidb_community_depth_nonnegative
          expression: "community_depth >= 0"
      - dbt_utils.expression_is_true:
          name: sedicidb_community_path_starts_at_root
          expression: >
            root_community_title is null
            or community_path_titles = root_community_title
            or community_path_titles like root_community_title || ' > %'

  - name: dim_unlp_sedicidb_collection
    description: >
      Dimensión de colecciones construida directamente desde el dump vigente de
      SEDICI. Presenta una fila por `collection_id` y resuelve el título
      preferido y el contexto de la comunidad contenedora.
    columns:
      - name: collection_id
        description: Identificador de la colección en DSpace 5.
        data_tests: [not_null, unique]
      - name: collection_title
        description: Título `dc.title` preferido de la colección.
      - name: community_id
        description: Comunidad que contiene directamente la colección.
        data_tests:
          - relationships:
              name: sedicidb_collection_community_in_community_dim
              to: ref('dim_unlp_sedicidb_community')
              field: community_id
      - name: community_title
        description: Título preferido de la comunidad inmediata.
      - name: root_community_id
        description: Comunidad raíz del camino de la colección.
      - name: root_community_title
        description: Título preferido de la comunidad raíz.
      - name: root_child_community_id
        description: Primera comunidad debajo de la raíz que contiene la colección.
      - name: root_child_community_title
        description: Título preferido de la primera comunidad debajo de la raíz.
      - name: community_depth
        description: Distancia entre la comunidad inmediata y su raíz.
      - name: community_path_ids
        description: IDs desde la comunidad raíz hasta la inmediata, separados con ` > `.
      - name: community_path_titles
        description: Títulos desde la comunidad raíz hasta la inmediata, separados con ` > `.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_collection_path_starts_at_root
          expression: >
            root_community_title is null
            or community_path_titles = root_community_title
            or community_path_titles like root_community_title || ' > %'

  - name: brg_unlp_sedicidb_item_doi
    description: >
      Relación entre ítems y DOI normalizados observados directamente en el
      dump vigente de SEDICIDB. Presenta una fila por `item_id` y DOI, y
      conserva los metadatafields que aportaron evidencia.
    config:
      meta:
        organization: unlp
        source_system: sedicidb
        model_role: bridge
        grain: item_id + doi
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_id, doi]
      - dbt_utils.expression_is_true:
          name: sedicidb_item_doi_is_normalized
          expression: "doi = lower(doi) and doi ~ '^10[.][0-9]{4,9}/.+'"
    columns:
      - name: item_id
        description: Identificador del ítem en la base de datos de SEDICI.
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_unlp_sedicidb_item_publication')
              field: item_id
      - name: doi
        description: DOI en minúsculas, sin URL ni puntuación final.
        data_tests: [not_null]
      - name: metadatafields
        description: Metadatafields que contienen el DOI, unidos con `|`.
        data_tests: [not_null]
      - name: observation_count
        description: Cantidad de observaciones de metadatos que contienen el DOI.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"

  - name: brg_unlp_sedicidb_item_author
    description: >
      Relación entre ítems y autores o compiladores representados por metadatos
      del dump vigente de SEDICIDB. Presenta una fila por `metadata_value_id`,
      no conserva historia entre dumps y no concilia personas mediante nombres
      ni autoridades.
    columns:
      - name: metadata_value_id
        description: Identificador de la observación original de metadatos.
        data_tests: [not_null, unique]
      - name: item_id
        description: Ítem relacionado con la observación de autoría.
        data_tests: [not_null]
      - name: author_role
        description: Rol específico derivado del metadatafield de origen.
        data_tests:
          - accepted_values:
              values: ['creator_person', 'creator_corporate', 'contributor_compiler']
      - name: author_type
        description: Tipo general de entidad autora.
        data_tests:
          - accepted_values:
              values: ['person', 'corporate']
      - name: author_name_raw
        description: Nombre exactamente como aparece en el dump.
      - name: author_name
        description: Nombre normalizado por el modelo específico del metadatafield.
        data_tests: [not_null]
      - name: authority
        description: >
          Clave de autoridad informada en la observación. Puede estar ausente y
          sus atributos pueden diferir del estado actual de VOC SEDICI.
      - name: has_authority_control
        description: Indica que la observación posee una clave `authority` no vacía.
        data_tests: [not_null]
      - name: confidence
        description: Código de confianza original, conservado sin interpretación.
      - name: author_place
        description: Posición original de la observación dentro del metadatafield.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_item_author_control_matches_authority
          expression: "has_authority_control = (authority is not null)"

  - name: dim_unlp_sedicidb_author
    description: >
      Autoridades de autor informadas en el dump vigente de SEDICIDB. Presenta
      una fila por `authority`, excluye autorías sin autoridad y describe los
      nombres conservados en el snapshot, que pueden no estar sincronizados con
      VOC SEDICI.
    columns:
      - name: authority
        description: Clave de autoridad almacenada en SEDICIDB.
        data_tests: [not_null, unique]
      - name: preferred_name
        description: Nombre limpio más frecuente para la autoridad, con desempate alfabético.
        data_tests: [not_null]
      - name: names
        description: Nombres limpios distintos asociados con la autoridad, ordenados y unidos con `|`.
        data_tests: [not_null]

  - name: fct_unlp_sedicidb_item_publication
    description: >
      Una fila por ítem del dump directo vigente de SEDICI, con estados DSpace
      y metadatos escalares reutilizables. Representa el snapshot corriente
      cargado en `ldg_sedicidb`; no pasa por Data Vault ni conserva versiones
      anteriores.
    config:
      meta:
        organization: unlp
        source_system: sedicidb
        input_layer: ldg
        model_role: fact
        business_process: item_publication
        grain: item_id
        temporal_scope: current_snapshot
        ingestion_mode: direct_database_dump
        history_strategy: none
        source_family: sedicidb
    columns:
      - name: item_id
        description: Identificador del ítem en DSpace 5.
        data_tests: [not_null, unique]
      - name: in_archive
        description: Estado `in_archive` vigente en el dump; puede ser nulo en registros fuente incompletos.
      - name: withdrawn
        description: Estado `withdrawn` vigente en el dump; puede ser nulo en registros fuente incompletos.
      - name: discoverable
        description: Estado `discoverable` vigente en el dump.
        data_tests: [not_null]
      - name: owning_collection
        description: Identificador de la colección dueña declarada por el ítem.
        data_tests:
          - relationships:
              name: sedicidb_item_owning_collection_in_collection_dim
              to: ref('dim_unlp_sedicidb_collection')
              field: collection_id
      - name: owning_collection_title
        description: Título preferido de la colección dueña.
      - name: owning_community_id
        description: Identificador de la comunidad que contiene la colección dueña.
      - name: owning_community_title
        description: Título preferido de la comunidad inmediata.
      - name: owning_root_community_id
        description: Identificador de la comunidad raíz del camino estructural.
      - name: owning_root_community_title
        description: Título preferido de la comunidad raíz.
      - name: owning_root_child_community_id
        description: Primera comunidad debajo de la raíz que contiene el ítem.
      - name: owning_root_child_community_title
        description: Título preferido de la primera comunidad debajo de la raíz.
      - name: owning_community_path_ids
        description: Camino de IDs de comunidades desde la raíz hasta la inmediata.
      - name: owning_community_path_titles
        description: Camino de títulos de comunidades desde la raíz hasta la inmediata.
      - name: dc_type
        description: Valor no vacío de `dc.type` seleccionado por el mayor `metadata_value_id`.
      - name: sedici_subtype
        description: Valor no vacío de `sedici.subtype` seleccionado por el mayor `metadata_value_id`.
      - name: dc_title_raw
        description: >
          Valor original de la observación de `dc.title` seleccionada
          por el mayor `metadata_value_id`.
      - name: dc_title
        description: >
          Título seleccionado y normalizado por la capa `int`.
      - name: dc_date_issued_raw
        description: >
          Valor válido priorizado de `dc.date.issued`, conservando la precisión
          declarada en la fuente. Los valores inválidos no se seleccionan.
      - name: dc_date_issued
        description: >
          Fecha de publicación derivada de `dc.date.issued`; completa con día
          1 cuando la fuente informa solamente año o año-mes.
      - name: dc_date_issued_precision
        description: Precisión del valor seleccionado de `dc.date.issued`.
        data_tests:
          - accepted_values:
              values: ['day', 'month', 'year']
      - name: publication_year
        description: Año derivado de `dc_date_issued` para agrupaciones y gráficos.
      - name: dc_date_accessioned_raw
        description: Valor válido priorizado de `dc.date.accessioned`.
      - name: dc_date_accessioned
        description: >
          Fecha de ingreso del ítem al repositorio según
          `dc.date.accessioned`; se utiliza para medir el crecimiento de SEDICI.
      - name: dc_date_available_raw
        description: Valor válido priorizado de `dc.date.available`.
      - name: dc_date_available
        description: >
          Fecha en que el recurso quedó disponible en el repositorio según
          `dc.date.available`; no representa necesariamente su publicación.
      - name: sedici_date_exposure_raw
        description: Valor priorizado de `sedici.date.exposure` conservado como fue informado.
      - name: sedici_date_exposure
        description: Fecha de exposición derivada de `sedici.date.exposure`.
      - name: sedici_date_exposure_precision
        description: Precisión de la fecha de exposición seleccionada.
        data_tests:
          - accepted_values:
              values: ['day', 'month', 'year']
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_item_publication_path_starts_at_root
          expression: >
            owning_root_community_title is null
            or owning_community_path_titles = owning_root_community_title
            or owning_community_path_titles like owning_root_community_title || ' > %'
      - dbt_utils.expression_is_true:
          name: sedicidb_published_item_has_subtype
          expression: >
            not (
              in_archive is true
              and withdrawn is false
              and discoverable is true
              and handle is not null
            )
            or sedici_subtype is not null
