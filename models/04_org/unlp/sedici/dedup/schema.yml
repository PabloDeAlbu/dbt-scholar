version: 2

models:
  - name: fct_unlp_sedici_dedup_publication
    description: >
      Conjunto estable y normalizado de publicaciones SEDICI/UNLP a grano una
      fila por publicación, preparado para consumo posterior desde Kedro en
      procesos de deduplicación. Actualmente parte de
      `fct_unlp_sedici_item_publication`. Expone en primer plano el mismo bloque
      de columnas usado en consultas operativas para exportar CSVs de
      deduplicación y conserva algunas columnas de soporte para consumidores
      downstream.
    columns:
      - name: source
        description: Origen fijo del registro; en este modelo vale `sedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sedici']
      - name: id
        description: >
          Handle institucional del ítem en formato `10915/...`, derivado de
          `dc.identifier.uri`.
        data_tests: [not_null, unique]
      - name: type
        description: Tipo documental crudo tal como llega desde SEDICI.
      - name: subtype
        description: Subtipo documental reportado por SEDICI cuando existe.
      - name: date
        description: Fecha de emisión priorizada del ítem, derivada de `date_issued`.
      - name: dc_date_available
        description: Fecha de disponibilidad institucional derivada de `dc.date.available`.
      - name: title
        description: Título normalizado con `trim` y colapso de espacios.
      - name: subtitle
        description: Subtítulo o títulos alternativos concatenados cuando existen.
      - name: author
        description: Lista de autores separada por `|`, sin duplicados y preservando `author_place` cuando está disponible.
      - name: doi
        description: DOI normalizados en lowercase y sin prefijos URL o `doi:`.
      - name: issn
        description: ISSN distintos concatenados con `|`.
      - name: isbn
        description: ISBN distintos concatenados con `|`.
      - name: subject
        description: Lista de materias o palabras clave normalizadas.
      - name: owning_root_community_id
        description: Identificador de la comunidad raíz dueña del ítem.
      - name: owning_root_community_title
        description: Título de la comunidad raíz dueña del ítem.
      - name: owning_community_path_titles
        description: Camino textual completo de comunidades dueñas.
      - name: owning_community_id
        description: Identificador de la comunidad dueña inmediata.
      - name: owning_community_title
        description: Título de la comunidad dueña inmediata.
      - name: owning_collection
        description: Identificador institucional de la colección dueña.
      - name: owning_collection_title
        description: Título de la colección dueña.
      - name: publication_year
        description: Año de publicación derivado de la fecha priorizada del modelo analítico institucional.
      - name: type_dedup
        description: Tipo documental normalizado bajo un vocabulario textual común basado en COAR.
      - name: description
        description: Descripción o resumen con saltos de línea y espacios repetidos colapsados.
      - name: dedup_eligible
        description: >
          Vale `true` cuando el registro tiene título, tipo dedup normalizado, autor
          y año; los no elegibles permanecen en la salida para auditoría.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_dedup_publication_publication_year_range
          expression: "publication_year is null or publication_year between 1500 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_dedup_publication_date_year_range
          expression: "date is null or extract(year from date) between 1500 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_dedup_publication_date_matches_year
          expression: "publication_year is null or date is null or publication_year = extract(year from date)::integer"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_dedup_publication_eligible_has_title
          expression: "dedup_eligible = false or title is not null"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_dedup_publication_eligible_has_type
          expression: "dedup_eligible = false or type_dedup is not null"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_dedup_publication_eligible_has_author
          expression: "dedup_eligible = false or author is not null"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_dedup_publication_eligible_has_year
          expression: "dedup_eligible = false or publication_year is not null"

  - name: fct_unlp_openalex_dedup_publication
    description: >
      Conjunto estable y normalizado de publicaciones OpenAlex del subconjunto
      UNLP, a grano una fila por work, preparado para deduplicación posterior.
      Parte de `fct_unlp_openalex_work_publication`, conserva como `id` el
      `work_id` estable y agrega autores con un orden determinista por bucket
      `first/middle/last` porque el mart actual no expone una secuencia más fina.
    columns:
      - name: source
        description: Origen fijo del registro; en este modelo vale `openalex`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['openalex']
      - name: id
        description: Identificador canónico estable del work en OpenAlex.
        data_tests: [not_null, unique]
      - name: publication_year
        description: Año de publicación tomado del modelo analítico institucional de OpenAlex.
      - name: type
        description: Tipo documental crudo tal como llega desde OpenAlex.
      - name: subtype
        description: Campo no disponible en OpenAlex dentro de esta preparación; se devuelve `null`.
      - name: title
        description: Título normalizado con `trim` y colapso de espacios.
      - name: subtitle
        description: Campo no disponible en OpenAlex dentro de esta preparación; se devuelve `null`.
      - name: type_dedup
        description: Tipo documental normalizado bajo un vocabulario textual común basado en COAR.
      - name: author
        description: Lista de autores separada por `|`, sin duplicados, con orden determinista por bucket de autoría.
      - name: date
        description: Año de publicación en formato texto `YYYY`.
      - name: doi
        description: DOI normalizados en lowercase y sin prefijos URL o `doi:`.
      - name: isbn
        description: Campo no disponible en OpenAlex dentro de esta preparación; se devuelve `null`.
      - name: issn
        description: ISSN distintos concatenados con `|`.
      - name: description
        description: Campo no disponible en OpenAlex dentro de esta preparación; se devuelve `null`.
      - name: dedup_eligible
        description: >
          Vale `true` cuando el registro tiene título, tipo normalizado, autor
          y año; los no elegibles permanecen en la salida para auditoría.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_unlp_openalex_dedup_publication_publication_year_range
          expression: "publication_year is null or publication_year between 1800 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_openalex_dedup_publication_date_format
          expression: "date is null or date ~ '^[0-9]{4}$'"
      - dbt_utils.expression_is_true:
          name: fct_unlp_openalex_dedup_publication_date_matches_year
          expression: "publication_year is null or date is null or publication_year::text = date"
      - dbt_utils.expression_is_true:
          name: fct_unlp_openalex_dedup_publication_eligible_has_title
          expression: "dedup_eligible = false or title is not null"
      - dbt_utils.expression_is_true:
          name: fct_unlp_openalex_dedup_publication_eligible_has_type
          expression: "dedup_eligible = false or type_dedup is not null"
      - dbt_utils.expression_is_true:
          name: fct_unlp_openalex_dedup_publication_eligible_has_author
          expression: "dedup_eligible = false or author is not null"
      - dbt_utils.expression_is_true:
          name: fct_unlp_openalex_dedup_publication_eligible_has_year
          expression: "dedup_eligible = false or publication_year is not null"
