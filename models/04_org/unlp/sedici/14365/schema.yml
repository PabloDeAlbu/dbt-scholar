version: 2

models:
  - name: dim_unlp_seed_14365_input_type
    description: >
      Mapeo de tipologías crudas presentes en los seeds del caso `14365` hacia
      la tipología común usada por el deduplicador. En este caso operativo el
      espacio de salida se restringe a `LIBRO` y `TESIS`.
    config:
      tags: [unlp, sedici, "14365", trac, dedup]
    columns:
      - name: source_name
        description: Fuente semántica del seed dentro del caso (`seed_libros` o `seed_tesis`).
        data_tests:
          - not_null
          - accepted_values:
              values: ['seed_libros', 'seed_tesis']
      - name: type_raw
        description: Tipo o serie observado en el seed.
      - name: dedup_type
        description: Tipo documental común usado por el deduplicador.
        data_tests:
          - not_null
          - accepted_values:
              values: ['LIBRO', 'TESIS']
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source_name, type_raw]

  - name: dim_unlp_sedici_14365_input_type
    description: >
      Mapeo de `type_raw` observados en SEDICI hacia la tipología común usada
      por el deduplicador para el caso `14365`. Reutiliza
      `dim_unlp_sedici_item_type` y colapsa el espacio de salida a `LIBRO` y
      `TESIS`.
    config:
      tags: [unlp, sedici, "14365", trac, dedup]
    columns:
      - name: type_raw
        description: Tipo documental crudo observado en SEDICI.
        data_tests: [not_null, unique]
      - name: resource_type_uri
        description: URI COAR asociada cuando el tipo pudo vincularse al mapeo institucional.
      - name: item_type_group
        description: Grupo tipológico reducido proveniente de `dim_unlp_sedici_item_type`.
      - name: dedup_type
        description: Tipo documental común usado por el deduplicador cuando existe mapeo.
      - name: is_dedup_supported
        description: Flag que indica si el tipo crudo pudo mapearse a `LIBRO` o `TESIS`.
        data_tests: [not_null]

  - name: fct_unlp_seed_14365_libros_input1
    description: >
      Input 1 de la corrida `libros` del caso `14365`. Reexpresa el seed
      `libros_catedra_fda_koha_sedici_cruce_2026` bajo el esquema genérico del
      deduplicador, conservando una fila por registro candidato de Koha/FDA que
      cuenta con título, autor y año.
    config:
      tags: [unlp, sedici, "14365", trac, dedup]
    columns:
      - name: source
        description: Origen fijo del registro; en este modelo vale `koha_seed`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['koha_seed']
      - name: id
        description: Identificador técnico estable del registro candidato.
        data_tests: [not_null, unique]
      - name: publication_year
        description: Año de publicación extraído del campo `fecha` del seed.
        data_tests: [not_null]
      - name: type_raw
        description: Tipo crudo del seed, tomado de la columna `serie`.
      - name: title
        description: Título normalizado del candidato.
        data_tests: [not_null]
      - name: subtitle
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: type
        description: Tipo documental normalizado para el deduplicador.
        data_tests:
          - not_null
          - accepted_values:
              values: ['LIBRO']
      - name: author
        description: Autor principal normalizado del candidato.
        data_tests: [not_null]
      - name: date
        description: Año de publicación en formato `YYYY`.
        data_tests: [not_null]
      - name: doi
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: isbn
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: issn
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: description
        description: Campo no disponible en el seed; se devuelve `null`.
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_unlp_seed_14365_libros_input1_publication_year_range
          expression: "publication_year between 1500 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_seed_14365_libros_input1_date_format
          expression: "date ~ '^[0-9]{4}$'"
      - dbt_utils.expression_is_true:
          name: fct_unlp_seed_14365_libros_input1_date_matches_year
          expression: "publication_year::text = date"

  - name: fct_unlp_seed_14365_tesis_input1
    description: >
      Input 1 de la corrida `tesis` del caso `14365`. Reexpresa el seed
      `tesis_fda_koha_sedici_cruce_2026` bajo el esquema genérico del
      deduplicador, conservando una fila por registro candidato de Koha/FDA que
      cuenta con título, autor y año.
    config:
      tags: [unlp, sedici, "14365", trac, dedup]
    columns:
      - name: source
        description: Origen fijo del registro; en este modelo vale `koha_seed`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['koha_seed']
      - name: id
        description: Identificador técnico estable del registro candidato.
        data_tests: [not_null, unique]
      - name: publication_year
        description: Año de publicación extraído de `anio_titulo` o `anio_publicacion`.
        data_tests: [not_null]
      - name: type_raw
        description: Tipo crudo del seed, tomado de la columna `tipo_tesis`.
      - name: title
        description: Título normalizado del candidato.
        data_tests: [not_null]
      - name: subtitle
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: type
        description: Tipo documental normalizado para el deduplicador.
        data_tests:
          - not_null
          - accepted_values:
              values: ['TESIS']
      - name: author
        description: Autor principal normalizado del candidato.
        data_tests: [not_null]
      - name: date
        description: Año de publicación en formato `YYYY`.
        data_tests: [not_null]
      - name: doi
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: isbn
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: issn
        description: Campo no disponible en el seed; se devuelve `null`.
      - name: description
        description: Campo no disponible en el seed; se devuelve `null`.
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_unlp_seed_14365_tesis_input1_publication_year_range
          expression: "publication_year between 1500 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_seed_14365_tesis_input1_date_format
          expression: "date ~ '^[0-9]{4}$'"
      - dbt_utils.expression_is_true:
          name: fct_unlp_seed_14365_tesis_input1_date_matches_year
          expression: "publication_year::text = date"

  - name: fct_unlp_sedici_14365_libros_input2
    description: >
      Input 2 de la corrida `libros` del caso `14365`. Toma publicaciones
      SEDICI ya normalizadas para deduplicación, restringidas al conjunto
      tipológico mapeado como `LIBRO` y a los años presentes en
      `fct_unlp_seed_14365_libros_input1`.
    config:
      tags: [unlp, sedici, "14365", trac, dedup]
    columns:
      - name: source
        description: Origen fijo del registro; en este modelo vale `sedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sedici']
      - name: id
        description: Handle institucional del ítem SEDICI en formato `10915/...`.
        data_tests: [not_null, unique]
      - name: publication_year
        description: Año de publicación del ítem SEDICI.
        data_tests: [not_null]
      - name: type_raw
        description: Tipo documental crudo observado en SEDICI.
      - name: title
        description: Título normalizado del ítem SEDICI.
        data_tests: [not_null]
      - name: subtitle
        description: Subtítulo o títulos alternativos concatenados cuando existen.
      - name: type
        description: Tipo documental normalizado para el deduplicador.
        data_tests:
          - not_null
          - accepted_values:
              values: ['LIBRO']
      - name: author
        description: Lista de autores separada por `|`.
        data_tests: [not_null]
      - name: date
        description: Año de publicación en formato `YYYY`.
        data_tests: [not_null]
      - name: doi
        description: DOI normalizados del ítem cuando existen.
      - name: isbn
        description: ISBN distintos concatenados con `|` cuando existen.
      - name: issn
        description: ISSN distintos concatenados con `|` cuando existen.
      - name: description
        description: Descripción o resumen normalizados cuando existen.
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_14365_libros_input2_publication_year_range
          expression: "publication_year between 1500 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_14365_libros_input2_date_format
          expression: "date ~ '^[0-9]{4}$'"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_14365_libros_input2_date_matches_year
          expression: "publication_year::text = date"

  - name: fct_unlp_sedici_14365_tesis_input2
    description: >
      Input 2 de la corrida `tesis` del caso `14365`. Toma publicaciones SEDICI
      ya normalizadas para deduplicación, restringidas al conjunto tipológico
      mapeado como `TESIS` y a los años presentes en
      `fct_unlp_seed_14365_tesis_input1`.
    config:
      tags: [unlp, sedici, "14365", trac, dedup]
    columns:
      - name: source
        description: Origen fijo del registro; en este modelo vale `sedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sedici']
      - name: id
        description: Handle institucional del ítem SEDICI en formato `10915/...`.
        data_tests: [not_null, unique]
      - name: publication_year
        description: Año de publicación del ítem SEDICI.
        data_tests: [not_null]
      - name: type_raw
        description: Tipo documental crudo observado en SEDICI.
      - name: title
        description: Título normalizado del ítem SEDICI.
        data_tests: [not_null]
      - name: subtitle
        description: Subtítulo o títulos alternativos concatenados cuando existen.
      - name: type
        description: Tipo documental normalizado para el deduplicador.
        data_tests:
          - not_null
          - accepted_values:
              values: ['TESIS']
      - name: author
        description: Lista de autores separada por `|`.
        data_tests: [not_null]
      - name: date
        description: Año de publicación en formato `YYYY`.
        data_tests: [not_null]
      - name: doi
        description: DOI normalizados del ítem cuando existen.
      - name: isbn
        description: ISBN distintos concatenados con `|` cuando existen.
      - name: issn
        description: ISSN distintos concatenados con `|` cuando existen.
      - name: description
        description: Descripción o resumen normalizados cuando existen.
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_14365_tesis_input2_publication_year_range
          expression: "publication_year between 1500 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_14365_tesis_input2_date_format
          expression: "date ~ '^[0-9]{4}$'"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedici_14365_tesis_input2_date_matches_year
          expression: "publication_year::text = date"
