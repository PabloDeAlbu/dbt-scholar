version: 2

sources:
  - name: sedicidb
    description: Dump completo vigente de la base de datos DSpace 5 de SEDICI.
    schema: ldg_sedici
    tables:
      - name: item
      - name: handle
      - name: collection2item
      - name: collection
      - name: community
      - name: community2collection
      - name: community2community
      - name: metadatavalue
      - name: metadatafieldregistry
      - name: metadataschemaregistry

models:
  - name: fct_unlp_sedicidb_metadatafield_usage
    description: >
      Inventario vigente de metadatafields registrados en el dump SEDICI, a
      grano una fila por `metadata_field_id`. Incluye campos sin uso y métricas
      de cobertura, volumen y multivaluación sobre recursos de tipo ítem.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_metadata_usage_lang_counts_reconcile
          expression: "text_lang_value_count + missing_text_lang_value_count = metadata_value_count"
      - dbt_utils.expression_is_true:
          name: sedicidb_metadata_usage_lang_coverage_range
          expression: "text_lang_coverage_pct between 0 and 100"
    columns:
      - name: metadata_field_id
        description: Identificador del metadatafield en DSpace 5.
        data_tests: [not_null, unique]
      - name: metadatafield_fullname
        description: Nombre completo formado por schema, element y qualifier.
        data_tests: [not_null, unique]
      - name: item_count
        description: Cantidad de ítems con al menos una observación del campo.
        data_tests: [not_null]
      - name: metadata_value_count
        description: Cantidad total de observaciones del campo en ítems.
        data_tests: [not_null]
      - name: empty_metadata_value_count
        description: Cantidad de observaciones cuyo valor textual es nulo o vacío luego de aplicar `BTRIM`.
        data_tests: [not_null]
      - name: distinct_nonempty_text_value_count
        description: Cantidad de valores textuales no vacíos distintos en todo el repositorio.
        data_tests: [not_null]
      - name: multivalued_item_count
        description: Cantidad de ítems con más de un valor textual distinto y no vacío para el campo.
        data_tests: [not_null]
      - name: item_coverage_pct
        description: Porcentaje de ítems del dump que observan el metadatafield.
        data_tests: [not_null]
      - name: text_lang_value_count
        description: Cantidad de observaciones del metadatafield con `text_lang` no nulo ni vacío.
        data_tests: [not_null]
      - name: missing_text_lang_value_count
        description: Cantidad de observaciones del metadatafield sin `text_lang` informado.
        data_tests: [not_null]
      - name: text_lang_coverage_pct
        description: Porcentaje de observaciones del metadatafield que tienen `text_lang` informado.
        data_tests: [not_null]
      - name: distinct_text_lang_count
        description: Cantidad de idiomas distintos observados después de normalizar espacios y mayúsculas.
        data_tests: [not_null]
      - name: text_langs
        description: Idiomas observados, ordenados y unidos con `|`; por ejemplo `en|es|pt`.
      - name: text_lang_value_counts
        description: Conteo de observaciones por idioma en formato `idioma=cantidad`, unido con `|`.

  - name: dim_unlp_sedicidb_community
    description: >
      Dimensión vigente de comunidades SEDICI, a grano una fila por
      `community_id`. Resuelve el título preferido, la comunidad padre, la raíz
      y los caminos jerárquicos directamente desde el dump DSpace 5.
    columns:
      - name: community_id
        description: Identificador de la comunidad en DSpace 5.
        data_tests: [not_null, unique]
      - name: community_title
        description: Título `dc.title` preferido de la comunidad.
      - name: parent_community_id
        description: Identificador de la comunidad padre inmediata; es nulo para comunidades raíz.
      - name: parent_community_title
        description: Título preferido de la comunidad padre inmediata.
      - name: root_community_id
        description: Identificador de la comunidad raíz del camino.
        data_tests: [not_null]
      - name: root_community_title
        description: Título preferido de la comunidad raíz.
      - name: community_depth
        description: Distancia desde la comunidad hasta su raíz; vale cero para una raíz.
        data_tests: [not_null]
      - name: community_path_ids
        description: IDs ordenados desde la raíz hasta la comunidad, separados con ` > `.
        data_tests: [not_null]
      - name: community_path_titles
        description: Títulos ordenados desde la raíz hasta la comunidad, separados con ` > `.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_community_parent_not_self
          expression: "parent_community_id is null or parent_community_id <> community_id"
      - dbt_utils.expression_is_true:
          name: sedicidb_community_depth_nonnegative
          expression: "community_depth >= 0"
      - dbt_utils.expression_is_true:
          name: sedicidb_community_path_starts_at_root
          expression: >
            root_community_title is null
            or community_path_titles = root_community_title
            or community_path_titles like root_community_title || ' > %'

  - name: fct_unlp_sedicidb_item_publication
    description: >
      Inventario vigente de ítems del dump SEDICI, a grano una fila por
      `item_id`. Conserva los estados DSpace sin filtrarlos y agrega solamente
      métricas estructurales de handles, colecciones y metadatos. Los campos
      descriptivos se incorporarán gradualmente en modelos posteriores.
    columns:
      - name: item_id
        description: Identificador del ítem en DSpace 5.
        data_tests: [not_null, unique]
      - name: in_archive
        description: Estado `in_archive` vigente en el dump; puede ser nulo en registros fuente incompletos.
      - name: withdrawn
        description: Estado `withdrawn` vigente en el dump; puede ser nulo en registros fuente incompletos.
      - name: discoverable
        description: Estado `discoverable` vigente en el dump.
        data_tests: [not_null]
      - name: dc_date_issued_raw
        description: >
          Valor válido priorizado de `dc.date.issued`, conservando la precisión
          declarada en la fuente. Los valores inválidos no se seleccionan.
      - name: dc_date_issued
        description: >
          Fecha de publicación derivada de `dc.date.issued`; completa con día
          1 cuando la fuente informa solamente año o año-mes.
      - name: dc_date_issued_precision
        description: Precisión del valor seleccionado de `dc.date.issued`.
        data_tests:
          - accepted_values:
              values: ['day', 'month', 'year']
      - name: publication_year
        description: Año derivado de `dc_date_issued` para agrupaciones y gráficos.
      - name: dc_date_available_raw
        description: Valor válido priorizado de `dc.date.available`.
      - name: dc_date_available
        description: >
          Fecha en que el recurso quedó disponible en el repositorio según
          `dc.date.available`; no representa necesariamente su publicación.
      - name: handle_count
        description: Cantidad de handles distintos asociados al ítem.
        data_tests: [not_null]
      - name: collections_count
        description: Cantidad de colecciones distintas asociadas al ítem.
        data_tests: [not_null]
      - name: metadatafield_count
        description: Cantidad de metadatafields distintos observados en el ítem.
        data_tests: [not_null]
      - name: metadata_value_count
        description: Cantidad de observaciones de metadatos asociadas al ítem.
        data_tests: [not_null]
