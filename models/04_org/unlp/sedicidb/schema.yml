version: 2

sources:
  - name: sedicidb
    description: Dump completo vigente de la base de datos DSpace 5 de SEDICI.
    schema: ldg_sedici
    tables:
      - name: item
      - name: handle
      - name: collection2item
      - name: collection
      - name: community
      - name: community2collection
      - name: community2community
      - name: metadatavalue
      - name: metadatafieldregistry
      - name: metadataschemaregistry

models:
  - name: fct_unlp_sedicidb_metadatafield_usage
    description: >
      Inventario vigente de metadatafields registrados en el dump SEDICI, a
      grano una fila por `metadata_field_id`. Incluye campos sin uso y métricas
      de cobertura, volumen y multivaluación sobre recursos de tipo ítem.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_metadata_usage_lang_counts_reconcile
          expression: "text_lang_value_count + missing_text_lang_value_count = metadata_value_count"
      - dbt_utils.expression_is_true:
          name: sedicidb_metadata_usage_lang_coverage_range
          expression: "text_lang_coverage_pct between 0 and 100"
    columns:
      - name: metadata_field_id
        description: Identificador del metadatafield en DSpace 5.
        data_tests: [not_null, unique]
      - name: metadatafield_fullname
        description: Nombre completo formado por schema, element y qualifier.
        data_tests: [not_null, unique]
      - name: item_count
        description: Cantidad de ítems con al menos una observación del campo.
        data_tests: [not_null]
      - name: metadata_value_count
        description: Cantidad total de observaciones del campo en ítems.
        data_tests: [not_null]
      - name: empty_metadata_value_count
        description: Cantidad de observaciones cuyo valor textual es nulo o vacío luego de aplicar `BTRIM`.
        data_tests: [not_null]
      - name: distinct_nonempty_text_value_count
        description: Cantidad de valores textuales no vacíos distintos en todo el repositorio.
        data_tests: [not_null]
      - name: multivalued_item_count
        description: Cantidad de ítems con más de un valor textual distinto y no vacío para el campo.
        data_tests: [not_null]
      - name: item_coverage_pct
        description: Porcentaje de ítems del dump que observan el metadatafield.
        data_tests: [not_null]
      - name: text_lang_value_count
        description: Cantidad de observaciones del metadatafield con `text_lang` no nulo ni vacío.
        data_tests: [not_null]
      - name: missing_text_lang_value_count
        description: Cantidad de observaciones del metadatafield sin `text_lang` informado.
        data_tests: [not_null]
      - name: text_lang_coverage_pct
        description: Porcentaje de observaciones del metadatafield que tienen `text_lang` informado.
        data_tests: [not_null]
      - name: distinct_text_lang_count
        description: Cantidad de idiomas distintos observados después de normalizar espacios y mayúsculas.
        data_tests: [not_null]
      - name: text_langs
        description: Idiomas observados, ordenados y unidos con `|`; por ejemplo `en|es|pt`.
      - name: text_lang_value_counts
        description: Conteo de observaciones por idioma en formato `idioma=cantidad`, unido con `|`.

  - name: dim_unlp_sedicidb_community
    description: >
      Dimensión vigente de comunidades SEDICI, a grano una fila por
      `community_id`. Resuelve el título preferido, la comunidad padre, la raíz
      y los caminos jerárquicos directamente desde el dump DSpace 5.
    columns:
      - name: community_id
        description: Identificador de la comunidad en DSpace 5.
        data_tests: [not_null, unique]
      - name: community_title
        description: Título `dc.title` preferido de la comunidad.
      - name: parent_community_id
        description: Identificador de la comunidad padre inmediata; es nulo para comunidades raíz.
      - name: parent_community_title
        description: Título preferido de la comunidad padre inmediata.
      - name: root_community_id
        description: Identificador de la comunidad raíz del camino.
        data_tests: [not_null]
      - name: root_community_title
        description: Título preferido de la comunidad raíz.
      - name: community_depth
        description: Distancia desde la comunidad hasta su raíz; vale cero para una raíz.
        data_tests: [not_null]
      - name: community_path_ids
        description: IDs ordenados desde la raíz hasta la comunidad, separados con ` > `.
        data_tests: [not_null]
      - name: community_path_titles
        description: Títulos ordenados desde la raíz hasta la comunidad, separados con ` > `.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_community_parent_not_self
          expression: "parent_community_id is null or parent_community_id <> community_id"
      - dbt_utils.expression_is_true:
          name: sedicidb_community_depth_nonnegative
          expression: "community_depth >= 0"
      - dbt_utils.expression_is_true:
          name: sedicidb_community_path_starts_at_root
          expression: >
            root_community_title is null
            or community_path_titles = root_community_title
            or community_path_titles like root_community_title || ' > %'

  - name: dim_unlp_sedicidb_collection
    description: >
      Dimensión vigente de colecciones SEDICI, a grano una fila por
      `collection_id`. Resuelve el título preferido y todo el contexto de la
      comunidad contenedora para que los modelos de publicaciones no tengan que
      reconstruir la jerarquía.
    columns:
      - name: collection_id
        description: Identificador de la colección en DSpace 5.
        data_tests: [not_null, unique]
      - name: collection_title
        description: Título `dc.title` preferido de la colección.
      - name: community_id
        description: Comunidad que contiene directamente la colección.
        data_tests:
          - relationships:
              name: sedicidb_collection_community_in_community_dim
              to: ref('dim_unlp_sedicidb_community')
              field: community_id
      - name: community_title
        description: Título preferido de la comunidad inmediata.
      - name: root_community_id
        description: Comunidad raíz del camino de la colección.
      - name: root_community_title
        description: Título preferido de la comunidad raíz.
      - name: community_depth
        description: Distancia entre la comunidad inmediata y su raíz.
      - name: community_path_ids
        description: IDs desde la comunidad raíz hasta la inmediata, separados con ` > `.
      - name: community_path_titles
        description: Títulos desde la comunidad raíz hasta la inmediata, separados con ` > `.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_collection_path_starts_at_root
          expression: >
            root_community_title is null
            or community_path_titles = root_community_title
            or community_path_titles like root_community_title || ' > %'

  - name: brg_unlp_sedicidb_item_author
    description: >
      Relación atómica entre ítems y observaciones de autoría SEDICI. Conserva
      nombre, rol, posición, authority y confidence sin concatenar
      identificadores, a grano una fila por `metadata_value_id`.
    columns:
      - name: metadata_value_id
        description: Identificador de la observación original de metadatos.
        data_tests: [not_null, unique]
      - name: item_id
        description: Ítem relacionado con la observación de autoría.
        data_tests: [not_null]
      - name: author_bk
        description: >
          Identidad controlada basada en `authority_uri` o identidad nominal de
          respaldo basada en tipo y nombre normalizado.
        data_tests:
          - not_null
      - name: author_id
        description: MD5 determinístico de `author_bk`, usado como clave técnica compacta para relaciones e índices.
        data_tests:
          - not_null
          - relationships:
              name: sedicidb_item_author_id_in_author_dim
              to: ref('dim_unlp_sedicidb_author')
              field: author_id
      - name: author_role
        description: Rol específico derivado del metadatafield de origen.
        data_tests:
          - accepted_values:
              values: ['creator_person', 'creator_corporate', 'contributor_compiler']
      - name: author_type
        description: Tipo general de entidad autora.
        data_tests:
          - accepted_values:
              values: ['person', 'corporate']
      - name: author_name_raw
        description: Nombre exactamente como aparece en el dump.
      - name: author_name
        description: Nombre normalizado por el modelo específico del metadatafield.
        data_tests: [not_null]
      - name: authority_uri
        description: URI de autoridad asociada a la misma observación del nombre.
      - name: has_authority_control
        description: Indica que la observación posee una `authority_uri` no vacía.
        data_tests: [not_null]
      - name: confidence
        description: Código de confianza original, conservado sin interpretación.
      - name: author_place
        description: Posición original de la observación dentro del metadatafield.
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_item_author_control_matches_uri
          expression: "has_authority_control = (authority_uri is not null)"

  - name: dim_unlp_sedicidb_author
    description: >
      Dimensión vigente de autores observados en SEDICI. Prioriza la URI de
      autoridad como identidad; cuando no existe, mantiene una identidad nominal
      explícitamente no controlada.
    columns:
      - name: author_id
        description: MD5 determinístico de `author_bk`, usado como clave técnica compacta.
        data_tests: [not_null, unique]
      - name: author_bk
        description: Clave de negocio controlada o nominal de respaldo.
        data_tests: [not_null, unique]
      - name: author_name_preferred
        description: Variante cruda más observada para la identidad.
        data_tests: [not_null]
      - name: author_name_normalized
        description: Nombre normalizado correspondiente a la variante preferida.
        data_tests: [not_null]
      - name: author_type
        description: Tipo observado; puede valer `mixed` ante usos inconsistentes de una misma authority.
        data_tests:
          - accepted_values:
              values: ['person', 'corporate', 'mixed']
      - name: author_roles
        description: Roles distintos observados, unidos con `|`.
        data_tests: [not_null]
      - name: authority_uri
        description: URI canónica conservada para identidades controladas.
      - name: authority_host
        description: Host de la URI de autoridad.
      - name: authority_path
        description: Camino completo de la URI posterior al host.
      - name: has_authority_control
        description: Distingue identidades controladas de identidades nominales de respaldo.
        data_tests: [not_null]
      - name: min_confidence
        description: Menor código de confianza observado para la identidad.
      - name: max_confidence
        description: Mayor código de confianza observado para la identidad.
      - name: observation_count
        description: Cantidad de observaciones asociadas a la identidad.
        data_tests: [not_null]
      - name: item_count
        description: Cantidad de ítems distintos relacionados con la identidad.
        data_tests: [not_null]
      - name: observed_name_variant_count
        description: Cantidad de variantes crudas de nombre observadas.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_author_control_matches_uri
          expression: "has_authority_control = (authority_uri is not null)"

  - name: fct_unlp_sedicidb_item_publication
    description: >
      Inventario vigente de ítems del dump SEDICI, a grano una fila por
      `item_id`. Conserva los estados DSpace sin filtrarlos y resuelve los
      atributos singulares reutilizables de identificación, ubicación, tipo,
      título y fechas. Las relaciones multivaluadas y las métricas de calidad
      se modelan fuera de esta fact.
    columns:
      - name: item_id
        description: Identificador del ítem en DSpace 5.
        data_tests: [not_null, unique]
      - name: in_archive
        description: Estado `in_archive` vigente en el dump; puede ser nulo en registros fuente incompletos.
      - name: withdrawn
        description: Estado `withdrawn` vigente en el dump; puede ser nulo en registros fuente incompletos.
      - name: discoverable
        description: Estado `discoverable` vigente en el dump.
        data_tests: [not_null]
      - name: owning_collection
        description: Identificador de la colección dueña declarada por el ítem.
        data_tests:
          - relationships:
              name: sedicidb_item_owning_collection_in_collection_dim
              to: ref('dim_unlp_sedicidb_collection')
              field: collection_id
      - name: owning_collection_title
        description: Título preferido de la colección dueña.
      - name: owning_community_id
        description: Identificador de la comunidad que contiene la colección dueña.
      - name: owning_community_title
        description: Título preferido de la comunidad inmediata.
      - name: owning_root_community_id
        description: Identificador de la comunidad raíz del camino estructural.
      - name: owning_root_community_title
        description: Título preferido de la comunidad raíz.
      - name: owning_community_path_ids
        description: Camino de IDs de comunidades desde la raíz hasta la inmediata.
      - name: owning_community_path_titles
        description: Camino de títulos de comunidades desde la raíz hasta la inmediata.
      - name: dc_type
        description: Último valor no vacío de `dc.type`, según el mayor `metadata_value_id`.
      - name: sedici_subtype
        description: Último valor no vacío de `sedici.subtype`, según el mayor `metadata_value_id`.
      - name: dc_title_raw
        description: >
          Valor original de la observación vigente de `dc.title`, seleccionada
          por el mayor `metadata_value_id`.
      - name: dc_title
        description: >
          Título vigente normalizado por la capa `int`.
      - name: dc_date_issued_raw
        description: >
          Valor válido priorizado de `dc.date.issued`, conservando la precisión
          declarada en la fuente. Los valores inválidos no se seleccionan.
      - name: dc_date_issued
        description: >
          Fecha de publicación derivada de `dc.date.issued`; completa con día
          1 cuando la fuente informa solamente año o año-mes.
      - name: dc_date_issued_precision
        description: Precisión del valor seleccionado de `dc.date.issued`.
        data_tests:
          - accepted_values:
              values: ['day', 'month', 'year']
      - name: publication_year
        description: Año derivado de `dc_date_issued` para agrupaciones y gráficos.
      - name: dc_date_available_raw
        description: Valor válido priorizado de `dc.date.available`.
      - name: dc_date_available
        description: >
          Fecha en que el recurso quedó disponible en el repositorio según
          `dc.date.available`; no representa necesariamente su publicación.
      - name: sedici_date_exposure_raw
        description: Valor priorizado de `sedici.date.exposure` conservado como fue informado.
      - name: sedici_date_exposure
        description: Fecha de exposición derivada de `sedici.date.exposure`.
      - name: sedici_date_exposure_precision
        description: Precisión de la fecha de exposición seleccionada.
        data_tests:
          - accepted_values:
              values: ['day', 'month', 'year']
    data_tests:
      - dbt_utils.expression_is_true:
          name: sedicidb_item_publication_path_starts_at_root
          expression: >
            owning_root_community_title is null
            or owning_community_path_titles = owning_root_community_title
            or owning_community_path_titles like owning_root_community_title || ' > %'
      - dbt_utils.expression_is_true:
          name: sedicidb_published_item_has_subtype
          expression: >
            not (
              in_archive is true
              and withdrawn is false
              and discoverable is true
              and handle is not null
            )
            or sedici_subtype is not null
