version: 2

models:
  - name: fct_unlp_sedicidb_dedup_publication
    description: >
      Una fila por publicación de SEDICI preparada para utilizarse como entrada
      del deduplicador. Se construye a partir de
      `fct_unlp_sedicidb_item_publication` y conserva solamente los ítems que
      están archivados, no fueron retirados, son visibles en las búsquedas y
      tienen handle. Normaliza y agrupa los metadatos que necesita el
      deduplicador.
    columns:
      - name: source
        description: Origen fijo del registro; vale `sedici`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sedici']
      - name: id
        description: Handle institucional en formato `10915/...`.
        data_tests: [not_null, unique]
      - name: type
        description: >
          Tipo canónico consumible directamente por el deduplicador. Distingue
          `article`, `tesis`, `book`, `bookpart`, `objeto de conferencia` y
          `unknown` utilizando `dc.type` y `sedici.subtype`.
        data_tests:
          - not_null
          - accepted_values:
              values: ['article', 'tesis', 'book', 'bookpart', 'objeto de conferencia', 'unknown']
      - name: type_raw
        description: Último valor no vacío de `dc.type`, según el mayor `metadata_value_id`, conservado sin reducir al vocabulario del deduplicador.
      - name: subtype
        description: Último valor no vacío de `sedici.subtype`, según el mayor `metadata_value_id`.
      - name: date
        description: Fecha derivada de `dc.date.issued`, limitada al rango 1500–2100.
      - name: dc_date_available
        description: Fecha de disponibilidad en el repositorio.
      - name: title
        description: >
          Valores normalizados de `dc.title` y `dc.title.alternative`, unidos
          con `|` para que el deduplicador compare todas las variantes; excluye
          los valores raw.
        data_tests: [not_null]
      - name: subtitle
        description: Valores de `sedici.title.subtitle` unidos con `|`.
      - name: author
        description: >
          Autores normalizados provenientes del bridge institucional, unidos
          con `|`. Una misma identidad se incluye una sola vez aunque aparezca
          en más de un rol; excluye las variantes raw.
      - name: doi
        description: DOI extraídos y normalizados desde los campos de identificadores.
      - name: issn
        description: ISSN distintos unidos con `|`.
      - name: isbn
        description: ISBN distintos unidos con `|`.
      - name: subject
        description: Valores de `sedici.subject.materias` y `dc.subject` unidos con `|`.
      - name: owning_root_community_id
        description: ID de la comunidad raíz que contiene la colección dueña.
      - name: owning_root_community_title
        description: Título preferido de la comunidad raíz.
      - name: owning_community_path_titles
        description: Camino desde la comunidad raíz hasta la comunidad inmediata, separado con ` > `.
      - name: owning_community_id
        description: ID de la comunidad que contiene directamente la colección dueña.
      - name: owning_community_title
        description: Título preferido de la comunidad inmediata.
      - name: owning_collection
        description: ID de la colección dueña según la tabla `item`.
      - name: owning_collection_title
        description: Título preferido de la colección dueña.
      - name: publication_year
        description: Año derivado de `date`.
      - name: type_dedup
        description: Tipo reducido derivado del mapeo SEDICI a COAR.
      - name: description
        description: Abstracts y descripciones unidos con `|`.
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedicidb_dedup_publication_publication_year_range
          expression: "publication_year is null or publication_year between 1500 and 2100"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedicidb_dedup_publication_date_matches_year
          expression: "publication_year is null or date is null or publication_year = extract(year from date)::integer"
      - dbt_utils.expression_is_true:
          name: fct_unlp_sedicidb_dedup_publication_path_starts_at_root
          expression: >
            owning_root_community_title is null
            or owning_community_path_titles = owning_root_community_title
            or owning_community_path_titles like owning_root_community_title || ' > %'
