version: 2

models:
  # hub: crea identidad estable. La historia vive en satélites.
  - name: hub_dspacedb5__scope
    description: >
      Hub del servicio DSpace 5 observado. Su BK debe distinguir institución,
      etiqueta fuente y URL base.
    columns:
      - name: scope_hk
        description: Hash key del scope de integración.
        data_tests: [not_null, unique]
      - name: scope_bk
        description: Business key del scope de integración.
        data_tests: [not_null, unique]
      - name: load_datetime
        description: Fecha de carga observada para el primer alta del hub.
        data_tests: [not_null]
      - name: source
        description: Etiqueta de la fuente que originó el registro.
        data_tests: [not_null]

  - name: hub_dspacedb5_item
    description: >
      Hub de tabla `item` DSpace 5 contextualizada por scope.
    columns:
      - name: item_hk
        description: Hash key del item.
        data_tests: [not_null, unique]
      - name: item_bk
        description: Business key del item por scope.
        data_tests: [not_null, unique]
      - name: load_datetime
        description: Fecha de carga observada para el primer alta del hub.
