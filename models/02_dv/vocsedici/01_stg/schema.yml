version: 2

models:
  - name: stg_vocsedici_person
    description: >
      Personas recuperadas de VOC SEDICI y adaptadas para su posterior
      integración en hubs, links y satellites.
    columns:
      - name: person_node_id
        description: Identificador del nodo persona en VOC SEDICI.
        data_tests: [not_null, unique]
      - name: node_uuid
        description: UUID asignado al nodo por Drupal.
        data_tests: [not_null]
      - name: load_datetime
        description: Momento en que el registro se cargó en el data warehouse.
        data_tests: [not_null]

  - name: stg_vocsedici_institution
    description: >
      Instituciones recuperadas de VOC SEDICI y adaptadas para su posterior
      integración en hubs, links y satellites.
    columns:
      - name: institution_node_id
        description: Identificador del nodo institución en VOC SEDICI.
        data_tests: [not_null, unique]
      - name: node_uuid
        description: UUID asignado al nodo por Drupal.
        data_tests: [not_null]
      - name: load_datetime
        description: Momento en que el registro se cargó en el data warehouse.
        data_tests: [not_null]

  - name: stg_vocsedici_person_affiliation
    description: >
      Afiliaciones entre personas e instituciones recuperadas de VOC SEDICI y
      adaptadas para su posterior integración en links y satellites.
    columns:
      - name: paragraph_id
        description: Identificador del paragraph Drupal que representa la afiliación.
        data_tests: [not_null, unique]
      - name: person_node_id
        description: Identificador de la persona vinculada con la afiliación.
        data_tests: [not_null]
      - name: institution_node_id
        description: Identificador de la institución vinculada con la afiliación.
        data_tests: [not_null]
      - name: person_parent_node_id
        description: Persona indicada como padre del paragraph en Drupal.
      - name: person_field_node_id
        description: Persona indicada explícitamente en `field_persona_id`.
      - name: person_resolution_rule
        description: Regla utilizada para determinar la persona de la afiliación.
        data_tests: [not_null]
