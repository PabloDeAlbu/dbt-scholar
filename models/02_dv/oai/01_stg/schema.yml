version: 2

models:
  - name: stg_oai_repository_sets
    description: >
      Prepara las observaciones de sets OAI-PMH para su ingesta en Data Vault.
      Define una clave de negocio compuesta por el repositorio y `setSpec`, y
      conserva el contexto técnico e institucional de cada extracción.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [set_hk, extract_datetime]
    columns:
      - name: set_hk
        description: >
          Clave hash que identifica un set dentro del repositorio que lo
          expone.
        data_tests: [not_null]
      - name: repository_identifier
        description: >
          Identificador del repositorio OAI-PMH que expone el set.
        data_tests: [not_null]
      - name: set_id
        description: >
          Identificador `setSpec` informado por el repositorio.
        data_tests: [not_null]
      - name: set_name
        description: Nombre legible informado por `ListSets`.
      - name: institution_ror
        description: >
          Identificador ROR de la institución asociada con la extracción.
      - name: source
        description: >
          Clave de la fuente institucional desde la cual se obtuvo el set.
      - name: load_datetime
        description: Fecha y hora en que Kedro cargó el batch en landing.
        data_tests: [not_null]
      - name: effective_from
        description: Fecha y hora en que se extrajo el directorio de sets.
        data_tests: [not_null]

  - name: stg_oai_record__extract
    description: >
      Staging model de eventos de extracción de registros OAI. Construye `extract_cdk`
      como business key hasheada para identificar cada observación del registro en
      una extracción determinada y en un repositorio determinado.
    columns:
      - name: extract_cdk
        description: >
          Hash key del evento de extracción por registro, fecha de extracción y
          contexto de repositorio.
      - name: repository_identifier
        description: Identificador del repositorio propagado desde landing.
      - name: institution_ror
        description: ROR institucional propagado desde landing.
  - name: stg_oai_record_formats
    description: >
      Normaliza `dc:format` y calcula las claves hash del formato y de su
      relación con el registro OAI.
