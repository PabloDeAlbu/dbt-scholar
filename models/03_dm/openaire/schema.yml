version: 2

models:
  - name: latest_sat_openaire_researchproduct
    description: >
      Estado más reciente de `sat_openaire_researchproduct`, a grano `researchproduct_hk`.
      Sirve como base reusable para dimensiones y hechos de publicaciones OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_hk
        data_tests: [not_null, unique]
      - name: load_datetime
        data_tests: [not_null]

  - name: fct_openaire_researchproduct_extraction
    description: >
      Hecho base de eventos de extracción de OpenAIRE a nivel research product.
      Conserva el filtro aplicado y los timestamps técnicos disponibles del
      evento. En batches históricos, la fecha de extracción puede no haber
      sido informada; la fecha de carga conserva la trazabilidad de su ingreso
      al Data Warehouse sin sustituir ese dato ausente.
    config:
      tags: [dm]
    columns:
      - name: extract_cdk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: researchproduct_id
        data_tests: [not_null]
      - name: _filter_param
        data_tests: [not_null]
      - name: _filter_value
        data_tests: [not_null]
      - name: extract_datetime
        description: >
          Fecha y hora informada por el proceso de extracción. Puede ser nula
          en batches históricos que solo conservan la fecha de carga; no debe
          inferirse a partir de `load_datetime`.
      - name: load_datetime
        description: Fecha y hora de incorporación del batch al Data Warehouse.
        data_tests: [not_null]

  - name: dim_openaire_researchproduct
    description: Dimensión mínima de research products (ID canónico de OpenAIRE y su hash key).
    config:
      tags: [dm]
    columns:
      - name: researchproduct_hk
        description: Clave hash del research product (PK del hub).
        data_tests:
          - not_null
          - unique
      - name: researchproduct_id
        description: Identificador canónico de OpenAIRE para el research product.
        data_tests:
          - not_null
          - unique

  - name: dim_openaire_researchproduct_type
    description: >
      Dimensión del tipo principal de researchproduct según el vocabulario
      `dnet:result_typologies` de OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_type
        data_tests: [not_null, unique]
      - name: researchproduct_type_label
        data_tests: [not_null]
      - name: researchproduct_type_uri
        description: URI del término en el vocabulario de OpenAIRE, cuando aplica.

  - name: fct_openaire_researchproduct_publication
    description: >
      Representa el hecho de publicación de cada researchproduct de OpenAIRE.
      `publication` nombra el proceso y no restringe la tipología del researchproduct.
      Expone los atributos más recientes disponibles para cada researchproduct.
      Cada fila incorpora métricas y relaciones PID observadas.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: fact
        grain: researchproduct_hk
        temporal_scope: latest_attributes_and_observed_pid_relations
    columns:
      - name: researchproduct_hk
        description: Clave hash del research product (grano del hecho).
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_openaire_researchproduct')
              field: researchproduct_hk
      - name: researchproduct_id
        description: Identificador canónico de OpenAIRE.
        data_tests:
          - not_null
      - name: load_datetime
        description: Timestamp de carga del satélite (corte temporal del “estado actual”).
        data_tests: [not_null]
      - name: publication_date
        description: Fecha de publicación provista por OpenAIRE (si está disponible).
      - name: type
        description: >
          Tipo principal del researchproduct según `dnet:result_typologies`.
          Esta clasificación es independiente del proceso `publication` representado por el hecho.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_researchproduct_type')
              field: researchproduct_type
      - name: type_uri
        description: URI del término de tipo principal en el vocabulario de OpenAIRE.
      - name: best_access_right_uri
        description: URI de la mejor clasificación de derechos de acceso (si está disponible).

      - name: arxiv_count
        description: Cantidad de PIDs arXiv distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_arxiv
        description: Indica si se observó al menos un PID arXiv.
        data_tests: [not_null]
      - name: has_single_arxiv
        description: Indica si se observó exactamente un PID arXiv.
        data_tests: [not_null]

      - name: doi_count
        description: Cantidad de DOI distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_doi
        description: Indica si se observó al menos un DOI.
        data_tests: [not_null]
      - name: has_single_doi
        description: Indica si se observó exactamente un DOI.
        data_tests: [not_null]

      - name: handle_count
        description: Cantidad de PIDs Handle distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_handle
        description: Indica si se observó al menos un PID Handle.
        data_tests: [not_null]
      - name: has_single_handle
        description: Indica si se observó exactamente un PID Handle.
        data_tests: [not_null]

      - name: mag_count
        description: Cantidad de PIDs MAG distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_mag
        description: Indica si se observó al menos un PID MAG.
        data_tests: [not_null]
      - name: has_single_mag
        description: Indica si se observó exactamente un PID MAG.
        data_tests: [not_null]

      - name: pmb_count
        description: Cantidad de PIDs PMB distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_pmb
        description: Indica si se observó al menos un PID PMB.
        data_tests: [not_null]
      - name: has_single_pmb
        description: Indica si se observó exactamente un PID PMB.
        data_tests: [not_null]

      - name: pmc_count
        description: Cantidad de PIDs PMC distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_pmc
        description: Indica si se observó al menos un PID PMC.
        data_tests: [not_null]
      - name: has_single_pmc
        description: Indica si se observó exactamente un PID PMC.
        data_tests: [not_null]

      - name: pmid_count
        description: Cantidad de PIDs PMID distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_pmid
        description: Indica si se observó al menos un PID PMID.
        data_tests: [not_null]
      - name: has_single_pmid
        description: Indica si se observó exactamente un PID PMID.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_arxiv_flags_match_count
          expression: "has_arxiv = (arxiv_count > 0) and has_single_arxiv = (arxiv_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_doi_flags_match_count
          expression: "has_doi = (doi_count > 0) and has_single_doi = (doi_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_handle_flags_match_count
          expression: "has_handle = (handle_count > 0) and has_single_handle = (handle_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_mag_flags_match_count
          expression: "has_mag = (mag_count > 0) and has_single_mag = (mag_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_pmb_flags_match_count
          expression: "has_pmb = (pmb_count > 0) and has_single_pmb = (pmb_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_pmc_flags_match_count
          expression: "has_pmc = (pmc_count > 0) and has_single_pmc = (pmc_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_pmid_flags_match_count
          expression: "has_pmid = (pmid_count > 0) and has_single_pmid = (pmid_count = 1)"

  - name: dim_openaire_datasource
    description: Dimensión de datasource OpenAIRE (collectedFrom).
    config:
      tags: [dm]
    columns:
      - name: datasource_hk
        data_tests: [not_null, unique]
      - name: datasource_name
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_datasource
    description: Bridge research product–datasource (múltiples orígenes de recolección por publicación).
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, datasource_hk]
    columns:
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: datasource_hk
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_filter_applied
    description: >
      Bridge de filtros aplicados en la extracción (permite cohortes por ROR, openorgs y otros parámetros).
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, load_datetime, _filter_param, _filter_value]
    columns:
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: dim_openaire_pid
    description: Dimensión de identificadores persistentes (PIDs) de OpenAIRE (scheme + value).
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "scheme != 'doi' OR value ~* '^10\\\\.[0-9]{4,9}/\\\\S+$'"
    columns:
      - name: pid_hk
        data_tests: [not_null, unique]
      - name: scheme
        description: Esquema del PID (doi, handle, arXiv, pmid, etc.).
        data_tests: [not_null]
      - name: value
        description: Valor del PID según OpenAIRE.
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_pid
    description: Bridge research product–PID (relación N a N entre publicaciones e identificadores).
    config:
      tags: [dm]
    columns:
      - name: researchproduct_pid_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: pid_hk
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_doi
    description: >
      Relación entre research products y DOI registrados por OpenAIRE, a grano
      publicación y DOI normalizado. Conserva los valores originales para
      auditoría y evita que variantes técnicas dupliquen correspondencias.
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, doi]
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_doi_is_normalized
          expression: "doi = lower(doi) and doi ~ '^10[.][0-9]{4,9}/.+'"
      - dbt_utils.expression_is_true:
          expression: "observation_count >= 1"
    columns:
      - name: researchproduct_hk
        description: Clave hash del research product de OpenAIRE.
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_openaire_researchproduct_publication')
              field: researchproduct_hk
      - name: doi
        description: DOI normalizado en minúsculas, sin URL ni puntuación final.
        data_tests: [not_null]
      - name: doi_raw
        description: Valores DOI originales agrupados, separados por una barra vertical.
        data_tests: [not_null]
      - name: observation_count
        description: Cantidad de claves PID originales agrupadas en la relación normalizada.
        data_tests: [not_null]

  - name: dim_openaire_subject
    description: Dimensión de subjects (scheme/value) excluyendo keywords libres.
    config:
      tags: [dm]
    columns:
      - name: subject_hk
        data_tests: [not_null, unique]
      - name: subject_scheme
        data_tests: [not_null]
      - name: subject_value
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_subject
    description: Bridge research product–subject (temáticas declaradas y taxonomías).
    config:
      tags: [dm]
    columns:
      - name: researchproduct_subject_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: subject_hk
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_subject_sdg
    description: Bridge research product–SDG (subconjunto de subjects OpenAIRE con scheme `SDG`).
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, subject_hk]
    columns:
      - name: researchproduct_hk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_researchproduct')
              field: researchproduct_hk
      - name: researchproduct_id
        data_tests: [not_null]
      - name: subject_hk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_subject')
              field: subject_hk
      - name: subject_value
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_url
    description: >
      Relación entre entidades `researchproduct` de OpenAIRE y las URLs
      informadas por sus instancias. Conserva el valor de URL en el propio
      bridge porque no existen atributos adicionales que justifiquen una
      dimensión separada y una misma URL puede relacionarse con varios
      researchproducts.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: bridge
        grain: researchproduct_hk + url_hk
    columns:
      - name: researchproduct_url_hk
        description: Clave hash de la relación entre researchproduct y URL.
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        description: Clave hash de la entidad OpenAIRE `researchproduct`.
        data_tests: [not_null]
      - name: url_hk
        description: Clave hash del valor de URL.
        data_tests: [not_null]
      - name: url
        description: URL informada por una instancia del researchproduct.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, url_hk]

  - name: dim_openaire_alternateidentifier
    description: Dimensión de identificadores alternativos (scheme/value) con procedencia y timestamp de carga.
    config:
      tags: [dm]
    columns:
      - name: alternateidentifier_hk
        data_tests: [not_null, unique]
      - name: scheme
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_alternateidentifier
    description: Bridge research product–alternateidentifier (incluye fuente y timestamp de carga).
    config:
      tags: [dm]
    columns:
      - name: researchproduct_alternateidentifier_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: alternateidentifier_hk
        data_tests: [not_null]

  - name: dim_openaire_organization
    description: Dimensión de organizaciones (acronym/legalname) asociadas a research products.
    config:
      tags: [dm]
    columns:
      - name: organization_hk
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests: [not_null]
      - name: organization_ror
        description: Identificador ROR de la organización, cuando OpenAIRE lo expone como PID.
      - name: organization_name
        description: Nombre legible priorizado para consumo analítico.

  - name: brg_openaire_researchproduct_organization
    description: Bridge research product–organization.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_organization_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: organization_hk
        data_tests: [not_null]

  - name: dim_openaire_orcid
    description: Dimensión de ORCID asociados a research products.
    config:
      tags: [dm]
    columns:
      - name: orcid_hk
        data_tests: [not_null, unique]
      - name: orcid
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_orcid
    description: Bridge research product–ORCID.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_orcid_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: orcid_hk
        data_tests: [not_null]

  - name: dim_openaire_instance_type
    description: Dimensión de tipos de instancia (mapeo de type a instancetype).
    config:
      tags: [dm]
    columns:
      - name: instancetype_hk
        data_tests: [not_null, unique]
      - name: instance_type
        description: Tipo de instancia normalizado (según hub/mapeo).

  - name: brg_openaire_researchproduct_instances
    description: Bridge research product–instance type (tipos de instancias por publicación).
    config:
      tags: [dm]
    columns:
      - name: researchproduct_instances_type_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: instancetype_hk
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_originalid
    description: Bridge research product–originalid (identificadores de origen provistos por fuentes upstream).
    config:
      tags: [dm]
    columns:
      - name: researchproduct_originalid_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: original_hk
        data_tests: [not_null]
      - name: original_id
        description: Valor textual del identificador de origen provisto por OpenAIRE.
        data_tests: [not_null]
