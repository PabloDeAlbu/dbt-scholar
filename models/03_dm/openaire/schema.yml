version: 2

models:
  - name: latest_sat_openaire_researchproduct
    description: >
      Estado más reciente de `sat_openaire_researchproduct`, a grano `researchproduct_hk`.
      Sirve como base reutilizable para dimensiones y hechos de researchproducts de OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_hk
        data_tests: [not_null, unique]
      - name: load_datetime
        data_tests: [not_null]

  - name: fct_openaire_researchproduct_extraction
    description: >
      Hecho base de eventos de extracción de OpenAIRE a nivel researchproduct.
      Conserva el filtro aplicado y los timestamps técnicos disponibles del
      evento. En batches históricos, la fecha de extracción puede no haber
      sido informada; la fecha de carga conserva la trazabilidad de su ingreso
      al Data Warehouse sin sustituir ese dato ausente.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: fact
        grain: extract_cdk
        temporal_scope: extraction_events
    columns:
      - name: extract_cdk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: researchproduct_id
        data_tests: [not_null]
      - name: _filter_param
        data_tests: [not_null]
      - name: _filter_value
        data_tests: [not_null]
      - name: extract_datetime
        description: >
          Fecha y hora informada por el proceso de extracción. Puede ser nula
          en batches históricos que solo conservan la fecha de carga; no debe
          inferirse a partir de `load_datetime`.
      - name: load_datetime
        description: Fecha y hora de incorporación del batch al Data Warehouse.
        data_tests: [not_null]

  - name: dim_openaire_researchproduct
    description: Dimensión mínima de researchproducts identificados por OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_hk
        description: Clave hash del researchproduct.
        data_tests:
          - not_null
          - unique
      - name: researchproduct_id
        description: Identificador canónico de OpenAIRE para el researchproduct.
        data_tests:
          - not_null
          - unique

  - name: dim_openaire_researchproduct_type
    description: >
      Dimensión del tipo principal de researchproduct según el vocabulario
      `dnet:result_typologies` de OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_type
        data_tests: [not_null, unique]
      - name: researchproduct_type_label
        data_tests: [not_null]
      - name: researchproduct_type_uri
        description: URI del término en el vocabulario de OpenAIRE, cuando aplica.

  - name: fct_openaire_researchproduct_publication
    description: >
      Representa el hecho de publicación de cada researchproduct de OpenAIRE.
      `publication` nombra el proceso y no restringe la tipología del researchproduct.
      Expone los atributos más recientes disponibles para cada researchproduct.
      Cada fila incorpora métricas y relaciones PID observadas.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: fact
        grain: researchproduct_hk
        temporal_scope: latest_attributes_and_observed_pid_relations
    columns:
      - name: researchproduct_hk
        description: Clave hash del researchproduct y grano del hecho.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_openaire_researchproduct')
              field: researchproduct_hk
      - name: researchproduct_id
        description: Identificador canónico de OpenAIRE.
        data_tests:
          - not_null
      - name: load_datetime
        description: Timestamp de carga del satélite (corte temporal del “estado actual”).
        data_tests: [not_null]
      - name: publication_date
        description: Fecha de publicación provista por OpenAIRE (si está disponible).
      - name: type
        description: >
          Tipo principal del researchproduct según `dnet:result_typologies`.
          Esta clasificación es independiente del proceso `publication` representado por el hecho.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_researchproduct_type')
              field: researchproduct_type
      - name: type_uri
        description: URI del término de tipo principal en el vocabulario de OpenAIRE.
      - name: best_access_right_uri
        description: URI de la mejor clasificación de derechos de acceso (si está disponible).

      - name: arxiv_count
        description: Cantidad de PIDs arXiv distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_arxiv
        description: Indica si se observó al menos un PID arXiv.
        data_tests: [not_null]
      - name: has_single_arxiv
        description: Indica si se observó exactamente un PID arXiv.
        data_tests: [not_null]

      - name: doi_count
        description: Cantidad de DOI normalizados distintos relacionados con el researchproduct.
        data_tests: [not_null]
      - name: has_doi
        description: Indica si el researchproduct se relaciona con al menos un DOI normalizado.
        data_tests: [not_null]
      - name: has_single_doi
        description: Indica si el researchproduct se relaciona con exactamente un DOI normalizado.
        data_tests: [not_null]

      - name: handle_count
        description: Cantidad de PIDs Handle distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_handle
        description: Indica si se observó al menos un PID Handle.
        data_tests: [not_null]
      - name: has_single_handle
        description: Indica si se observó exactamente un PID Handle.
        data_tests: [not_null]

      - name: mag_count
        description: Cantidad de PIDs MAG distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_mag
        description: Indica si se observó al menos un PID MAG.
        data_tests: [not_null]
      - name: has_single_mag
        description: Indica si se observó exactamente un PID MAG.
        data_tests: [not_null]

      - name: pmb_count
        description: Cantidad de PIDs PMB distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_pmb
        description: Indica si se observó al menos un PID PMB.
        data_tests: [not_null]
      - name: has_single_pmb
        description: Indica si se observó exactamente un PID PMB.
        data_tests: [not_null]

      - name: pmc_count
        description: Cantidad de PIDs PMC distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_pmc
        description: Indica si se observó al menos un PID PMC.
        data_tests: [not_null]
      - name: has_single_pmc
        description: Indica si se observó exactamente un PID PMC.
        data_tests: [not_null]

      - name: pmid_count
        description: Cantidad de PIDs PMID distintos observados para el researchproduct.
        data_tests: [not_null]
      - name: has_pmid
        description: Indica si se observó al menos un PID PMID.
        data_tests: [not_null]
      - name: has_single_pmid
        description: Indica si se observó exactamente un PID PMID.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_arxiv_flags_match_count
          expression: "has_arxiv = (arxiv_count > 0) and has_single_arxiv = (arxiv_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_doi_flags_match_count
          expression: "has_doi = (doi_count > 0) and has_single_doi = (doi_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_handle_flags_match_count
          expression: "has_handle = (handle_count > 0) and has_single_handle = (handle_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_mag_flags_match_count
          expression: "has_mag = (mag_count > 0) and has_single_mag = (mag_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_pmb_flags_match_count
          expression: "has_pmb = (pmb_count > 0) and has_single_pmb = (pmb_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_pmc_flags_match_count
          expression: "has_pmc = (pmc_count > 0) and has_single_pmc = (pmc_count = 1)"
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_pmid_flags_match_count
          expression: "has_pmid = (pmid_count > 0) and has_single_pmid = (pmid_count = 1)"

  - name: dim_openaire_datasource
    description: Dimensión de datasource OpenAIRE (collectedFrom).
    config:
      tags: [dm]
    columns:
      - name: datasource_hk
        data_tests: [not_null, unique]
      - name: datasource_name
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_datasource
    description: Relación entre cada researchproduct y los datasources que participaron en su recolección.
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, datasource_hk]
    columns:
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: datasource_hk
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_filter_applied
    description: >
      Observaciones históricas de los filtros aplicados al extraer cada researchproduct.
      Se origina en el satélite histórico de filtros y no sustituye al hecho de extracción.
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, load_datetime, _filter_param, _filter_value]
    columns:
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: dim_openaire_pid
    description: Dimensión de identificadores persistentes (PIDs) de OpenAIRE (scheme + value).
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "LOWER(scheme) != 'doi' OR value ~* '^10[.][0-9]{4,9}/[^[:space:]]+$'"
    columns:
      - name: pid_hk
        data_tests: [not_null, unique]
      - name: scheme
        description: Esquema del PID (doi, handle, arXiv, pmid, etc.).
        data_tests: [not_null]
      - name: value
        description: Valor del PID según OpenAIRE.
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_pid
    description: Relación entre researchproducts y los PIDs registrados por OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_pid_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: pid_hk
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_doi
    description: >
      Relación entre researchproducts y DOI registrados por OpenAIRE.
      Cada fila corresponde a un researchproduct y un DOI normalizado.
      Conserva los valores originales agrupados para auditar variantes técnicas.
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, doi]
      - dbt_utils.expression_is_true:
          name: openaire_researchproduct_doi_is_normalized
          expression: "doi = lower(doi) and doi ~ '^10[.][0-9]{4,9}/.+'"
      - dbt_utils.expression_is_true:
          expression: "observation_count >= 1"
    columns:
      - name: researchproduct_hk
        description: Clave hash del researchproduct de OpenAIRE.
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_openaire_researchproduct_publication')
              field: researchproduct_hk
      - name: doi
        description: DOI normalizado en minúsculas, sin URL ni puntuación final.
        data_tests: [not_null]
      - name: doi_raw
        description: Valores DOI originales agrupados, separados por una barra vertical.
        data_tests: [not_null]
      - name: observation_count
        description: Cantidad de claves PID originales agrupadas en la relación normalizada.
        data_tests: [not_null]

  - name: dim_openaire_subject
    description: Dimensión de subjects registrados por OpenAIRE, excluyendo los de esquema `keyword`.
    config:
      tags: [dm]
    columns:
      - name: subject_hk
        data_tests: [not_null, unique]
      - name: subject_scheme
        data_tests: [not_null]
      - name: subject_value
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_subject
    description: Relación entre researchproducts y subjects registrados por OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_subject_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: subject_hk
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_subject_sdg
    description: Relación entre researchproducts y el subconjunto de subjects cuyo esquema es `SDG`.
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, subject_hk]
    columns:
      - name: researchproduct_hk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_researchproduct')
              field: researchproduct_hk
      - name: researchproduct_id
        data_tests: [not_null]
      - name: subject_hk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_subject')
              field: subject_hk
      - name: subject_value
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_url
    description: >
      Relación entre researchproducts de OpenAIRE y las URLs
      informadas por sus instancias. Conserva el valor de URL en el propio
      bridge porque no existen atributos adicionales que justifiquen una
      dimensión separada y una misma URL puede relacionarse con varios
      researchproducts.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: bridge
        grain: researchproduct_hk + url_hk
    columns:
      - name: researchproduct_url_hk
        description: Clave hash de la relación entre researchproduct y URL.
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        description: Clave hash de la entidad OpenAIRE `researchproduct`.
        data_tests: [not_null]
      - name: url_hk
        description: Clave hash del valor de URL.
        data_tests: [not_null]
      - name: url
        description: URL informada por una instancia del researchproduct.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, url_hk]

  - name: brg_openaire_researchproduct_alternateidentifier
    description: >
      Relación entre researchproducts e identificadores alternativos registrados por OpenAIRE.
      Expone el esquema y el valor porque el identificador no aporta otros atributos que requieran una dimensión separada.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: bridge
        grain: researchproduct_hk + alternateidentifier_hk
    columns:
      - name: researchproduct_alternateidentifier_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: alternateidentifier_hk
        data_tests: [not_null]
      - name: scheme
        description: Esquema informado por OpenAIRE para interpretar el identificador alternativo.
        data_tests: [not_null]
      - name: value
        description: Valor del identificador alternativo informado por OpenAIRE.
        data_tests: [not_null]
      - name: source
        description: Fuente técnica que registró la relación.
        data_tests: [not_null]
      - name: load_datetime
        description: Fecha y hora de incorporación de la relación al Data Warehouse.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, alternateidentifier_hk]

  - name: dim_openaire_organization
    description: >
      Dimensión de organizaciones asociadas con researchproducts de OpenAIRE.
      Los identificadores se conservan por separado en `brg_openaire_organization_pid`.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: dimension
        grain: organization_hk
    columns:
      - name: organization_hk
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests: [not_null]
      - name: organization_name
        description: Nombre legible informado por OpenAIRE, priorizando la denominación legal y luego el acrónimo.

  - name: brg_openaire_organization_pid
    description: Relación entre organizaciones y los PIDs registrados por OpenAIRE.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: bridge
        grain: organization_hk + pid_hk
    columns:
      - name: organization_pid_hk
        description: Clave hash de la relación entre organización y PID.
        data_tests: [not_null, unique]
      - name: organization_hk
        description: Clave hash de la organización.
        data_tests: [not_null]
      - name: pid_hk
        description: Clave hash del PID relacionado.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_pid')
              field: pid_hk
      - name: scheme
        description: Esquema del PID informado por OpenAIRE.
        data_tests: [not_null]
      - name: value
        description: Valor del PID informado por OpenAIRE.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [organization_hk, pid_hk]

  - name: brg_openaire_researchproduct_organization
    description: Relación entre researchproducts y organizaciones registrada por OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_organization_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: organization_hk
        data_tests: [not_null]

  - name: dim_openaire_orcid
    description: Dimensión de identificadores ORCID asociados con researchproducts de OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: orcid_hk
        data_tests: [not_null, unique]
      - name: orcid
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_orcid
    description: >
      Relación entre researchproducts e identificadores ORCID registrada por OpenAIRE.
      La relación no determina por sí misma una autoría ni un rol de contribución.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_orcid_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: orcid_hk
        data_tests: [not_null]

  - name: dim_openaire_researchproduct_instance_type
    description: Dimensión de tipos de instancia de researchproduct observados por OpenAIRE.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: dimension
        grain: researchproduct_instance_type_hk
    columns:
      - name: researchproduct_instance_type_hk
        description: Clave hash del tipo de instancia de researchproduct.
        data_tests: [not_null, unique]
      - name: researchproduct_instance_type
        description: Tipo de instancia de researchproduct informado por OpenAIRE.
        data_tests: [not_null]

  - name: brg_openaire_researchproduct_instance_type
    description: Relación entre researchproducts y los tipos de sus instancias en OpenAIRE.
    config:
      tags: [dm]
      meta:
        source_system: openaire
        model_role: bridge
        grain: researchproduct_hk + researchproduct_instance_type_hk
    columns:
      - name: researchproduct_instance_type_relationship_hk
        description: Clave hash de la relación entre researchproduct y tipo de instancia.
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        description: Clave hash del researchproduct.
        data_tests: [not_null]
      - name: researchproduct_instance_type_hk
        description: Clave hash del tipo de instancia relacionado.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openaire_researchproduct_instance_type')
              field: researchproduct_instance_type_hk
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [researchproduct_hk, researchproduct_instance_type_hk]

  - name: brg_openaire_researchproduct_originalid
    description: Relación entre researchproducts y los identificadores informados por fuentes upstream de OpenAIRE.
    config:
      tags: [dm]
    columns:
      - name: researchproduct_originalid_hk
        data_tests: [not_null, unique]
      - name: researchproduct_hk
        data_tests: [not_null]
      - name: original_hk
        data_tests: [not_null]
      - name: original_id
        description: Valor textual del identificador de origen provisto por OpenAIRE.
        data_tests: [not_null]
