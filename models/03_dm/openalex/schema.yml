version: 2

models:
  - name: latest_sat_openalex_work
    description: >
      Estado más reciente de `sat_openalex_work`, a grano `work_hk`. Centraliza la
      resolución latest para reutilización en dimensiones y facts de works.
    config:
      tags: [dm]
    columns:
      - name: work_hk
        data_tests: [not_null, unique]
      - name: load_datetime
        data_tests: [not_null]

  - name: fct_openalex_work_extraction
    description: >
      Hecho base de eventos de extracción de OpenAlex a nivel work. Conserva el
      filtro aplicado y los timestamps técnicos del evento para reutilización en
      capas analíticas y operativas. Cuando el filtro corresponde a
      `institutions.ror`, expone además el label institucional asociado.
    config:
      tags: [dm]
    columns:
      - name: extract_cdk
        data_tests: [not_null, unique]
      - name: work_hk
        data_tests: [not_null]
      - name: work_id
        data_tests: [not_null]
      - name: _filter_param
        description: Parámetro de filtro utilizado en la extracción.
      - name: _filter_value
        description: Valor del filtro utilizado en la extracción.
      - name: institution_hk
        description: Clave hash de la institución cuando el ROR del filtro identifica una única institución de OpenAlex.
      - name: institution_id
        description: Identificador de la institución cuando el ROR del filtro permite resolverla sin ambigüedad.
      - name: _filter_value_label
        description: >
          Label descriptivo del valor de filtro cuando `_filter_param =
          institutions.ror` identifica una única institución de OpenAlex.
      - name: extract_datetime
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: brg_openalex_author_orcid
    description: >
      Relación entre autores y ORCID conservada por OpenAlex.
      Expone el valor original y una representación sin la URL de ORCID.
    config:
      tags: [dm]
      meta:
        source_system: openalex
        model_role: bridge
        grain: author_hk + orcid_hk
    columns:
      - name: author_orcid_hk
        data_tests: [not_null, unique]
      - name: author_hk
        data_tests: [not_null]
      - name: orcid_hk
        data_tests: [not_null]
      - name: orcid_raw
        description: Valor de ORCID conservado por el Hub de OpenAlex.
        data_tests: [not_null]
      - name: orcid
        description: ORCID sin el prefijo `https://orcid.org/`.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [author_hk, orcid_hk]

  - name: dim_openalex_author
    description: >
      Dimensión de autores de OpenAlex con sus atributos descriptivos.
      Expone un ORCID escalar solamente cuando el autor se relaciona con un único ORCID.
    config:
      tags: [dm]
    columns:
      - name: author_id
        description: Identificador canónico de OpenAlex para el autor.
        data_tests:
          - not_null
          - unique
      - name: author_hk
        description: Clave hash del autor (PK del hub).
        data_tests:
          - not_null
          - unique
      - name: display_name
        description: Nombre de despliegue del autor.
      - name: works_count
        description: Cantidad de obras asociadas al autor (según OpenAlex).
      - name: cited_by_count
        description: Total de citas recibidas por el autor (según OpenAlex).
      - name: orcid
        description: ORCID cuando la relación es unívoca o `-` cuando no existe o es ambigua.
      - name: orcid_count
        description: Cantidad de ORCID distintos relacionados con el autor.
        data_tests: [not_null]
      - name: has_orcid
        description: Indica si el autor se relaciona con al menos un ORCID.
        data_tests: [not_null]
      - name: has_single_orcid
        description: Indica si el autor se relaciona con exactamente un ORCID.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "has_orcid = (orcid_count > 0) and has_single_orcid = (orcid_count = 1) and has_single_orcid = (orcid <> '-')"

  - name: brg_openalex_institution_ror
    description: Relación entre instituciones y ROR conservada por OpenAlex.
    config:
      tags: [dm]
      meta:
        source_system: openalex
        model_role: bridge
        grain: institution_hk + ror_hk
    columns:
      - name: institution_ror_hk
        data_tests: [not_null, unique]
      - name: institution_hk
        data_tests: [not_null]
      - name: ror_hk
        data_tests: [not_null]
      - name: ror
        description: Identificador ROR relacionado con la institución.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [institution_hk, ror_hk]

  - name: dim_openalex_institution
    description: >
      Dimensión de instituciones de OpenAlex con sus atributos descriptivos.
      Expone un ROR escalar solamente cuando la institución se relaciona con un único ROR.
    config:
      tags: [dm]
    columns:
      - name: institution_hk
        description: Clave hash de la institución (PK del hub).
        data_tests: [not_null, unique]
      - name: institution_id
        description: Identificador canónico de OpenAlex para la institución.
        data_tests: [not_null, unique]
      - name: institution_display_name
        description: Nombre de la institución informado por OpenAlex sin sustituirlo por un identificador.
      - name: country_code
        description: Código de país informado por OpenAlex o `-` cuando no está disponible.
      - name: ror
        description: Identificador ROR cuando la relación es unívoca o `-` cuando no existe o es ambigua.
      - name: ror_count
        description: Cantidad de ROR distintos relacionados con la institución.
        data_tests: [not_null]
      - name: has_ror
        description: Indica si la institución se relaciona con al menos un ROR.
        data_tests: [not_null]
      - name: has_single_ror
        description: Indica si la institución se relaciona con exactamente un ROR y `ror` puede exponerse sin ambigüedad.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "ror = '-' OR trim(ror) ~ '^https?://ror[.]org/[0-9a-z]{9}/?$'"
      - dbt_utils.expression_is_true:
          expression: "has_ror = (ror_count > 0) and has_single_ror = (ror_count = 1) and has_single_ror = (ror <> '-')"

  - name: dim_openalex_topic
    description: Dimensión de tópicos OpenAlex (display_name + jerarquías domain/field/subfield).
    config:
      tags: [dm]
    columns:
      - name: topic_hk
        description: Clave hash del tópico (PK del hub).
        data_tests: [not_null, unique]
      - name: topic_id
        description: Identificador canónico de OpenAlex para el tópico.
        data_tests: [not_null, unique]
      - name: display_name
        description: Etiqueta del tópico.

  - name: dim_openalex_work_type
    description: >
      Dimensión de tipos de work de OpenAlex según el vocabulario oficial de
      `work types`, con mapeo a COAR cuando está disponible.
    config:
      tags: [dm]
    columns:
      - name: work_type
        description: Valor canónico del tipo de work en OpenAlex.
        data_tests: [not_null, unique]
      - name: work_type_label
        description: Etiqueta textual del tipo según OpenAlex.
        data_tests: [not_null]
      - name: resource_type_uri
        description: URI COAR asociada al tipo de work cuando existe mapeo.

  - name: brg_openalex_work_doi
    description: >
      Relación entre works y DOI historizados por OpenAlex, a grano una fila
      por vínculo. Conserva el valor original del Hub y ofrece una versión
      normalizada para correspondencias exactas con otras fuentes.
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_hk, doi_hk]
      - dbt_utils.expression_is_true:
          name: openalex_work_doi_is_normalized
          expression: "doi = lower(doi) and doi ~ '^10[.][0-9]{4,9}/.+'"
    columns:
      - name: work_doi_hk
        description: Clave hash del vínculo entre el work y el DOI.
        data_tests: [not_null, unique]
      - name: work_hk
        description: Clave hash del work de OpenAlex.
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_openalex_work_publication')
              field: work_hk
      - name: doi_hk
        description: Clave hash del DOI de OpenAlex.
        data_tests:
          - not_null
          - relationships:
              to: ref('hub_openalex_doi')
              field: doi_hk
      - name: doi_raw
        description: DOI conservado por el Hub de OpenAlex, normalmente como URL.
        data_tests: [not_null]
      - name: doi
        description: DOI normalizado en minúsculas, sin URL ni puntuación final.
        data_tests: [not_null]

  - name: brg_openalex_work_pid
    description: >
      Relación entre works y PIDs conservada por OpenAlex.
      Unifica DOI, MAG, PMCID y PMID sin reducir las relaciones multivaluadas a una sola fila por work.
    config:
      tags: [dm]
      meta:
        source_system: openalex
        model_role: bridge
        grain: work_hk + pid_scheme + pid_hk
    columns:
      - name: work_pid_hk
        description: Clave hash de la relación en el Data Vault de origen.
        data_tests: [not_null]
      - name: work_hk
        description: Clave hash del work de OpenAlex.
        data_tests: [not_null]
      - name: pid_hk
        description: Clave hash del identificador dentro de su esquema de origen.
        data_tests: [not_null]
      - name: pid_scheme
        description: >
          Esquema del identificador: `doi`, `mag`, `pmcid` o `pmid`.
        data_tests:
          - not_null
          - accepted_values:
              values: [doi, mag, pmcid, pmid]
      - name: pid_raw_value
        description: Valor conservado por el Hub correspondiente.
        data_tests: [not_null]
      - name: pid_value
        description: Valor utilizado para comparar identificadores dentro de su esquema.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_hk, pid_scheme, pid_hk]

  - name: dim_openalex_work_pid
    description: >
      Perfil de PIDs por work OpenAlex, con identificadores normalizados y flags
      de presencia para cada esquema soportado.
    config:
      tags: [dm]
    columns:
      - name: work_hk
        description: Clave hash de la obra (PK del hub).
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('hub_openalex_work')
              field: work_hk
      - name: doi
        description: DOI normalizado cuando es unívoco o `-` cuando no existe o es ambiguo.
      - name: doi_count
        description: Cantidad de DOI normalizados distintos relacionados con el work.
        data_tests: [not_null]
      - name: has_doi
        description: Indica si el work se relaciona con al menos un DOI.
        data_tests: [not_null]
      - name: has_single_doi
        description: Indica si el work se relaciona con exactamente un DOI normalizado.
        data_tests: [not_null]
      - name: mag
        description: Identificador MAG cuando es unívoco o `-` cuando no existe o es ambiguo.
      - name: mag_count
        description: Cantidad de identificadores MAG distintos relacionados con el work.
        data_tests: [not_null]
      - name: has_mag
        description: Indica si el work se relaciona con al menos un identificador MAG.
        data_tests: [not_null]
      - name: has_single_mag
        description: Indica si el work se relaciona con exactamente un identificador MAG.
        data_tests: [not_null]
      - name: pmcid
        description: PMCID cuando es unívoco o `-` cuando no existe o es ambiguo.
      - name: pmcid_count
        description: Cantidad de PMCID distintos relacionados con el work.
        data_tests: [not_null]
      - name: has_pmcid
        description: Indica si el work se relaciona con al menos un PMCID.
        data_tests: [not_null]
      - name: has_single_pmcid
        description: Indica si el work se relaciona con exactamente un PMCID.
        data_tests: [not_null]
      - name: pmid
        description: PMID cuando es unívoco o `-` cuando no existe o es ambiguo.
      - name: pmid_count
        description: Cantidad de PMID distintos relacionados con el work.
        data_tests: [not_null]
      - name: has_pmid
        description: Indica si el work se relaciona con al menos un PMID.
        data_tests: [not_null]
      - name: has_single_pmid
        description: Indica si el work se relaciona con exactamente un PMID.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: 'doi = ''-'' OR doi ~* ''^10\.[0-9]{4,9}/.+$'''
      - dbt_utils.expression_is_true:
          expression: "has_doi = (doi_count > 0) and has_single_doi = (doi_count = 1) and has_single_doi = (doi <> '-')"
      - dbt_utils.expression_is_true:
          expression: "has_mag = (mag_count > 0) and has_single_mag = (mag_count = 1) and has_single_mag = (mag <> '-')"
      - dbt_utils.expression_is_true:
          expression: "has_pmcid = (pmcid_count > 0) and has_single_pmcid = (pmcid_count = 1) and has_single_pmcid = (pmcid <> '-')"
      - dbt_utils.expression_is_true:
          expression: "has_pmid = (pmid_count > 0) and has_single_pmid = (pmid_count = 1) and has_single_pmid = (pmid <> '-')"

  - name: fct_openalex_work_publication
    description: >
      Hecho canónico de works OpenAlex a grano `work_hk`, con metadatos
      bibliográficos del work, señales OA, campos biblio y métricas agregadas
      (citas, FWCI, percentiles y costos APC cuando aplica).
    config:
      tags: [dm]
    columns:
      - name: work_id
        description: Identificador canónico de OpenAlex para la obra.
        data_tests:
          - not_null
          - unique
      - name: work_hk
        description: Clave hash de la obra (PK del hub).
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('hub_openalex_work')
              field: work_hk
      - name: source_display_name
        description: Source principal tomado de `primary_location.source.display_name`.
      - name: issn
        description: ISSN-L del source principal tomado de `primary_location.source.issn_l`.
      - name: pages
        description: Páginas del work derivadas de `biblio.first_page` y `biblio.last_page`.
      - name: language
        description: Idioma informado por OpenAlex para el work.
      - name: type
        description: Tipo principal del work según el vocabulario oficial de OpenAlex.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_openalex_work_type')
              field: work_type
      - name: type_coar_uri
        description: URI COAR mapeada desde el tipo de work cuando está disponible.
      - name: license
        description: Licencia tomada de `primary_location.license`.
      - name: topics
        description: Topics OpenAlex agregados para el work y concatenados con `|`.
      - name: authors
        description: Autores OpenAlex agregados para el work y concatenados con `|`.
      - name: doi
        description: DOI normalizado del work cuando es unívoco o `null` si no existe o es ambiguo.
      - name: doi_count
        description: Cantidad de DOI normalizados distintos relacionados con el work.
      - name: has_doi
        description: Indica si el work se relaciona con al menos un DOI.
      - name: has_single_doi
        description: Indica si el work se relaciona con exactamente un DOI normalizado.
      - name: mag
        description: Identificador MAG del work cuando es unívoco o `null` si no existe o es ambiguo.
      - name: mag_count
        description: Cantidad de identificadores MAG distintos relacionados con el work.
      - name: has_mag
        description: Indica si el work se relaciona con al menos un identificador MAG.
      - name: has_single_mag
        description: Indica si el work se relaciona con exactamente un identificador MAG.
      - name: pmcid
        description: PMCID del work cuando es unívoco o `null` si no existe o es ambiguo.
      - name: pmcid_count
        description: Cantidad de PMCID distintos relacionados con el work.
      - name: has_pmcid
        description: Indica si el work se relaciona con al menos un PMCID.
      - name: has_single_pmcid
        description: Indica si el work se relaciona con exactamente un PMCID.
      - name: pmid
        description: PMID del work cuando es unívoco o `null` si no existe o es ambiguo.
      - name: pmid_count
        description: Cantidad de PMID distintos relacionados con el work.
      - name: has_pmid
        description: Indica si el work se relaciona con al menos un PMID.
      - name: has_single_pmid
        description: Indica si el work se relaciona con exactamente un PMID.
      - name: cited_by_count
        description: Cantidad de citas según OpenAlex.
      - name: fwci
        description: Field-Weighted Citation Impact (si está disponible).
      - name: citation_normalized_percentile_value
        description: Valor de percentil de citas normalizado (si está disponible).

  - name: brg_openalex_work_author
    description: >
      Bridge obra–autor construido desde la relación histórica de OpenAlex.
      Presenta la identidad canónica del autor cuando está disponible y conserva
      como respaldo el nombre, ORCID y posición observados en la autoría.
    config:
      tags: [dm]
    columns:
      - name: work_author_hk
        description: Clave hash del vínculo work-author.
        data_tests: [not_null, unique]
      - name: work_hk
        data_tests: [not_null]
      - name: author_hk
        data_tests: [not_null]
      - name: canonical_display_name
        description: Nombre canónico proveniente de `dim_openalex_author`.
      - name: fallback_display_name
        description: Nombre observado en la autoría cuando no existe un nombre canónico.
      - name: fallback_orcid
        description: ORCID observado en la autoría.
      - name: author_position
        description: Posición del autor observada en la publicación.

  - name: brg_openalex_work_authorship
    description: Bridge obra-authorship-autor para conservar la granularidad observada en el payload de OpenAlex.
    config:
      tags: [dm]
    columns:
      - name: work_authorship_hk
        data_tests: [not_null]
      - name: work_hk
        data_tests: [not_null]
      - name: author_hk
        data_tests: [not_null]
      - name: authorship_hk
        data_tests: [not_null]

  - name: brg_openalex_work_institution
    description: Bridge obra–institución (afiliaciones institucionales asociadas a works).
    config:
      tags: [dm]
    columns:
      - name: work_institution_hk
        description: Clave hash del vínculo work-institution.
        data_tests: [not_null, unique]
      - name: work_hk
        data_tests: [not_null]
      - name: institution_hk
        data_tests: [not_null]

  - name: brg_openalex_author_institution
    description: Bridge autor–institución (afiliaciones institucionales asociadas a authors).
    config:
      tags: [dm]
    columns:
      - name: author_institution_hk
        description: Clave hash del vínculo author-institution.
        data_tests: [not_null, unique]
      - name: author_hk
        data_tests: [not_null]
      - name: institution_hk
        data_tests: [not_null]

  - name: brg_openalex_work_topic
    description: Bridge obra–tópico (asignaciones temáticas por tópico).
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_hk, topic_hk]
    columns:
      - name: work_hk
        data_tests: [not_null]
      - name: topic_hk
        data_tests: [not_null]

  - name: brg_openalex_work_primarytopic
    description: Bridge obra–tópico primario con score (tópico principal asignado por OpenAlex).
    config:
      tags: [dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_hk, topic_hk]
    columns:
      - name: work_hk
        data_tests: [not_null]
      - name: topic_hk
        data_tests: [not_null]
      - name: primarytopic_score
        description: Score de asignación del tópico primario.

  - name: brg_openalex_work_primarylocation
    description: >
      Bridge obra–source principal (`primary_location`) con atributos propios de
      esa relación, incluyendo licencia e identificadores del source principal.
    config:
      tags: [dm]
    columns:
      - name: work_hk
        data_tests: [not_null, unique]
      - name: source_hk
        data_tests: [not_null]
      - name: source_display_name
        description: Nombre del source asociado a `primary_location`.
      - name: source_issn_l
        description: ISSN-L del source asociado a `primary_location`.
      - name: license
        description: Licencia informada en `primary_location`.
      - name: license_id
        description: Identificador de licencia informado en `primary_location`.
