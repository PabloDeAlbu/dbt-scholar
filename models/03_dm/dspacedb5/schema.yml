version: 2

models:
  # dm: expone datasets analíticos vigentes y trazabilidad mínima, no mecánica DV.
  - name: brg_dspacedb5_collection_metadatavalue
    description: >
      Bridge de colección con valores de metadatos y su campo asociado, construido desde DV para
      la rama `dspacedb5`.
    config:
      tags: [dspacedb5, dm]

  - name: brg_dspacedb5_community_metadatavalue
    description: >
      Bridge de comunidad con valores de metadatos y su campo asociado, construido desde DV para
      la rama `dspacedb5`.
    config:
      tags: [dspacedb5, dm]

  - name: brg_dspacedb5_item_metadatavalue
    description: >
      Bridge de item con valores de metadatos y su campo asociado, construido desde DV para la
      rama `dspacedb5`. Se apoya en el último estado conocido del vínculo item-metadatavalue para
      evitar reconstruir la relación desde el tlink genérico recurso-metadato.
    config:
      tags: [dspacedb5, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_hk, metadatavalue_hk]
    columns:
      - name: item_hk
        data_tests: [not_null]
      - name: item_id
        data_tests: [not_null]
      - name: metadatavalue_hk
        data_tests: [not_null]
      - name: metadata_value_id
        data_tests: [not_null]
      - name: metadatafield_hk
        data_tests: [not_null]
      - name: metadata_field_id
        data_tests: [not_null]
      - name: metadatafield_fullname
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]

  - name: fct_dspacedb5_item_metadatafield_usage
    description: >
      Hecho agregado de uso de campos de metadatos por ítem para la rama `dspacedb5`.
      Resume una fila por `item_hk + metadatafield_hk` con conteos y valores textuales
      agregados para acelerar consumos analíticos que no necesitan el nivel atómico de
      `brg_dspacedb5_item_metadatavalue`.
    config:
      tags: [dspacedb5, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_hk, metadatafield_hk]
    columns:
      - name: item_hk
        data_tests: [not_null]
      - name: item_id
        data_tests: [not_null]
      - name: metadatafield_hk
        data_tests: [not_null]
      - name: metadatafield_fullname
        data_tests: [not_null]
      - name: metadatafield_name
        data_tests: [not_null]
      - name: metadata_field_id
        data_tests: [not_null]
      - name: metadata_value_count
        data_tests: [not_null]
      - name: metadata_value_id_count
        data_tests: [not_null]
      - name: distinct_nonempty_text_value_count
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]

  - name: dim_dspacedb5_collection
    description: >
      Dimensión de colecciones DSpace 5 contextualizadas por repositorio e institución, con título
      preferido derivado de `dc.title`.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: collection_hk
        data_tests: [not_null, unique]
      - name: collection_id
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]

  - name: dim_dspacedb5_community
    description: >
      Dimensión de comunidades DSpace 5 con jerarquía inmediata y comunidad raíz para facilitar
      agrupamientos por comunidad base y filtros por subárbol.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: community_hk
        data_tests: [not_null, unique]
      - name: community_id
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]

  - name: brg_dspacedb5_item_collection
    description: >
      Bridge item-colección para DSpace 5. Expone todas las colecciones asociadas al item y la
      cantidad total de colecciones observadas por item.
    config:
      tags: [dspacedb5, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_hk, collection_hk]
    columns:
      - name: item_hk
        data_tests: [not_null]
      - name: collection_hk
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]

  - name: latest_sat_dspacedb5_item
    description: Estado más reciente de `sat_dspacedb5_item`, a grano `item_hk`.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: item_hk
        data_tests: [not_null, unique]
      - name: load_datetime
        data_tests: [not_null]

  - name: latest_sat_dspacedb5_item__scope
    description: >
      Estado más reciente del scope e identificadores operativos de item.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: item_hk
        data_tests: [not_null, unique]
      - name: item_id
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]
      - name: owningcollection_hk
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: latest_sat_dspacedb5_item_metadatavalue
    description: >
      Estado más reciente de `sat_dspacedb5_item_metadatavalue`, a grano
      `item_metadatavalue_hk`.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: item_metadatavalue_hk
        data_tests: [not_null, unique]
      - name: item_hk
        data_tests: [not_null]
      - name: metadatavalue_hk
        data_tests: [not_null]
      - name: metadata_value_id
        data_tests: [not_null]

  - name: dim_dspacedb5_metadatavalue
    description: >
      Proyección vigente de valores de metadatos DSpace 5. Funciona como helper
      para bridges y dimensiones derivadas.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: metadatavalue_hk
        data_tests: [not_null, unique]
      - name: text_value
      - name: text_lang
      - name: place
      - name: authority
      - name: confidence

  - name: fct_dspacedb5_extraction
    description: >
      Hecho de extracciones por scope DSpace 5. Sirve para auditoría y
      ventanas de observación, no para presentación final.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: extract_cdk
        data_tests: [not_null, unique]
      - name: scope_hk
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]
      - name: extract_datetime
        data_tests: [not_null]
      - name: load_datetime
        data_tests: [not_null]

  - name: fct_dspacedb5_item_publication
    description: >
      Hecho vigente de publicaciones DSpace 5 a nivel item. Expone scope,
      estado actual del item y relaciones analíticas; evita linaje fino.
    config:
      tags: [dspacedb5, dm]
    columns:
      - name: item_hk
        data_tests: [not_null, unique]
      - name: item_id
        data_tests: [not_null]
      - name: owningcollection_hk
      - name: collections_count
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]

  - name: brg_dspacedb5_item_community
    description: >
      Bridge analítica item-colección-comunidad para DSpace 5. Representa la
      pertenencia de cada ítem publicado a sus colecciones y comunidades
      asociadas, y permite agrupar por comunidad inmediata o raíz y filtrar por
      ramas jerárquicas específicas.
    config:
      tags: [dspacedb5, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_hk, collection_hk]
    columns:
      - name: item_hk
        data_tests: [not_null]
      - name: collection_hk
        data_tests: [not_null]
      - name: community_hk
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]

  - name: dim_dspacedb5_metadatafield
    description: Dimensión de campos de metadatos DSpace 5 por scope.
    config:
      tags: [dspacedb5, dm]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [metadatafield_fullname, source_label, institution_ror, base_url]
    columns:
      - name: metadatafield_fullname
        data_tests: [not_null]
      - name: source_label
        data_tests: [not_null]
      - name: institution_ror
        data_tests: [not_null]
      - name: base_url
        data_tests: [not_null]
      - name: metadatafield_hk
        data_tests: [not_null, unique]
