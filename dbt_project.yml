# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_scholar'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dw'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  # Config indicated by + and applies to all files under models/example/
  dbt_scholar:
    +materialized: table
    01_ldg:
      coar:
        +schema: coar
        +tags: [coar]
      google_scholar:
        +schema: google_scholar
        +tags: [google_scholar]
      unlp:
        +schema: unlp
        +tags: [unlp]
      dspacedb:
        +schema: dspacedb
        +tags: [dspacedb]
      dspacedb5:
        +schema: dspacedb5
        +tags: [dspacedb5]
      oai:
        +schema: oai
        +tags: [oai]
      openaire:
        +schema: openaire
        +tags: [openaire]
      openalex:
        +schema: openalex
        +tags: [openalex]
      vocsedici:
        +schema: vocsedici
        +tags: [vocsedici]
    02_dv:
      coar:
        +schema: coar
        +tags: [coar]
      dspacedb:
        +schema: dspacedb
        +tags: [dspacedb]
      dspacedb5:
        +schema: dspacedb5
        +tags: [dspacedb5]
      oai:
        +schema: oai
        +tags: [oai]
      openaire:
        +schema: openaire
        +tags: [openaire]
      openalex:
        +schema: openalex
        +tags: [openalex]
      vocsedici:
        +schema: vocsedici
        +tags: [vocsedici]
    03_dm:
      # Nuevo layout objetivo: modelos dimensionales globales por fuente
      # directamente bajo `models/03_dm/<fuente>/`.
      coar:
        +schema: coar
        +tags: [coar]
      dspacedb:
        +schema: dspacedb
        +tags: [dspacedb]
      dspacedb5:
        +schema: dspacedb5
        +tags: [dspacedb5]
      oai:
        +schema: oai
        +tags: [oai]
      openaire:
        +schema: openaire
        +tags: [openaire]
      openalex:
        +schema: openalex
        +tags: [openalex]

    04_org:
      # Nuevo layout objetivo: vistas institucionales por organización y fuente
      # bajo `models/04_org/<org>/<fuente>/`, materializando en schemas `dm_*`.
      cic:
        +schema: cic
        +tags: [cic]
        dspacedb:
          +schema: cic
          +tags: [cic, dspacedb]
        openalex:
          +schema: cic
          +tags: [cic, openalex]
        openaire:
          +schema: cic
          +tags: [cic, openaire]
      conicet:
        +schema: conicet
        +tags: [conicet]
        audit:
          +schema: conicet
          +tags: [conicet, audit]
        oai:
          +schema: conicet
          +tags: [conicet, oai]
        openalex:
          +schema: conicet
          +tags: [conicet, openalex]
        openaire:
          +schema: conicet
          +tags: [conicet, openaire]
      smn:
        +schema: smn
        +tags: [smn]
        dspace5db:
          +schema: smn
          +tags: [smn, dspace5db]
      unlp:
        +schema: unlp
        +tags: [unlp]
        google_scholar:
          +schema: unlp_google_scholar
          +tags: [unlp, google_scholar]
        openalex:
          +schema: unlp_openalex
          +tags: [unlp, openalex]
        openaire:
          +schema: unlp_openaire
          +tags: [unlp, openaire]
        sedici:
          +schema: unlp_sedici
          +tags: [unlp, sedici]
        vocsedici:
          +schema: unlp
          +tags: [unlp, vocsedici]
    04_viz:
      core:
        audit:
          +schema: audit
        dspacedb:
          +schema: dspacedb
          +tags: [dspacedb]
        openaire:
          +schema: openaire
          +tags: [openaire]
        openalex:
          +schema: openalex
          +tags: [openalex]
      custom:
        unlp:
          +schema: unlp
          +tags: [unlp]
          00_base:
            +schema: unlp_base
          conicet_center_candidate:
            +schema: unlp_conicet_center_candidate
          dspace5db:
            +schema: unlp_dspace5db
          openaire:
            +schema: unlp_openaire
          sedici:
            +schema: unlp_sedici
    05_analytics:
      custom:
        conicet:
          +schema: conicet
          +tags: [conicet, analytics]
          +materialized: table
        unlp:
          +schema: unlp
          +tags: [unlp, analytics]
          +materialized: table
seeds:
  dbt_scholar:
    coar:
      +schema: coar
      +tags: [coar]
    conicet:
      +schema: conicet
      +tags: [conicet]
    dspacedb:
      +schema: dspacedb
      +tags: [dspacedb]
    dspacedb5:
      +schema: dspacedb5
      +tags: [dspacedb5]
    openaire:
      +schema: openaire
      +tags: [openaire]
    openalex:
      +schema: openalex
      +tags: [openalex]
    unlp:
      +schema: unlp
      +tags: [unlp]
      seed_centros_conicet_unlp:
        +column_types:
          set_spec: text
          pdf_share_pct: text
          set_name: text
          sedici_collection_uri: text
          faculty: text
          sedici_article_count: text
          manual_status: text
          ingest_note: text
      seed_conicet_sedici_imported_items:
        +column_types:
          batch_name: text
          mapfile_item_key: text
          sedici_item_id: integer
      seed_unlp_domain_unit_map:
        +column_types:
          dependency_domain: text
          dependency_domain_label: text
          dependency_name: text
          parent_unit_name: text

data_tests:
  +store_failures: true
  +schema: dbt_test_failures

vars:
    "dbt_date:time_zone": "America/Argentina/Buenos_Aires"

    # Ejemplo cic. Usar sin protocolo y sin `/` final.
    dspacedb_base_url: "digital.cic.gba.gob.ar"
    dspacedb_institution_ror: "https://ror.org/02s7sax82"

    # Valores requeridos para dumps `dspacedb5`.
    # Deben pisarse por CLI con `--vars`.
    dspacedb5_base_url: "__REQUIRED__"
    dspacedb5_source_label: "__REQUIRED__"
    dspacedb5_institution_ror: "__REQUIRED__"
    dspacedb5_extract_datetime: ""
    dspacedb5_load_datetime: ""

    # Ejemplo oai con conicet:
    oai_repository_identifier: "ri.conicet.gov.ar"
    oai_institution_ror: "https://ror.org/03cqe8w59"
